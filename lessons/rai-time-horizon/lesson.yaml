    nl: "METR, [*Time Horizon 1.1*](https://metr.org/blog/2026-01-29-time-horizon-1-1/) (29 januari 2026) (in het Engels)"
  - en: "Thomas Kwa and Vincent Cheng, [*How Does Time Horizon Vary Across Domains?*](https://metr.org/blog/2025-07-14-how-does-time-horizon-vary-across-domains/) (METR, 14 July 2025)"
    nl: "Thomas Kwa en Vincent Cheng, [*How Does Time Horizon Vary Across Domains?*](https://metr.org/blog/2025-07-14-how-does-time-horizon-vary-across-domains/) (METR, 14 juli 2025) (in het Engels)"
  - en: "METR, [*AI R&D-relevant model capabilities are improving rapidly and are getting harder to measure*](https://metr.org/blog/2026-11-20-q4-2026-capability-update/) (20 November 2026)"
    nl: "METR, [*AI R&D-relevant model capabilities are improving rapidly and are getting harder to measure*](https://metr.org/blog/2026-11-20-q4-2026-capability-update/) (20 november 2026) (in het Engels)"
