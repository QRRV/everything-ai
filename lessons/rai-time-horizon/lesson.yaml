    nl: "Thomas Kwa en anderen, [*Measuring AI Ability to Complete Long Software Tasks*](https://arxiv.org/abs/2503.14499) (METR, versie van 10 juli 2026; de eerste versie, van 18 maart 2025, heette *Measuring AI Ability to Complete Long Tasks*) (in het Engels)"
  - en: "METR, [*Measuring AI Ability to Complete Long Software Tasks*](https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/) (blog post of 19 March 2025)"
    nl: "METR, [*Measuring AI Ability to Complete Long Software Tasks*](https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/) (blogpost van 19 maart 2025) (in het Engels)"
  - en: "METR, [*Task-Completion Time Horizons of Frontier AI Models*](https://metr.org/time-horizons/) (last updated 8 September 2026), with the data under CC BY 4.0"
    nl: "METR, [*Task-Completion Time Horizons of Frontier AI Models*](https://metr.org/time-horizons/) (laatst bijgewerkt op 8 september 2026), met de data onder CC BY 4.0 (in het Engels)"
