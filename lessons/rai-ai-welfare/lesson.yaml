    nl: "Anil Seth, [*Conscious artificial intelligence and biological naturalism*](https://sussex.figshare.com/articles/journal_contribution/Conscious_artificial_intelligence_and_biological_naturalism/28649519) (geaccepteerd manuscript voor *Behavioral and Brain Sciences*, 24 april 2025) (in het Engels)"
  - en: "Mustafa Suleyman, [*We must build AI for people; not to be a person.*](https://mustafa-suleyman.ai/seemingly-conscious-ai-is-coming) (19 August 2025)"
    nl: "Mustafa Suleyman, [*We must build AI for people; not to be a person.*](https://mustafa-suleyman.ai/seemingly-conscious-ai-is-coming) (19 augustus 2025) (in het Engels)"
