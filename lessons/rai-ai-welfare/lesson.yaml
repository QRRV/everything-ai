    nl: "Jonathan Birch, [*The Edge of Sentience: Risk and Precaution in Humans, Other Animals, and AI*](https://researchonline.lse.ac.uk/id/eprint/126246/) (Oxford University Press, 2024, vrij toegankelijk) (in het Engels)"
