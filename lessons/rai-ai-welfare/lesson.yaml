    nl: "Agnieszka Jaworska en Julie Tannenbaum, [*The Grounds of Moral Status*](https://plato.stanford.edu/entries/grounds-moral-status/) (Stanford Encyclopedia of Philosophy, ingrijpend herzien op 3 maart 2021) (in het Engels)"
  - en: "Robert Long and colleagues, [*Taking AI Welfare Seriously*](https://arxiv.org/abs/2411.00986) (preprint, version 1 of 4 November 2024)"
    nl: "Robert Long en collega's, [*Taking AI Welfare Seriously*](https://arxiv.org/abs/2411.00986) (preprint, versie 1 van 4 november 2024) (in het Engels)"
  - en: "Patrick Butlin and colleagues, [*Consciousness in Artificial Intelligence: Insights from the Science of Consciousness*](https://arxiv.org/abs/2308.08708) (preprint, version of 22 August 2023)"
    nl: "Patrick Butlin en collega's, [*Consciousness in Artificial Intelligence: Insights from the Science of Consciousness*](https://arxiv.org/abs/2308.08708) (preprint, versie van 22 augustus 2023) (in het Engels)"
