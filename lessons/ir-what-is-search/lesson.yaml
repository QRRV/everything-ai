# What this lesson says about itself, in both languages. Level, place and prerequisites come from the route data.
id: ir-what-is-search
minutes: 35
title:
  en: "Search: needs and relevance"
  nl: "Zoeken: informatiebehoefte en relevantie"
goal:
  en: "tell the information need behind a search apart from the words typed, build the simplest search engine, one that returns every document with all the words of a query, judge its results against a need, and guess the kind of need from the words, as rules for web search do."
  nl: "de informatiebehoefte achter een zoekvraag onderscheiden van de getypte woorden, de eenvoudigste zoekmachine bouwen, een zoekmachine die elk document met alle woorden van een zoekvraag teruggeeft, de resultaten beoordelen op een informatiebehoefte, en de soort informatiebehoefte raden uit de woorden, zoals regels voor zoeken op het web dat doen."
summary:
  - en: "Information retrieval is finding, in a large collection, the documents that help with an information need. The information need is what someone wants to know or do; the search query is the few words typed to say it, often two or three on the web. One query can stand for different needs, such as *python* for the snake or the language."
    nl: "Information retrieval is in een grote verzameling de documenten vinden die helpen bij een informatiebehoefte. De informatiebehoefte is wat iemand wil weten of doen; de zoekvraag bestaat uit de paar woorden die iemand typt om dat uit te drukken, op het web vaak twee of drie. Eén zoekvraag kan voor verschillende informatiebehoeften staan, zoals *python* voor de slang of de taal."
  - en: "A document is relevant when it helps with the need, not because it holds the words of the query. A search on exact words returns documents that hold every word and do not help, and misses relevant documents that use other words, such as *pythons* or *ultraviolet*. Judging a search means sorting its results into found and extra, and finding the relevant documents it missed."
    nl: "Een document is relevant als het helpt bij de informatiebehoefte, niet omdat de woorden van de zoekvraag erin staan. Zoeken op precies de woorden geeft documenten met elk woord die niet helpen, en mist relevante documenten met andere woorden, zoals *koningspythons* of *ultraviolet*. Een zoekmachine beoordelen is de resultaten indelen in gevonden en te veel, en de relevante documenten vinden die de zoekmachine miste."
  - en: "Broder (2002) sorted the needs behind web searches into navigational, informational and transactional. Rules on clue words can guess the kind, but words and need can point different ways. To measure search engines, TREC writes each need out as a topic and has people judge the documents; Google has about 16,000 raters judge its results."
    nl: "Broder (2002) deelde de informatiebehoeften achter zoekvragen op het web in als navigationeel, informationeel en transactioneel. Regels met aanwijzingen kunnen de soort raden, maar woorden en informatiebehoefte kunnen verschillende kanten op wijzen. Om zoekmachines te meten schrijft TREC elke informatiebehoefte uit als onderwerp en laat mensen de documenten beoordelen; Google laat ongeveer 16.000 raters de resultaten beoordelen."
can_now:
  - en: "write the simplest search engine: a test that a document holds every word of a query"
    nl: "de eenvoudigste zoekmachine schrijven: een test of een document elk woord van een zoekvraag bevat"
    by: matches
  - en: "judge the results of a search against an information need: the results that help, the ones that do not, and the relevant documents missed"
    nl: "de resultaten van een zoekvraag beoordelen op een informatiebehoefte: de resultaten die helpen, de resultaten die niet helpen, en de gemiste relevante documenten"
    by: split
  - en: "guess whether a search is navigational, informational or transactional from clue words, and say where such rules go wrong"
    nl: "raden of een zoekvraag navigationeel, informationeel of transactioneel is aan de hand van aanwijzingen, en zeggen waar zulke regels de fout in gaan"
    by: kind_of
  - en: "sort documents against a written-out need into found, missed and extra for a query"
    nl: "documenten bij een uitgeschreven informatiebehoefte indelen in gevonden, gemist en te veel voor een zoekvraag"
    by: judge
further_reading:
  - en: "Christopher D. Manning, Prabhakar Raghavan and Hinrich Schütze, [*Introduction to Information Retrieval*](https://nlp.stanford.edu/IR-book/), Cambridge University Press, 2008, chapter 1 and section 8.1: information needs, queries and relevance, and test collections; section 19.4 on the three kinds of web search"
    nl: "Christopher D. Manning, Prabhakar Raghavan en Hinrich Schütze, [*Introduction to Information Retrieval*](https://nlp.stanford.edu/IR-book/), Cambridge University Press, 2008, hoofdstuk 1 en paragraaf 8.1: informatiebehoeften, zoekvragen en relevantie, en testverzamelingen; paragraaf 19.4 over de drie soorten zoekvragen op het web (in het Engels)"
  - en: "Andrei Broder, [*A taxonomy of web search*](https://doi.org/10.1145/792550.792552), SIGIR Forum 36(2), 2002: navigational, informational and transactional searches"
    nl: "Andrei Broder, [*A taxonomy of web search*](https://doi.org/10.1145/792550.792552), SIGIR Forum 36(2), 2002: navigationele, informationele en transactionele zoekvragen (in het Engels)"
  - en: "Bernard J. Jansen, Danielle L. Booth and Amanda Spink, [*Determining the informational, navigational, and transactional intent of Web queries*](https://doi.org/10.1016/j.ipm.2007.07.015), Information Processing & Management 44(3), 2008: rules that sort 1.5 million searches by kind"
    nl: "Bernard J. Jansen, Danielle L. Booth en Amanda Spink, [*Determining the informational, navigational, and transactional intent of Web queries*](https://doi.org/10.1016/j.ipm.2007.07.015), Information Processing & Management 44(3), 2008: regels die 1,5 miljoen zoekvragen naar soort indelen (in het Engels)"
  - en: "Ellen M. Voorhees, [*Variations in relevance judgments and the measurement of retrieval effectiveness*](https://www.nist.gov/node/710491), Information Processing & Management 36(5), 2000: how much judges of relevance differ, and why comparisons of search systems hold up"
    nl: "Ellen M. Voorhees, [*Variations in relevance judgments and the measurement of retrieval effectiveness*](https://www.nist.gov/node/710491), Information Processing & Management 36(5), 2000: hoeveel beoordelaars van relevantie verschillen, en waarom vergelijkingen van zoeksystemen toch standhouden (in het Engels)"
