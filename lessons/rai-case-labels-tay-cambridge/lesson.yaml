    nl: "Information Commissioner's Office (2020), [brief aan Julian Knight MP over het onderzoek naar Cambridge Analytica](https://cy.ico.org.uk/media2/migrated/2618383/20201002_ico-o-ed-l-rtl-0181_to-julian-knight-mp.pdf)"
