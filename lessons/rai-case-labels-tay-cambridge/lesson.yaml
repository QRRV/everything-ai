    nl: "Federal Trade Commission (2019), [*FTC Sues Cambridge Analytica, Settles with Former CEO and App Developer*](https://ftc.gov/news-events/press-releases/2019/07/ftc-sues-cambridge-analytica-settles-former-ceo-app-developer)"
  - en: "Federal Trade Commission (2019), [*FTC Imposes $5 Billion Penalty and Sweeping New Privacy Restrictions on Facebook*](https://www.ftc.gov/news-events/news/press-releases/2019/07/ftc-imposes-5-billion-penalty-sweeping-new-privacy-restrictions-facebook)"
    nl: "Federal Trade Commission (2019), [*FTC Imposes $5 Billion Penalty and Sweeping New Privacy Restrictions on Facebook*](https://www.ftc.gov/news-events/news/press-releases/2019/07/ftc-imposes-5-billion-penalty-sweeping-new-privacy-restrictions-facebook)"
