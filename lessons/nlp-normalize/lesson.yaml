# What this lesson says about itself, in both languages. Level, place and prerequisites come from the route data.
id: nlp-normalize
minutes: 45
title:
  en: "Normalizing: case, accents and stop words"
  nl: "Normaliseren: hoofdletters, accenten en stop words"
goal:
  en: "make words small and take their accents off with Unicode's form NFD, keep the capitals of names, leave out stop words with Snowball's lists, and count on Tatoeba and in books what each step merges and throws away."
  nl: "woorden klein maken en de accenten eraf halen met de vorm NFD van Unicode, de hoofdletters van namen houden, stop words weglaten met de lijsten van Snowball, en op Tatoeba en in boeken tellen wat elke stap samenvoegt en weggooit."
summary:
  - en: "A program compares strings code point by code point, so *Café* and *cafe* are two words to it. Text normalization rewrites text into one standard form first. Case folding makes every letter small; truecasing decides for each capital whether it stays, so that the first word of a sentence becomes small and a name keeps its capital."
    nl: "Een programma vergelijkt strings code point voor code point, dus *Café* en *cafe* zijn voor een programma twee woorden. Text normalization zet tekst eerst om naar één standaardvorm. Case folding maakt elke letter klein; truecasing beslist voor elke hoofdletter of de hoofdletter blijft, zodat het eerste woord van een zin klein wordt en een naam de hoofdletter houdt."
  - en: "Unicode can write é as one code point, or as e followed by a combining mark. The form NFD takes every letter apart from its marks, and leaving out the characters for which `unicodedata.combining` is not 0 takes the accents off. That makes *naïef* and *naief* one word, but also *één* (one) and *een* (a)."
    nl: "Unicode kan é schrijven als één code point, of als e gevolgd door een combinerend teken. De vorm NFD haalt elke letter los van de tekens erop, en de tekens weglaten waarvoor `unicodedata.combining` geen 0 geeft, haalt de accenten eraf. Zo worden *naïef* en *naief* één woord, maar ook *één* en *een*."
  - en: "Stop words are very common words such as *de* and *the* that a program leaves out. A short list of them covers a large part of every text, and it also holds words that carry the meaning, such as *niet*: with Snowball's English list, *to be or not to be* disappears altogether."
    nl: "Stop words zijn heel gewone woorden zoals *de* en *the* die een programma weglaat. Een korte lijst ervan beslaat een groot deel van elke tekst, en bevat ook woorden die de betekenis dragen, zoals *niet*: met de Engelse lijst van Snowball verdwijnt *to be or not to be* volledig."
  - en: "Each step throws information away that does not come back: *US* and *us*, *Wenen* the city and *wenen* the verb. Most search engines have moved away from stop lists, BERT comes in an uncased and a cased version, and GPT-2 keeps every byte of the text."
    nl: "Elke stap gooit informatie weg die niet terugkomt: *US* en *us*, *Wenen* de stad en *wenen* het werkwoord. De meeste zoekmachines zijn van stop lists afgestapt, BERT is er in een uncased en een cased versie, en GPT-2 houdt elke byte van de tekst."
can_now:
  - en: "make a word small and take its accents off with the form NFD and `unicodedata.combining`, and see which forms that merges"
    nl: "een woord klein maken en de accenten eraf halen met de vorm NFD en `unicodedata.combining`, en zien welke vormen dat samenvoegt"
    by: fold
  - en: "make only the first word of a sentence small, keep the names with a list, and see where such a list falls short"
    nl: "alleen het eerste woord van een zin klein maken, de namen houden met een lijst, en zien waar zo'n lijst tekortschiet"
    by: truecase
  - en: "leave the stop words out of a list of words, and count what goes with them, such as every *niet*"
    nl: "de stop words uit een lijst woorden weglaten, en tellen wat ermee verdwijnt, zoals elke *niet*"
    by: drop-stop-words
  - en: "tell whether a task can fold case and accents, needs the capitals, or needs the small words"
    nl: "zeggen of een taak hoofdletters en accenten kan weghalen, de hoofdletters nodig heeft, of de kleine woorden"
    by: what-to-keep
further_reading:
  - en: "Christopher D. Manning, Prabhakar Raghavan and Hinrich Schütze, [*Introduction to Information Retrieval*](https://nlp.stanford.edu/IR-book/), Cambridge University Press, 2008, sections 2.2.2 and 2.2.3: stop words, and normalizing terms by case, accents and more"
    nl: "Christopher D. Manning, Prabhakar Raghavan en Hinrich Schütze, [*Introduction to Information Retrieval*](https://nlp.stanford.edu/IR-book/), Cambridge University Press, 2008, paragrafen 2.2.2 en 2.2.3: stop words, en termen normaliseren op hoofdletters, accenten en meer (in het Engels)"
  - en: "Daniel Jurafsky and James H. Martin, [*Speech and Language Processing*](https://web.stanford.edu/~jurafsky/slp3/), draft of August 19, 2026, section 2.1 of the chapter *Words and Tokens*, on whether *They* and *they* are one word, and section 11.1.3 of the chapter *Retrieval-based Models*, on stop lists"
    nl: "Daniel Jurafsky en James H. Martin, [*Speech and Language Processing*](https://web.stanford.edu/~jurafsky/slp3/), conceptversie van 19 augustus 2026, paragraaf 2.1 van het hoofdstuk *Words and Tokens*, over de vraag of *They* en *they* één woord zijn, en paragraaf 11.1.3 van het hoofdstuk *Retrieval-based Models*, over stop lists (in het Engels)"
  - en: "The Unicode Consortium, [*Unicode Normalization Forms*](https://www.unicode.org/reports/tr15/), Unicode Standard Annex #15: canonical equivalence and the forms NFC and NFD"
    nl: "Het Unicode Consortium, [*Unicode Normalization Forms*](https://www.unicode.org/reports/tr15/), Unicode Standard Annex #15: canonieke equivalentie en de vormen NFC en NFD (in het Engels)"
  - en: "The Python documentation, [*Unicode HOWTO*](https://docs.python.org/3.13/howto/unicode.html): code points, combining characters, and comparing strings with `unicodedata.normalize` and `casefold()`"
    nl: "De documentatie van Python, [*Unicode HOWTO*](https://docs.python.org/3.13/howto/unicode.html): code points, combinerende tekens, en strings vergelijken met `unicodedata.normalize` en `casefold()` (in het Engels)"
  - en: "Taaladvies.net, [*Klemtoonteken (algemeen)*](https://taaladvies.net/klemtoonteken-algemeen/): when Dutch puts an accent on a word to change how it is read, and why *Eén* gets none on its capital (in Dutch)"
    nl: "Taaladvies.net, [*Klemtoonteken (algemeen)*](https://taaladvies.net/klemtoonteken-algemeen/): wanneer je in het Nederlands een accent op een woord zet zodat de lezer het woord goed leest, en waarom *Eén* geen accent op de hoofdletter krijgt"
