    nl: "Federal Court of Australia (2021), [*Prygodicz v Commonwealth of Australia (No 2)*, samenvatting van de uitspraak](https://www.judgments.fedcourt.gov.au/judgments/Judgments/fca/single/2021/2021fca0634/summaries/2021fca0634-summary), over de schikking over Robodebt"
  - en: "Prime Minister of Australia (2023), [*Final report of the Royal Commission into the Robodebt Scheme*](https://www.pm.gov.au/media/final-report-royal-commission-robodebt-scheme)"
    nl: "Prime Minister of Australia (2023), [*Final report of the Royal Commission into the Robodebt Scheme*](https://www.pm.gov.au/media/final-report-royal-commission-robodebt-scheme)"
  - en: "Ofqual (2020), [*Awarding GCSE, AS, A level, advanced extension awards and extended project qualifications in summer 2020: interim report*](https://www.gov.uk/government/publications/awarding-gcse-as-a-levels-in-summer-2020-interim-report)"
    nl: "Ofqual (2020), [*Awarding GCSE, AS, A level, advanced extension awards and extended project qualifications in summer 2020: interim report*](https://www.gov.uk/government/publications/awarding-gcse-as-a-levels-in-summer-2020-interim-report)"
  - en: "Stapleton, Cheng and others (2022), [*How Child Welfare Workers Reduce Racial Disparities in Algorithmic Decisions*](https://arxiv.org/pdf/2204.13872.pdf), on the Allegheny Family Screening Tool"
    nl: "Stapleton, Cheng en anderen (2022), [*How Child Welfare Workers Reduce Racial Disparities in Algorithmic Decisions*](https://arxiv.org/pdf/2204.13872.pdf), over het hulpmiddel van Allegheny"
  - en: "Virginia Eubanks (2018), *Automating Inequality*, St. Martin's Press, among other things on the Allegheny tool"
    nl: "Virginia Eubanks (2018), *Automating Inequality*, St. Martin's Press, onder meer over het hulpmiddel van Allegheny"
