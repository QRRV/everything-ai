# What this lesson says about itself, in both languages. Level, place and prerequisites come from the route data.
id: py-dicts
minutes: 15
title:
  en: "Dictionaries"
  nl: "Dictionaries"
goal:
  en: "keep values under keys in a dictionary, look them up, change and add pairs, and count with a dictionary in a loop."
  nl: "waarden onder keys bewaren in een dictionary, ze opzoeken, paren veranderen en toevoegen, en tellen met een dictionary in een loop."
summary:
  - en: "A dictionary keeps pairs of a key and a value: `prices = {\"apple\": 0.5, \"pear\": 0.75}`. `prices[\"pear\"]` gives the value under the key `\"pear\"`."
    nl: "Een dictionary bewaart paren van een key en een waarde: `prices = {\"apple\": 0.5, \"pear\": 0.75}`. `prices[\"pear\"]` geeft de waarde onder de key `\"pear\"`."
  - en: "`prices[\"plum\"] = 0.3` changes a value or adds a new pair; each key is there only once. `\"plum\" in prices` checks whether a key is there."
    nl: "`prices[\"plum\"] = 0.3` verandert een waarde of voegt een nieuw paar toe; elke key staat er maar één keer in. `\"plum\" in prices` kijkt of een key erin staat."
  - en: "`for fruit in prices:` goes through the keys; `prices[fruit]` gives each value."
    nl: "`for fruit in prices:` gaat langs de keys; `prices[fruit]` geeft elke waarde."
can_now:
  - en: "look up a value by its key"
    nl: "een waarde opzoeken met de key"
    by: capital
  - en: "say what a loop over a dictionary goes through"
    nl: "zeggen waar een loop over een dictionary langs gaat"
    by: keys
  - en: "count with a dictionary in a loop"
    nl: "tellen met een dictionary in een loop"
    by: count
