# What this lesson says about itself, in both languages. Level, place and prerequisites come from the route data.
id: start-map-of-ai
minutes: 12
title:
  en: "The map of AI and how this course is organized"
  nl: "De kaart van AI en hoe deze course in elkaar zit"
goal:
  en: "find your way on the map of the course: tell a domain, a level and a route apart, and pick a route that fits your goal."
  nl: "je weg vinden op de kaart van de course: een domein, een niveau en een route uit elkaar houden, en een route kiezen die bij je doel past."
summary:
  - en: "AI is a big field. The course lays it out as a map: the core, which everyone takes first, and domains for the parts of AI, which all build on the core."
    nl: "AI is een groot vakgebied. De course brengt het in kaart: de kern, die iedereen eerst doet, en domeinen voor de delen van AI, die allemaal op de kern voortbouwen."
  - en: "A level says how advanced a lesson is: basics, intermediate or expert. No lesson is locked."
    nl: "Een niveau zegt hoe gevorderd een les is: basis, gevorderd of expert. Geen enkele les zit op slot."
  - en: "A route is an order of lessons. The core is the first route, each domain has a route that starts where the core ends, and a goal route takes only the lessons your goal builds on."
    nl: "Een route is een volgorde van lessen. De kern is de eerste route, elk domein heeft een route die begint waar de kern ophoudt, en een doelroute bevat alleen de lessen waar jouw doel op voortbouwt."
can_now:
  - en: "pick a route that fits your goal"
    nl: "een route kiezen die bij je doel past"
    by: pick-route
  - en: "say whether something is a domain, a level or a route"
    nl: "zeggen of iets een domein, een niveau of een route is"
    by: kinds
  - en: "explain how the domains hang together"
    nl: "uitleggen hoe de domeinen met elkaar samenhangen"
    by: foundation
