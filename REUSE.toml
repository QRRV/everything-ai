# Licences of files that cannot carry their own header. See https://reuse.software.
# Text and figures: CC-BY-SA-4.0. Lesson code: MIT-0. The app: MIT. Bundled fonts: OFL-1.1.
version = 1

[[annotations]]
path = ["course/**", "docs/**", "lessons/**/*.yaml", "lessons/**/*.md", "lessons/**/*.txt", "lessons/**/*.csv", "lessons/**/*.png", "README.md", "README.nl.md", "AGENTS.md", "CLAUDE.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Everything AI contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["src/everything_ai/web/kleuren.css", "src/everything_ai/web/theme.css", "src/everything_ai/tokens.json",
        "pyproject.toml", "uv.lock", ".python-version", ".gitignore", "REUSE.toml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Everything AI contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "src/everything_ai/web/fonts.css"
precedence = "override"
SPDX-FileCopyrightText = [
    "2016 The Inter Project Authors (https://github.com/rsms/inter)",
    "2014-2023 Adobe (http://www.adobe.com/), with Reserved Font Name 'Source'",
    "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)",
]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "docs/**/*.py"
precedence = "override"
SPDX-FileCopyrightText = "2026 Everything AI contributors"
SPDX-License-Identifier = "MIT"

# Extracts of third-party texts, kept only in the private development repository. Not ours to license.
[[annotations]]
path = "docs/onderzoek/**/bronnen/**"
precedence = "override"
SPDX-FileCopyrightText = "Their respective authors; each file names its source"
SPDX-License-Identifier = "LicenseRef-Third-Party-Excerpts"

