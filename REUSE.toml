precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Everything AI contributors"
SPDX-License-Identifier = "MIT"

# The drawings on the start page are figures.
[[annotations]]
path = "src/everything_ai/web/beelden/*.svg"
precedence = "aggregate"
