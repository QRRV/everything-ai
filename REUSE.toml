version = 1

[[annotations]]
path = ["course/**", "docs/**", "lessons/**/*.yaml", "lessons/**/*.md", "lessons/**/*.txt", "lessons/**/*.csv", "lessons/**/*.json", "lessons/**/*.png", "README.md", "README.nl.md", "AGENTS.md", "CLAUDE.md"]
