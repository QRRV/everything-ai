# Everything AI als fundament plus gelijkwaardige domeinen: de opzet van de course (besluit 1.18 in
# docs/beslissingen/besluiten.md). Uitleg en onderbouwing: docs/onderzoek/reports/Voorstel structuur Everything AI.md
# (voorstel van 6 november 2026, aangenomen op 13 november). tools/check_structuur.py controleert dit bestand tegen de
# onderwerpenkaart (v2.3) en de lessen; tools/check_route.py draait die controle mee. Formaat: FORMAT.md.
#
# Opbouw
#   fundament: wat meerdere domeinen nodig hebben. Modules met `kern: true` doet iedereen voordat die een domein kiest;
#              de andere modules van het fundament zijn gedeelde modules, die een domein pas binnenhaalt als het ze nodig heeft.
#   domeinen:  gelijkwaardige domeinen, elk met de niveaus basis, gevorderd en expert, een lopend project en een eindproject.
#
# Een les zegt zelf waar hij hoort, met `domein` (fundament of een domein hieronder) en `module` in lessen/*.yaml.
#
# Velden van een module
#   onderwerpen: kaartonderwerpen. `onderwerp` betekent: alle niveaus van dat onderwerp die nog niet elders geclaimd zijn.
#                `onderwerp@basis` (of @gevorderd, @expert, of meerdere met een plus: @gevorderd+expert) claimt alleen die niveaus.
#                `onderwerp#3` (of #3+4) claimt losse subonderwerpen (hun nummer in de kaart, vanaf 0); dat gaat voor alles.
#                Basis = N1 en N2, gevorderd = N3, expert = N4 en N5 (zoals in de kaart).
#   nieuw:       nieuwe lessen die het voorstel noemt (werktitels); de rest volgt uit de subonderwerpen.
#   tekst:       de lessen op hoofdlijnen.
#   proef:       bij een nieuwe proefles in het fundament: het domein waar de les een voorproefje van is.
#
# Velden van een domein (naast titel, doel, eindproject, papers en modules)
#   project:     het lopende project: `id` (wat een projectles in zijn veld `project` noemt), `titel`, wat het per niveau
#                oplevert, en `eindles` zodra de les van het eindproject bestaat. Het fundament heeft ook een project.
#   proef:       de lessen in de kern die al een voorproefje van dit domein zijn, of `nieuw`.
#   gebruikt:    de gedeelde modules van het fundament die dit domein binnenhaalt, bij het niveau waarop het ze voor het eerst nodig heeft.
#   begint:      `gevorderd` voor een domein waarvan de basis in de kern zit (onderzoek, deep learning in de diepte).
#
# Uitzonderingen, elk met de reden erbij
#   verbanden_ok:  onderwerpen die twee of meer domeinen nodig hebben, maar toch in één domein blijven (een verband).
#   fundament_ok:  plekken waar de kaart zegt dat het fundament iets uit een domein vraagt, en waarom dat niet zo is.
#   les_ok:        lessen die alleen subonderwerpen van een ander deel dekken, en waarom ze toch hier staan.
#
# De namen die de app toont, in beide talen, staan in ../display.yaml.

versie: 1
kaart: v2.3

# Groepen waarin de app de domeinen toont, naar de lagen van de onderwerpenkaart.
groepen:
- id: modaliteiten
  titel: "Taal, beeld en geluid"
  domeinen: [taal, llm, beeld, spraak, generatief]
- id: leren-en-beslissen
  titel: "Leren, redeneren en beslissen"
  domeinen: [klassiek-ml, rl, onzekerheid, klassieke-ai, multi-agent]
- id: bouwen-en-inzetten
  titel: "Bouwen en inzetten"
  domeinen: [bouwen, systemen, robotica, toepassingen]
- id: mens-en-veiligheid
  titel: "Veiligheid, mens en maatschappij"
  domeinen: [verantwoord, mens]
- id: verdieping
  titel: "Verdieping en onderzoek"
  domeinen: [dl-verdieping, onderzoek]

# Onderwerpen die twee of meer andere domeinen nodig hebben maar toch in hun eigen domein blijven (gedeelde-regel, zie check_structuur.py).
# De andere domeinen lenen dan de lessen van dat domein; de app neemt ze vanzelf op in je pad.
verbanden_ok:
- {onderwerp: diffusiemodellen, niveau: basis, voor: [llm, spraak],
   reden: "Het hart van generatief. LLM's (diffusie-taalmodellen) en spraak (audio genereren) lenen de module Diffusie."}
- {onderwerp: 3d-vision, niveau: basis, voor: [generatief, robotica],
   reden: "Het hart van de module 3D in beeld. Robotica (waarnemen) en generatief (3D genereren) lenen die module."}
- {onderwerp: workflows-en-agentpatronen, niveau: basis, voor: [multi-agent, toepassingen],
   reden: "Het hart van de module Agents in bouwen. Multi-agent (LLM-agents die samenwerken) en toepassingen (onderzoeksagents) lenen die module; de basis van agents zit al in de kern."}
- {onderwerp: workflows-en-agentpatronen, niveau: gevorderd, voor: [multi-agent, toepassingen],
   reden: "Zelfde module, het gevorderde deel (state machines en de agent-harness)."}
- {onderwerp: agentraamwerk, niveau: gevorderd, voor: [multi-agent, robotica, toepassingen, verantwoord],
   reden: "Eén subonderwerp (reactieve en gelaagde agentarchitecturen) in de module Zoeken van klassieke AI; de basis van het agentraamwerk zit in de kern."}
- {onderwerp: klassieke-taalmodellen, niveau: gevorderd, voor: [llm, spraak],
   reden: "Taal legt n-grammodellen in de diepte uit (smoothing, het noisy-channelmodel); perplexity, wat LLM's en spraak vooral nodig hebben, zit in de gedeelde module Attention."}
- {onderwerp: data-engineering-voor-ml, niveau: gevorderd, voor: [llm, verantwoord],
   reden: "Het hart van Data voor ML in systemen; LLM's (data op webschaal) en verantwoord (privacy bij dataverwerking) lenen die module."}
- {onderwerp: metric-learning-en-semi-supervised-leren, niveau: gevorderd, voor: [beeld, spraak],
   reden: "Contrastive en triplet loss staan in Representaties leren (deep learning in de diepte); beeld (gezichten, zoeken in foto's) en spraak (sprekers) lenen die les."}
- {onderwerp: self-supervised-learning, niveau: gevorderd, voor: [generatief, spraak, beeld],
   reden: "Het hart van Representaties leren; generatief, spraak (wav2vec) en beeld (DINO) lenen die module."}
- {onderwerp: anomaliedetectie, niveau: gevorderd, voor: [beeld, toepassingen, verantwoord],
   reden: "De basis zit in de kern; de methoden op gevorderd niveau (LOF, isolation forest, reconstructie) staan in klassieke ML en worden geleend."}
- {onderwerp: probabilistisch-redeneren-over-tijd, niveau: gevorderd, voor: [beeld, robotica, spraak],
   reden: "Het hart van de module Onzekerheid over tijd, die ook de Bayesiaanse netwerken van het domein nodig heeft; beeld (volgen), robotica (lokaliseren) en spraak (HMM's) lenen die module."}
- {onderwerp: onzekerheid-en-conformal-prediction, niveau: basis, voor: [klassiek-ml, verantwoord],
   reden: "Het hart van Onzekerheid uitdrukken in het domein onzekerheid; klassieke ML en verantwoord lenen het."}
- {onderwerp: onzekerheid-en-conformal-prediction, niveau: gevorderd, voor: [klassiek-ml, verantwoord],
   reden: "Zelfde module, het gevorderde deel (conformal prediction)."}

# Voorkennis uit de kaart die het fundament niet zelf geeft, met de reden waarom dat mag (zie check_structuur.py).
fundament_ok:
- onderwerp: convolutionele-netwerken
  voorkennis: beelden-als-data
  reden: "de CNN-module heeft van het gevorderde deel van beelden als data alleen de voorbewerking voor netwerken nodig (normaliseren, formaat), en dat subonderwerp zit in de module zelf; datasetbias in beeld blijft in het domein beeld."
- onderwerp: subword-tokenisatie
  voorkennis: morfologie
  reden: "voor de basis van tokens (waarom subwords, tokenizers gebruiken en tokens tellen) is taalkunde niet nodig; de kaart noemt morfologie voor BPE op gevorderd niveau, en dat deel zit in het domein LLM's, dat taal hiervoor leent."

# Bestaande lessen die alleen subonderwerpen van een ander deel dekken, met de reden waarom ze toch hier staan.
les_ok:
- les: cv-image-search
  reden: "zoeken in foto's met de features van een pretrained model; de les dekt 'embeddings gebruiken: zoeken, clusteren en visualiseren', dat in de kern hoort (bouwen, taal en klassieke ML gebruiken het ook). Bij het omzetten krijgt de kern daar een korte algemene les voor, die cv-image-search vraagt en op foto's toepast; tot die les er is, legt cv-image-search het uit."
- les: cv-augment-photos
  reden: "augmentatie op kleurenfoto's; de les dekt het subonderwerp data-augmentatie van regularisatie, dat in de kern hoort omdat ook tekst en spraak het gebruiken. Tot de kern daar een korte algemene les voor krijgt, legt cv-augment-photos het uit en meet het wat het op CIFAR-10 oplevert."
- les: cv-1x1-convolution
  reden: "de 1×1-convolutie staat in de kaart bij convolutionele netwerken (de gedeelde module cnn), maar alleen Inception, ResNeXt en de families daarna gebruiken hem; daarom staat de les bij de CNN-families."
- les: cv-saliency
  reden: "saliency maps zijn een uitlegmethode (verantwoord, module uitleggen); de les staat in beeld omdat je ze meteen op je eigen CNN toepast, net als Grad-CAM in de les erna. Verantwoord leent deze les."

fundament:
  id: fundament
  titel: "Fundament"
  titel_en: "Foundations"
  doel: "Alles wat meerdere domeinen nodig hebben: Python, data, de wiskunde, hoe een model leert, neurale netwerken, PyTorch, de bouwstenen, een eerste taalmodel, en van elk domein een voorproefje."
  project:
    id: nn
    titel: "Je eigen neurale netwerk: van één neuron met de hand tot een diep netwerk in PyTorch"
    eindles: nn-deep-net-project
  modules:

  # ---------------- kern: iedereen, voordat je kiest ----------------
  - id: start
    kern: true
    titel: "Start"
    onderwerpen: [definities-en-framings, ai-geletterdheid-voor-gebruikers, prompt-basis, ai-ondersteund-programmeren#0, geschiedenis#2+4+6+8+9]
    tekst: "Hoe de course werkt, wat AI, ML en generatieve AI zijn, regels tegenover leren, de kaart van het vakgebied, en een chatassistent gebruiken met open ogen: wat hij kan, waar hij de mist in gaat, hoe je goed vraagt en hoe je controleert."

  - id: python
    kern: true
    titel: "Python"
    onderwerpen: [python@basis, notebooks, ontwikkelomgeving-tracking-en-reproduceerbaarheid#0]
    tekst: "Van je eerste programma tot klassen, generators en decorators, met de regels voor notebooks. Het projectje dat letters telt in een boek wordt later je eerste taalmodel."

  - id: numpy
    kern: true
    titel: "NumPy"
    onderwerpen: [numpy-en-scipy@basis, numerieke-wiskunde#2]
    tekst: "Arrays, indexeren, vectoriseren, assen, broadcasting en toeval."

  - id: data
    kern: true
    titel: "Data"
    onderwerpen: [dataframes, tidy-data-en-cleaning, eda-en-visualisatie, beelden-als-data#0+4,
                  tekstverwerking#0, datasetdocumentatie#0+1, data-engineering-voor-ml#0, causaliteit-basis#0+1]
    tekst: "pandas, beschrijven, verkennen, groeperen, samenvoegen, ontbrekende waarden, waar data vandaan komt, samenhang tussen twee kolommen, en een afbeelding en een tekst als getallen."

  - id: eerste-model
    kern: true
    titel: "Je eerste model"
    onderwerpen: [notatie-en-wiskundig-redeneren@basis, lineaire-algebra@basis, calculus@basis, optimalisatie@basis,
                  wat-ml-is, de-ml-workflow, loss-en-empirical-risk-minimization@basis, lineaire-regressie-en-uitbreidingen@basis,
                  scikit-learn@basis]
    tekst: "Een model is een functie, residuen en MSE, met de hand fitten, de helling meten, gradient descent in 1D en 2D, vectoren en matrices, de kettingregel, lineaire regressie in NumPy en daarna scikit-learn."

  - id: classificatie
    kern: true
    titel: "Classificatie"
    onderwerpen: [kansrekening@basis, statistiek@basis, informatietheorie@basis, lineaire-classificatie@basis, onzekerheid-kwantificeren#1+2]
    tekst: "Kansrekening en Bayes, exp en log, sigmoid, logistische regressie met log loss en de gradiënt (p − y)·x, softmax en cross-entropy."

  - id: generalisatie
    kern: true
    titel: "Generaliseren"
    onderwerpen: [evaluatie-en-modelselectie@basis, d10-evaluatiemetrics@basis, baselines-en-error-analysis@basis, feature-engineering@basis,
                  instance-based-leren-en-naive-bayes#0, waarom-ai-ethiek#0, bronnen-van-bias#1,
                  onevenwichtige-data#0, beeldclassificatie#2]
    tekst: "Train/test-split, overfitting, de validatieset, k-nearest neighbours, cross-validation, bias en variance, regularisatie, confusion matrix, F1, ROC en AUC, maatstaven voor regressie, baselines, wie er in de data zit, en je eerste complete ML-project."

  - id: meer-modellen
    kern: true
    titel: "Meer modellen"
    onderwerpen: [bomen-en-ensembles@basis, data-leakage@basis]
    tekst: "De beslisboom, random forest, gradient boosting, data leakage, pipelines en een eerlijke vergelijking. Ook het voorproefje van klassieke ML (besluit 1.13)."

  - id: zonder-labels
    kern: true
    titel: "Zonder labels"
    onderwerpen: [clustering@basis, dimensiereductie@basis, anomaliedetectie@basis]
    tekst: "k-means, k kiezen, PCA als de beste schaduw, en afwijkende punten vinden met z-scores en de IQR."

  - id: neurale-netwerken
    kern: true
    titel: "Neurale netwerken"
    onderwerpen: [wat-een-neuraal-netwerk-is, lineaire-modellen-als-netwerk-en-de-perceptron@basis, multilayer-perceptron@basis,
                  backpropagation-en-computational-graphs@basis, minimale-frameworks@basis, activaties-en-loss-functions@basis,
                  numerieke-wiskunde#1]
    tekst: "Neuron, XOR, een verborgen laag, backprop met de hand en je eigen autograd (micrograd)."

  - id: pytorch
    kern: true
    titel: "PyTorch"
    onderwerpen: [tensors-en-autograd, frameworks@basis, d11-de-trainingslus@basis, pretrained-modellen-via-hubs,
                  transfer-learning-en-fine-tuning@basis, generalisatie-trainingsdynamiek-en-hpo@basis, regularisatie@basis,
                  optimizers#0, compute-geletterdheid#0+1, gpu-programmeren#0]
    tekst: "Tensors, autograd, nn.Module, optimizer, batches, een MLP op cijfers, de GPU, loss-curves, checkpoints, early stopping, een model van een hub, en een getraind netwerk hergebruiken."

  - id: bouwstenen-idee
    kern: true
    titel: "Bouwstenen als idee"
    onderwerpen: [embeddings-en-similariteit@basis, convolutionele-netwerken@basis, recurrente-netwerken@basis, attention-en-transformers@basis,
                  representatieleren#0, neurale-nlp#5]
    nieuw:
    - titel: "Embeddings gebruiken: zoeken, clusteren en een kaart maken"
    tekst: "Embeddings, convolutie, recurrentie en attention, elk als idee in één les, en embeddings gebruiken om te zoeken en te clusteren (beeld, taal, bouwen en klassieke ML passen dat later toe). De uitwerking zit in de gedeelde modules."

  - id: agents
    kern: true
    titel: "Agents"
    onderwerpen: [agentraamwerk@basis, wat-een-agent-is, wat-rl-is, probleemformulering-en-zoekinfrastructuur#0+2, ongeinformeerd-zoeken#0, exploratie#0,
                  heuristisch-zoeken#1, spellen-als-zoekprobleem#1, mdp-s-bellman-en-pomdp-s#1, dynamic-programming#2, temporal-difference-learning#1]
    tekst: "Wat een agent is, ook een LLM-agent, en wat reinforcement learning is; zoeken in een doolhof met BFS en A*, minimax, value iteration en Q-learning. Ook het voorproefje van klassieke AI en RL (besluit 1.13)."

  - id: taalmodellen
    kern: true
    titel: "Taalmodellen"
    onderwerpen: [wat-nlp-is#0+1+2+3, subword-tokenisatie@basis, klassieke-taalmodellen@basis, token-embeddings-en-output-head@basis,
                  autoregressieve-generatie-en-sampling#0, pretraining-doelen-en-databronnen#2]
    tekst: "Wat een taalmodel is, tokens, een bigrammodel door te tellen, samplen, de loss, smoothing, en hetzelfde model geleerd met gradient descent. Temperature, top-k, base- en chatmodellen, hallucinatie en de families van modellen zitten in het domein LLM's, naive Bayes in taal. In het fundament omdat de transformer, die taal, beeld, generatief en spraak delen, hierop voortbouwt, en omdat bouwen, verantwoord en mens LLM's als gereedschap gebruiken."

  - id: onderzoek-basis
    kern: true
    titel: "Onderzoek lezen"
    onderwerpen: [d27-wetenschappelijke-geletterdheid, d27-hoe-ai-onderzoek-werkt#0]
    tekst: "Wat een paper is, claims lezen, figuren en tabellen lezen, de onderzoekscyclus."

  - id: grafen-en-ruimte
    kern: true
    titel: "Grafen en ruimte"
    onderwerpen: [discrete-wiskunde-en-grafen@basis, meetkunde-en-transformaties@basis, lineaire-algebra#3]
    nieuw:
    - {titel: "Verzamelingen, logica en tellen"}
    - {titel: "Grafen: knopen, kanten en paden"}
    - {titel: "Coördinaten, lijnen en vlakken, en een vorm verschuiven, draaien en schalen met een matrix"}
    tekst: "Verzamelingen en logica, tellen (permutaties en combinaties), grafen, en coördinaten met verschuiven, draaien en schalen. Klassieke ML, klassieke AI, multi-agent, taal, beeld en robotica hebben dit al op basisniveau nodig; zoeken in een doolhof (agents) is al zoeken in een graaf."

  - id: proeven
    kern: true
    titel: "Proeven van elk domein"
    onderwerpen: [fundamenten-van-generatief-modelleren#0, audio-fundamenten#0+1, wat-een-robot-is#0+2, niet-cooperatieve-speltheorie#0+4,
                  wat-ai-in-de-wetenschap-doet#0, moravec-s-paradox-en-embodiment#0, ai-act-opbouw-en-verboden-praktijken#0+2,
                  profiling-en-prestatiemetrics#0+1, theorie-expressiviteit-en-loss-landscapes#0]
    nieuw:
    - {titel: "Een machine die iets nieuws maakt: nieuwe cijfers samplen uit een geleerde verdeling", proef: generatief}
    - {titel: "Geluid als getallen: een golf en een spectrogram", proef: spraak}
    - {titel: "Waarnemen, denken, doen: een gesimuleerde robot die een lijn volgt", proef: robotica}
    - {titel: "Samenwerken of verraden: een toernooi van strategieën in het prisoner's dilemma", proef: multi-agent}
    - {titel: "AI in een vakgebied: een echte vraag uit de wetenschap met open data", proef: toepassingen}
    - {titel: "Mens en machine: waar mensen goed in zijn en machines niet (Moravec), en wat de AI Act verbiedt", proef: mens}
    - {titel: "Hoe snel is je model? FLOPs, FLOP/s, tokens per seconde en waar de tijd heen gaat", proef: systemen}
    - {titel: "Waarom kan een netwerk alles leren? De universele benaderingsstelling, en een netwerk dat zelfs willekeurige labels uit zijn hoofd leert", proef: dl-verdieping}
    - {titel: "Kies je domein: de kaart van alle domeinen, hun projecten en hoe ze samenhangen", proef: null}
    tekst: "Acht korte proeflessen voor de domeinen die er nog geen goede in het fundament hebben, en een les waarin je je domein kiest. De andere domeinen hebben hun proefles al: beeld (afbeeldingen als getallen, convolutie), taal en LLM's (de taalmodellen), klassieke ML, klassieke AI en RL (meer modellen, zonder labels, agents), onzekerheid (Bayes, samenhang en oorzaak), verantwoord (wie er in de data zit), bouwen (AI-hulpmiddelen gebruiken) en onderzoek."

  # ---------------- gedeelde modules: binnengehaald door de domeinen die ze nodig hebben ----------------
  - id: data-bronnen
    titel: "Python, SQL en data verder"
    onderwerpen: [python@gevorderd, notebooks#2+3, eda-en-visualisatie#4+6, scikit-learn#3, feature-engineering#3+4+5,
                  sql-en-databronnen, data-engineering-voor-ml@basis, dataframes@gevorderd, tidy-data-en-cleaning@gevorderd, eda-en-visualisatie@gevorderd, feature-engineering@gevorderd, numpy-en-scipy@gevorderd, scikit-learn@gevorderd+expert]
    tekst: "Snellere en nettere Python (profileren, onderzoekscode structureren, typecontrole), tabellen uit een database halen met SQL, waar trainingsdata vandaan komt en hoe je die opslaat en samplet, data schoonmaken op schaal, betere figuren, features maken en SciPy. Nodig voor klassieke ML, systemen, LLM's, verantwoord en toepassingen."

  - id: wiskunde
    titel: "Wiskunde formeel"
    onderwerpen: [notatie-en-wiskundig-redeneren@gevorderd, lineaire-algebra@gevorderd, calculus@gevorderd, optimalisatie@gevorderd,
                  kansrekening@gevorderd, statistiek@gevorderd, informatietheorie@gevorderd, numerieke-wiskunde, d2-matrixdecomposities-en-spectrale-methoden,
                  dimensiereductie#1+3, d2-stochastische-processen-en-monte-carlo, d2-optimalisatie-voor-ml-gevorderd, d2-analyse-en-functionaalanalyse]
    tekst: "Afgeleiden, partiële afgeleiden, matrixcalculus, rang, verdelingen, entropie, cross-entropy en KL, maximum likelihood, rekenen met floats, bootstrap; daarna eigenwaarden, SVD en PCA formeel, numerieke methoden, Markov-ketens en Monte Carlo, en op expertniveau optimalisatie en analyse voor de theorie."

  - id: signalen-en-meetkunde
    titel: "Signalen, meetkunde en grafen"
    onderwerpen: [complexe-getallen, fourier-analyse-en-signaalverwerking, meetkunde-en-transformaties, differentiaalvergelijkingen, discrete-wiskunde-en-grafen]
    nieuw:
    - {titel: "Sinus, cosinus en draaien met een matrix"}
    - {titel: "Een signaal als som van golven: de Fourier-transformatie"}
    - {titel: "Grafen: knopen, kanten en paden"}
    - {titel: "Een differentiaalvergelijking stap voor stap oplossen"}
    tekst: "Complexe getallen als draaiing, sinus en cosinus, rotatiematrices en coördinatenstelsels, de Fourier-transformatie en het spectrogram, differentiaalvergelijkingen met de Euler-stap, grafen en hun algoritmen. Nodig voor beeld, spraak, robotica, generatief, klassieke AI en LLM's (RoPE). Dit stuk van het fundament ontbreekt nu bijna helemaal."

  - id: trainen
    titel: "Diepe netwerken trainen"
    onderwerpen: [lineaire-modellen-als-netwerk-en-de-perceptron@gevorderd, multilayer-perceptron@gevorderd, activaties-en-loss-functions@gevorderd,
                  backpropagation-en-computational-graphs@gevorderd+expert, automatic-differentiation, initialisatie-en-parametrisatie, normalisatielagen,
                  d11-de-trainingslus@gevorderd, optimizers, learning-rate-schedules, regularisatie@gevorderd, residuals-embeddings-en-conditioning,
                  generalisatie-trainingsdynamiek-en-hpo@gevorderd, frameworks@gevorderd, minimale-frameworks@gevorderd, embeddings-en-similariteit@gevorderd,
                  transfer-learning-en-fine-tuning@gevorderd, loss-en-empirical-risk-minimization@gevorderd, frameworks#2]
    tekst: "Backprop door hele lagen, vanishing gradients, initialisatie, BatchNorm, LayerNorm, residuals, momentum, Adam en AdamW, schema's voor de learning rate, dropout, de embedding-laag, een eigen trainer en een diep netwerk dat echt traint; op expertniveau µP, Shampoo en Muon, en autodiff van binnen."

  - id: klassieke-modellen-formeel
    titel: "Lineaire modellen en evaluatie, formeel"
