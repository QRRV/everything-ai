# Datasets and models that route lessons and papers use, by the id in their "data" field.
# License facts come from licenties/reports/ (the license thread owns them); this file only records which one the route picks.
# hosting: rehost = the course may host a copy; download = learners fetch it from upstream, pinned to a revision and hash;
#          synthetic = generated by lesson code; tbd = still to choose.
# checkpoints: false = the course does not hand out models trained on it; a lesson that trains on it lists the data of
#          the course's own reference checkpoint in reference_data.
# Format: FORMAT.md.

bronnen:
- {id: tiny-shakespeare, kind: text, license: "public domain", hosting: rehost}
- {id: tinystories, kind: text, license: "CDLA-Sharing-1.0", hosting: rehost, checkpoints: false,
   note_nl: "Gemaakt met GPT-3.5 en GPT-4. Leerlingen trainen erop op hun eigen pc; de referentie-checkpoints van de course komen uit cosmopedia, tot de licentie-thread anders beslist."}
- {id: tinystories-instruct, kind: text, license: "to check", hosting: tbd, checkpoints: false,
   note_nl: "Licentie staat niet in het licentierapport. Geen les gebruikt het: llm-sft en llm-lora maken hun eigen instructies voor de verhalen (synthetic-story-prompts)."}
- {id: fineweb-edu-sample-download-only, kind: text, license: "ODC-By-1.0 plus Common Crawl terms", hosting: download, checkpoints: false,
   note_nl: "Alleen voor wie het zelf wil proberen. De ODC-By-licentie dekt alleen de verzameling, niet de teksten zelf, dus de course traint er geen checkpoint op dat ze verspreidt."}
- {id: cosmopedia, kind: text, license: "Apache-2.0", hosting: rehost,
   note_nl: "Gemaakt met Mixtral (Apache-2.0). De course traint hier al haar eigen referentie-checkpoints op: de nachtrun en de LLM-projectstappen (het deel stories, en voor SFT de paren van prompt en tekst)."}
- {id: c4-noclean-sample-download-only, kind: text, license: "ODC-By-1.0 plus Common Crawl terms", hosting: download, checkpoints: false,
   note_nl: "De eerste 20 MB van een shard van C4 van vóór het opschonen (allenai/c4, en.noclean, vastgelegd op commit en SHA-256 in hub.PINNED): ruwe webpagina's om quality filters op te oefenen. FineWeb is al gefilterd, dus te schoon daarvoor. Leerlingen downloaden het zelf; de course host er niets van en traint er geen model op dat ze deelt."}
- {id: fineweb-sample-download-only, kind: text, license: "ODC-By-1.0 plus Common Crawl terms", hosting: download, checkpoints: false,
   note_nl: "Een kleine ruwe webstaal om kwaliteitsfilters en deduplicatie op te oefenen; er wordt geen model op getraind dat de course verspreidt."}
- {id: oasst, kind: sft, license: "Apache-2.0", hosting: rehost,
   note_nl: "data/oasst-short.json: korte Engelse vragen met het antwoord dat mensen het beste vonden, voor llm-same-on-open-model."}
- {id: helpsteer2, kind: preference, license: "CC-BY-4.0", hosting: rehost,
   note_nl: "data/helpsteer2-short.json: korte paren met één beurt en een duidelijke voorkeur, voor llm-same-on-open-model."}
- {id: qmnist, kind: image, license: "BSD-3-Clause", hosting: rehost,
   note_nl: "Handgeschreven cijfers met een duidelijke licentie; MNIST zelf mag alleen gedownload worden."}
- {id: fashion-mnist, kind: image, license: "MIT", hosting: rehost,
   note_nl: "Kleine grijze plaatjes van kleding, schoenen en tassen in 10 soorten, van Zalando: moeilijker dan cijfers, en de course host een deel van 7.000 plaatjes zelf."}
- {id: cifar-10-download-only, kind: image, license: "no license stated", hosting: download, checkpoints: false,
   note_nl: "Alleen downloaden, nooit zelf hosten; ethiekopmerking over 80M Tiny Images."}
- {id: course-photos, kind: image, license: "CC0-1.0 and public domain", hosting: rehost,
   note_nl: "Een paar foto's zonder auteursrecht uit de voorbeeldbeelden van scikit-image (CC0 of public domain; bron en licentie per foto komen in data/README.md met de les cv-image-files), kleiner gemaakt: voor de lessen over beelden bewerken. Geen mensen erop."}
- {id: course-scenes, kind: image, license: "course (MIT-0 code)", hosting: synthetic,
   note_nl: "Scènes die de course zelf maakt: eenvoudige vormen op een achtergrond, met de bounding box en het masker van elke vorm: voor detectie en segmentatie, zonder licentievragen en zonder mensen. De course mag er eigen modellen op trainen en delen."}
- {id: coco-annotations, kind: image, license: "CC-BY-4.0 (annotations only)", hosting: rehost,
   note_nl: "Alleen de annotaties van COCO (labels, bounding boxes, maskers en keypoints) om annotatievormen te laten zien; de foto's vallen onder de voorwaarden van Flickr; die host de course niet."}
- {id: caltech-101-download-only, kind: image, license: "CC-BY-4.0 on CaltechDATA; photos collected from the web", hosting: download, checkpoints: false,
   note_nl: "De fotoset van de tak beeld (besluit 1.14): de course haalt hem de eerste keer zelf op, zonder de twee klassen met gezichten, en deelt geen model dat erop getraind is, omdat het auteursrecht op de foto's niet bij Caltech ligt."}
- {id: model-resnet18-imagenet, kind: model, license: "BSD-3-Clause code; weights trained on ImageNet, terms unclear", hosting: download,
   note_nl: "ResNet-18 met de gewichten van torchvision, getraind op ImageNet (besluit 1.14): de course haalt ze de eerste keer zelf op, deelt ze nooit en zegt in de les dat hun status onduidelijk is. Een model dat de leerling ermee fine-tunet, blijft op zijn eigen pc."}
- {id: imagenet-class-names, kind: text, license: "BSD-3-Clause", hosting: rehost,
   note_nl: "De namen van de 1000 klassen van ImageNet, in de volgorde van de logits, uit de code van torchvision (BSD-3-Clause), zodat de lessen de gokken van ResNet-18 bij naam noemen. Alleen namen, geen foto's."}
- {id: model-dinov2-small, kind: model, license: "Apache-2.0", hosting: download,
   note_nl: "facebook/dinov2-small, een Vision Transformer van 22 miljoen parameters, getraind op LVD-142M (rond ImageNet en andere sets samengesteld): de backbone voor features. De course schrijft de modelcode zelf, zoals bij Qwen3."}
- {id: model-detr-resnet50, kind: model, license: "Apache-2.0; trained on COCO", hosting: download,
   note_nl: "facebook/detr-resnet-50 (Carion e.a. 2020), een detector van 41,5 miljoen parameters die op COCO getraind is, voor cv-pretrained-detector. Gekozen boven RT-DETR omdat zijn opbouw, een ResNet-50 en een gewone transformer, eenvoudig genoeg is om zelf uit te schrijven. De course schrijft de modelcode zelf, zoals bij DINOv2, en de test vergelijkt hem met de getallen uit de test van transformers."}
- {id: model-sam2-1-hiera-tiny, kind: model, license: "Apache-2.0; trained on SA-1B and SA-V", hosting: download,
   note_nl: "facebook/sam2.1-hiera-tiny (Ravi e.a. 2024), het kleinste model van SAM 2.1 (38,9 miljoen parameters, ongeveer 156 MB), voor cv-sam: tekent het mask van wat je aanwijst met een klik of een box. De course gebruikt het alleen op zijn eigen foto's en die van Caltech-101, zonder mensen. Wordt automatisch gedownload met een vaste versie. De course schrijft de modelcode zelf, alleen voor foto's (31,3 miljoen van de parameters, zonder het geheugen voor video), en de test vergelijkt hem met de getallen uit de test van transformers."}
- {id: palmer-penguins, kind: tabular, license: "CC0-1.0", hosting: rehost,
   note_nl: "344 pinguins, drie soorten, met ontbrekende waarden: klein genoeg voor de CPU en echt genoeg voor de hele workflow."}
- {id: metro-traffic, kind: tabular, license: "CC-BY-4.0", hosting: rehost,
   note_nl: "Metro Interstate Traffic Volume (UCI 492): verkeer per uur op de I-94 tussen Minneapolis en Saint Paul, westwaarts, 2012 tot 2018, met weer en feestdagen (48.204 rijen, 405 kB). Echt vuil: temperaturen van 0 kelvin, één uur met 9.831 mm regen, 7.629 dubbele uren en 2.588 gaten. Het project tabular van klassieke ML."}
- {id: bike-sharing, kind: tabular, license: "CC-BY-4.0", hosting: rehost,
   note_nl: "Bike Sharing (UCI 275, Fanaee-T en Gama 2013): fietsverhuur van Capital Bikeshare per uur en per dag in 2011 en 2012, met weer. Trend en seizoenen per dag, week en jaar, voor de lessen over tijdreeksen."}
- {id: online-retail-baskets, kind: tabular, license: "CC-BY-4.0", hosting: rehost,
   note_nl: "Afgeleid van Online Retail (UCI 352, Chen e.a. 2012): de bestellingen van een Britse webwinkel van december 2010 tot december 2011, alleen bestelnummer, klantnummer (al gepseudonimiseerd door de bron) en product, zonder annuleringen. Voor association rules en aanbevelen. Het script dat de course gebruikt, staat in data/tools/."}
- {id: openflights-routes, kind: tabular, license: "ODbL-1.0", hosting: download,
   note_nl: "Routes en vliegvelden van OpenFlights (67.663 routes tussen 3.321 vliegvelden, stand juni 2014), voor de les over netwerken. Gedownload bij de bron op een vaste commit met een vaste SHA-256; de course host er niets van, omdat ODbL share-alike vraagt voor afgeleide databases."}
- {id: ai4i-maintenance, kind: tabular, license: "CC-BY-4.0", hosting: rehost,
   note_nl: "AI4I 2020 Predictive Maintenance (UCI 601, Matzka 2020): 10.000 machines met 339 storingen (3,39%). Synthetisch: gemaakt om op echte onderhoudsdata te lijken, en de lessen zeggen dat. Voor onevenwichtige data en het zoeken naar instellingen."}
- {id: model-gpt2-mit, kind: model, license: "MIT", hosting: download}
- {id: tokenizer-gpt2-mit, kind: model, license: "MIT", hosting: rehost,
   note_nl: "Alleen de twee bestanden van de tokenizer van GPT-2, encoder.json en vocab.bpe (samen 1,5 MB), zodat tiktoken ook zonder internet werkt. Overgenomen uit het PyPI-wheel gpt3_tokenizer 0.1.5; de SHA-256 is die welke tiktoken vastzet, dus het zijn dezelfde bytes als die OpenAI publiceert."}
- {id: model-qwen3-0.6b-base, kind: model, license: "Apache-2.0", hosting: download}
- {id: model-course-qmnist-cnn, kind: model, license: "CC-BY-4.0 (the course; trained on QMNIST, BSD-3-Clause)", hosting: rehost,
   note_nl: "Een klein CNN dat de course zelf op QMNIST traint en met een model card op een model hub zet, zodat de les over hubs geen licentievragen oproept."}
- {id: model-course-gpt-bpe, kind: model, license: "CC-BY-4.0 (the course; trained on stories of Cosmopedia, Apache-2.0)", hosting: rehost,
   note_nl: "De kleine GPT op tokens van gpt-train-bpe (1,3 miljoen parameters, 1.000 merge rules), door de course getraind met haar eigen oplossingen op verhalen uit Cosmopedia, niet op TinyStories (besluit 7). Vangnet voor wie zelf geen GPT op tokens getraind heeft."}
- {id: model-course-modern-gpt, kind: model, license: "CC-BY-4.0 (the course; trained on stories of Cosmopedia, Apache-2.0)", hosting: rehost,
   note_nl: "De ModernGPT van llm-modern-gpt (1,2 miljoen parameters, RMSNorm, SwiGLU, RoPE en grouped-query attention), door de course getraind met haar eigen oplossingen op dezelfde verhalen uit Cosmopedia als model-course-gpt-bpe (besluit 7). Vangnet voor wie zelf geen ModernGPT getraind heeft: de les schrijft er dan mee met een KV cache."}
- {id: model-course-capstone, kind: model, license: "CC-BY-4.0 (the course; trained on stories of Cosmopedia, Apache-2.0)", hosting: rehost,
   note_nl: "Het model van llm-pretrain-capstone: diepte 6 van de familie uit llm-fit-scaling-law (3,1 miljoen parameters), door de course compute-optimal getraind op 20 tokens per parameter aan verhalen voor jonge kinderen uit shards 1 tot en met 4 van Cosmopedia (shard 0 bevat de vragen van story-cloze), met dezelfde code als de les, ruim vier uur op twee CPU-threads. Vangnet voor de lessen na de capstone, voor wie zelf geen model pretrainde (besluit 7)."}
- {id: model-course-sft, kind: model, license: "CC-BY-4.0 (the course; trained on stories of Cosmopedia, Apache-2.0)", hosting: rehost,
   note_nl: "Het model van llm-sft: model-course-capstone, door de course met dezelfde code als de les gefinetuned op instructies voor verhalen voor jonge kinderen uit shard 5 van Cosmopedia, elk met een of twee van zijn zelfstandige naamwoorden als gevraagde woorden. Vangnet voor de lessen na llm-sft, voor wie zelf geen model finetunede (besluit 7)."}
- {id: model-course-dpo, kind: model, license: "CC-BY-4.0 (the course; trained on answers of model-course-sft)", hosting: rehost,
   note_nl: "De adapters van llm-dpo: LoRA van rang 8 op model-course-sft, door de course met dezelfde code als de les getraind met DPO op de preference pairs uit course-dpo-answers. Vangnet voor de lessen na llm-dpo, voor wie zelf geen DPO draaide (besluit 7)."}
- {id: course-open-model, kind: text, license: "CC-BY-4.0 (the course; written by Qwen3-0.6B-Base, Apache-2.0, after SFT on OASST1, Apache-2.0, and DPO on HelpSteer2, CC-BY-4.0)", hosting: rehost,
   note_nl: "De run van de course van llm-same-on-open-model, met wat hij mat en de antwoorden van het model op drie vragen. data/course-open-model.json, gemaakt met data/tools/train_course_open_model.py. De course deelt geen adapters van Qwen3: de les meet en toont alleen."}
- {id: gsm8k-sample, kind: text, license: "MIT", hosting: rehost,
   note_nl: "data/gsm8k-sample.jsonl: de eerste 4 sommen van de trainset en de eerste 30 van de testset van GSM8K (Cobbe en anderen, 2021), zoals ze in openai/grade-school-math staan, gemaakt met data/tools/make_gsm8k_sample.py. Mensen schreven ze voor OpenAI, geen model van OpenAI. De course traint er niets op: in llm-reasoning-idea zijn ze de voorbeelden in de prompt en de vragen. Het licentierapport noemt kleine subsets bruikbaar."}
- {id: course-reasoning-qwen, kind: text, license: "CC-BY-4.0 (the course; written by Qwen3-0.6B-Base, Apache-2.0, to questions of GSM8K, MIT)", hosting: rehost,
   note_nl: "De run van de course van llm-reasoning-idea: de antwoorden van Qwen3-0.6B-Base op de 30 testvragen van gsm8k-sample, direct, met tussenstappen, zero-shot en 8 samples per vraag, elk met zijn tokens en seconden, en de demo van de les zoals hij op de CPU van de course liep. data/course-reasoning-qwen.json, gemaakt met data/tools/record_course_reasoning_qwen.py, met de code van de les."}
- {id: synthetic-multiplication, kind: synthetic, license: "course (MIT-0 code)", hosting: synthetic,
   note_nl: "Vermenigvuldigsommen van getallen van 1 tot 4 cijfers, met of zonder uitgeschreven tussenstappen (de deelproducten van rechts, dan de lopende sommen), door de code van llm-reasoning-from-scratch gemaakt tijdens het trainen; 200 paren van 2, 3 en 4 cijfers blijven buiten de training. Het formaat komt uit het onderzoek naar reasoning (docs/onderzoek/reports/reasoning/tiny/multiply.py)."}
- {id: course-reasoning-runs, kind: text, license: "CC-BY-4.0 (the course)", hosting: rehost,
   note_nl: "De runs van de course van llm-reasoning-from-scratch: de demo van de les met de oplossingen van de course, beide vormen op het CPU-plan en van het GPU-plan alleen het antwoord met 7.400 stappen (zijn runs van 1.800 stappen zijn die van het CPU-plan), elk met seeds 0, 1 en 2, alle op de CPU van de course met 2 threads, elk met zijn loss, de momenten voor het terugspoelen, de goede antwoorden per lengte en de seconden. data/course-reasoning-runs.json, gemaakt met data/tools/record_course_reasoning_runs.py, met de code van de les."}
- {id: model-course-arith-steps, kind: model, license: "CC-BY-4.0 (the course; trained on synthetic-multiplication, MIT-0)", hosting: rehost,
   note_nl: "Het model met tussenstappen van llm-reasoning-from-scratch: de ModernGPT van de course (d = 128, 4 blocks), seed 0 van het CPU-plan uit course-reasoning-runs, 2,9 MB. Vangnet voor wie de demo niet zelf draait: de les laat het dan sommen beantwoorden."}
- {id: model-course-arith-plain, kind: model, license: "CC-BY-4.0 (the course; trained on synthetic-multiplication, MIT-0)", hosting: rehost,
   note_nl: "Het model met alleen het antwoord van llm-reasoning-from-scratch: dezelfde ModernGPT, seed 0 van het CPU-plan uit course-reasoning-runs, 2,9 MB. Vangnet zoals model-course-arith-steps."}
- {id: course-dpo-answers, kind: text, license: "CC-BY-4.0 (the course; written by model-course-sft)", hosting: rehost,
   note_nl: "Vier antwoorden van model-course-sft op elk van 1.000 instructies met gevraagde woorden, uit verhalen voor jonge kinderen van shard 5 van Cosmopedia die het SFT-model niet zag; geen enkele is een testinstructie van llm-sft. data/course-dpo-answers.json, gemaakt met data/tools/make_course_dpo_answers.py."}
- {id: course-eval-chat, kind: text, license: "CC-BY-4.0 (the course; written by model-course-capstone, model-course-sft and model-course-dpo)", hosting: rehost,
   note_nl: "De antwoorden van de drie modellen van de course (basis, SFT, SFT met DPO) op de 200 prompts van llm-eval-chat: de 100 testinstructies van llm-sft, 50 om een verhaal zonder een woord, 50 om hooguit 1 tot 5 zinnen; met de gevraagde woorden van elke instructie van de SFT-run van de course, om de schone subset te maken. data/course-eval-chat.json, gemaakt met data/tools/make_course_eval_chat.py."}
- {id: model-course-gpt-chars, kind: model, license: "CC-BY-4.0 (the course; trained on Tiny Shakespeare, public domain)", hosting: rehost,
   note_nl: "De kleine GPT van gpt-train-chars (1 miljoen parameters, tekens van Tiny Shakespeare), door de course getraind met haar eigen oplossingen. Vangnet voor wie zelf geen GPT getraind heeft: gpt-generate schrijft er dan mee."}
