- {id: course-chains-qwen, kind: text, license: "CC-BY-4.0 (the course; written by Qwen3-0.6B, Apache-2.0, to tasks the course wrote)", hosting: rehost,
   note_nl: "De run van de course van start-prompt-chains: de antwoorden van Qwen3-0.6B op vier experimenten (één prompt of een keten, zijn eigen antwoord nakijken, Chain-of-Verification, antwoorden uit een bron), elk 8 keer met een andere seed. data/course-chains-qwen.json, gemaakt met data/tools/record_course_chains_qwen.py, met de code van de les."}
- {id: course-agent-qwen, kind: text, license: "CC-BY-4.0 (the course; written by Qwen3-0.6B, Apache-2.0, as an agent with the course's tools)", hosting: rehost,
   note_nl: "De runs van de course van agent-idea: Qwen3-0.6B op de taak met de voorraadkast, 6 keer zonder tools en 6 keer als agent met de run_agent van de course en de twee tools, elk bericht met zijn tokens en seconden. data/course-agent-qwen.json, gemaakt met data/tools/record_course_agent_qwen.py, met de code van de les."}
- {id: course-work-qwen, kind: text, license: "CC-BY-4.0 (the course; written by Qwen3-0.6B, Apache-2.0, to tasks the course wrote)", hosting: rehost,
   note_nl: "De runs van de course van de module werk van bouwen: de antwoorden van Qwen3-0.6B op de vragen van build-ai-at-work, build-research-and-learn, build-make-without-code, build-coding-workflow, build-ai-explains-code en build-check-ai-code, elk 8 keer met een andere seed, met zijn tokens en seconden. data/course-work-qwen.json, gemaakt met data/tools/record_course_work_qwen.py, met de code van de lessen."}
- {id: course-apis-qwen, kind: text, license: "CC-BY-4.0 (the course; written by Qwen3-0.6B, Apache-2.0, to questions the course wrote)", hosting: rehost,
   note_nl: "De runs van de course van de module apis van bouwen: de antwoorden van Qwen3-0.6B via de server van de course op de vragen van build-tokens-prices, build-call-api, build-project-call, build-streaming en build-choose-model, met hun tokens en seconden (bij streamen ook wanneer elk stukje binnenkwam, bij thinking ook de redenering), de tokens die Qwen3 per seconde schrijft in float32 en bfloat16 voor build-where-models-run, de tokens van de teksten van build-tokens-prices met de tokenizer van Qwen3, de vragen over drie foto's van build-multimodal-apis met wat de detector van de server (DETR) erop vond, en de labels die Qwen3 gaf aan de 120 testvragen van banking77-small voor build-ai-services. data/course-apis-qwen.json, gemaakt met data/tools/record_course_apis_qwen.py, met de code van de lessen."}
- {id: course-dev-prompts-qwen, kind: text, license: "CC-BY-4.0 (the course; written by Qwen3-0.6B, Apache-2.0, to questions the course wrote)", hosting: rehost,
   note_nl: "De runs van de course van de module prompts van bouwen: de antwoorden van Qwen3-0.6B via de server van de course op de vragen van build-sampling-api (een naam voor een bakkerij, acht keer bij elk van drie instellingen, en drie soorten fruit op drie manieren beëindigd) en build-system-prompt (een vraag met en zonder system prompt, de system prompt van een fietsenwinkel tegen twee vragen, JSON met en zonder response prefill, en een titel als JSON voor het uitgewerkte voorbeeld) en build-structured-output (de gegevens van een fiets als JSON, acht keer zonder en acht keer met JSON mode, waarbij elk antwoord met JSON mode tegen het schema van de les werd gecontroleerd en opnieuw gevraagd met wat er mis was, hooguit drie pogingen) en build-prompt-templates (twee versies van de template voor fietsen, elk ingevuld met drie teksten over fietsen en acht keer gevraagd met JSON mode) en build-project-prompts (de afspraak in drie berichten als JSON, acht keer met en acht keer zonder de regel over JSON in de system prompt, elk antwoord tegen het schema gecontroleerd en opnieuw gevraagd met wat er mis was, hooguit drie pogingen), elk antwoord met zijn tokens en seconden. data/course-dev-prompts-qwen.json, gemaakt met data/tools/record_course_apis_qwen.py, met de code van de lessen."}
- {id: course-rag-qwen, kind: text, license: "CC-BY-4.0 (the course; written by Qwen3-0.6B, Apache-2.0, to questions the course wrote)", hosting: rehost,
   note_nl: "De runs van de course van de module rag van bouwen: de antwoorden van Qwen3-0.6B via de server van de course op de vragen over course-summaries, voor build-rag-idea (acht vragen, elk vier keer zonder bron, met het punt dat hem beantwoordt en met het punt van een andere vraag) en build-rag-first (alle 28 vragen, elk twee keer na een system prompt, alleen en met de drie punten die het zoeken op woorden van de course vindt) en build-grounded-answers (alle 28 vragen, elk twee keer met de drie punten die zoeken op betekenis vindt, na de system prompt van build-rag-first en na een grounded system prompt), en de antwoorden op de 14 vragen over het handboek van Spoke & Chain voor build-project-rag (elk twee keer, met alleen een system prompt over de winkel, en zoals de ask van de les het doet: een grounded system prompt met de drie chunks die zoeken op betekenis vindt met course-handbook-granite), elk antwoord met zijn tokens en seconden. Daarnaast, met de logprobs van de vijf waarschijnlijkste tokens, de oordelen van één token yes of no: voor build-reranking over elk van de 20 kandidaten van de samengevoegde zoekfunctie bij alle 28 vragen, in de vorm van Qwen3-Reranker, en voor build-rag-eval over elk van de twee antwoorden van build-grounded-answers op alle 28 vragen (zeggen de bronnen wat het antwoord zegt, en beantwoordt het de vraag); en voor build-query-rewriting, bij de 24 vragen die een punt beantwoordt, een vervolgvraag die op zichzelf moet staan, een passage om mee te zoeken (HyDE) en drie versies van een korte vraag. data/course-rag-qwen.json, gemaakt met data/tools/record_course_apis_qwen.py, met de code van de lessen."}
- {id: course-agents-qwen, kind: text, license: "CC-BY-4.0 (the course; written by Qwen3-0.6B, Apache-2.0, to questions the course wrote)", hosting: rehost,
   note_nl: "De runs van de course van de module agents van bouwen: de antwoorden van Qwen3-0.6B via de server van de course, met temperature 0: voor build-tool-calling acht vragen die een bedrag omrekenen tussen km en mi of kg en lb (elk zonder tools, met de tool convert en tool_choice auto, en met tool_choice die convert noemt in het eerste request; en twee vragen die geen tool nodig hebben, met auto en met none); voor build-tool-design dezelfde acht vragen (met de tool kaal beschreven, als conv met de argumenten a, b en c, en met alleen namen, zonder beschrijvingen of toegestane eenheden, met fouten die alleen Error zeggen of zeggen wat het model anders moet doen, hooguit drie requests); voor build-workflow-or-agent twaalf vragen (over wat je moet kopen voor een van de zes gerechten van de keuken van de course, twee per gerecht, aan een agent met de tools recipe en pantry en een limiet van acht requests; dezelfde vragen aan een workflow, waarin het model het gerecht noemt, en per gerecht een zin geschreven bij de lijst die de code uitrekende); voor build-workflow-patterns een tip van hooguit acht woorden voor elk gerecht (teruggestuurd met zijn aantal woorden, tot vier antwoorden, een keer met de terugkoppeling 'Write it again' en een keer met 'write a new, shorter tip') en zes menu's van twee of drie gerechten (als JSON opgesplitst in hun gerechten); voor build-agent-loop de twaalf vragen (opnieuw aan de agent, met een system prompt die voor elke tool call om een regel vraagt die met Thought: begint), die build-tracing ook leest, als traces met de tijd en de tokens van elke stap; voor build-plan-execute dezelfde twaalf vragen en drie over twee gerechten (elk als plan in JSON mode, waarna de course de stappen uitvoerde en het model het antwoord schreef uit de resultaten; elk met het eigen plan van de course, waarbij het model alleen het antwoord schreef; en elk aan een agent met de tools recipe, pantry en missing en een limiet van acht requests); en voor build-agent-memory zes dingen die een gebruiker over zichzelf zegt (elk in een eigen gesprek met de tool remember, met tool_choice auto en met tool_choice die remember noemt) en zes vragen die ze nodig hebben (zonder geheugen, later in hetzelfde gesprek, en in een nieuw gesprek met de bewaarde notities in de system prompt). Bij elke tool call voerde de course de tool uit met de functie van de les en stuurde het resultaat terug met het id van de call. data/course-agents-qwen.json, gemaakt met data/tools/record_course_apis_qwen.py, met de code van de lessen."}
