# --- the domain taal (Language and search), basis: chosen in docs/onderzoek/reports/Voorstel domein Taal en zoeken.md.
#     The data files come with the lesson that first needs them, each made by a script in data/tools/ from files pinned by SHA-256.
- {id: gutenberg-books, kind: text, license: "public domain (Project Gutenberg texts, header and footer removed)", hosting: rehost,
   note_nl: "Acht boeken van Project Gutenberg zonder de kop en de voet van Gutenberg: Alice's Adventures in Wonderland (#11), Pride and Prejudice (#1342), The Adventures of Sherlock Holmes (#1661), Frankenstein (#84) en Moby-Dick (#2701), samen 551.664 woorden volgens de telling van everything_ai.books, en Eline Vere (#19563), Max Havelaar (#11024) en Camera Obscura (#15975), met hun oude spelling (zoo, mensch, hy). Alle schrijvers stierven vóór 1956, dus de boeken zijn ook in Nederland en België vrij. Gutenberg maakt zijn bestanden steeds opnieuw, dus de course zet de bestanden vast op SHA-256 en host de gestripte tekst zelf. Voor corpora, Zipf en Heaps, spellingcorrectie, TF-IDF, trefwoorden en woorden als buren. Sinds nlp-corpora in data/gutenberg-books.json.gz, gemaakt met data/tools/make_gutenberg.py."}
- {id: tatoeba-sentences, kind: text, license: "CC-BY-2.0-FR (Tatoeba and its contributors)", hosting: rehost,
   note_nl: "Korte zinnen van vrijwilligers in een tiental talen voor language identification, met dichte buren van het Nederlands (Afrikaans, Duits, Fries), en Engels-Nederlandse zinsparen van OPUS (v2026-07-08) voor vertalen met regels. Op 21 november 2026 zijn het Nederlands en het Engels gedownload en van de andere talen alleen de grootte bekeken; de Nederlandse zinnen staan sinds nlp-zipf-heaps vast in data/tatoeba-nl.tsv.gz (de export van die dag, 199.970 zinnen), gemaakt met data/tools/make_tatoeba_nl.py; sinds nlp-language-and-society staan de Friese, Groningse en Limburgse zinnen met een Nederlandse vertaling vast in data/tatoeba-nl-pairs.tsv.gz (506, 13.206 en 18 paren, uit de export van dezelfde dag), gemaakt met data/tools/make_tatoeba_pairs.py; sinds nlp-language-id staan 500 zinnen in elk van twaalf talen vast in data/tatoeba-langs.tsv.gz (Nederlands, Afrikaans, Fries, Duits, Engels, Deens, Noors Bokmål met 454, Zweeds, Frans, Spaans, Portugees en Italiaans, uit de export van dezelfde dag), elk met een Nederlandse vertaling in data/tatoeba-nl.tsv.gz, gemaakt met data/tools/make_tatoeba_langs.py. Gefilterd op grove, seksuele en gewelddadige woorden, want Tatoeba heeft er een paar: 1.648 Nederlandse zinnen vielen af. De zinnen van Tatoeba houden hun id voor de naamsvermelding; de paren van OPUS hebben geen id's, dus daar noemt de course Tatoeba en OPUS. Tom staat in 12,7% van de Nederlandse zinnen, wat elke telling van namen bovenaan zet."}
- {id: uci-sentiment-sentences, kind: text, license: "CC-BY-4.0 (Sentiment Labelled Sentences, Kotzias and others 2015, UCI 331)", hosting: rehost,
   note_nl: "3.000 korte zinnen uit recensies, elk positief of negatief: 1.000 van Amazon, IMDb en Yelp, elk precies 500 en 500. Uit de zip van UCI met vaste SHA-256 (afc26626). De zinnen komen van Amazon, IMDb en Yelp, die zelf strengere voorwaarden hebben; UCI geeft de set uit onder CC BY 4.0. Voor de eerste classifiers op tekst, sentiment en het fine-tunen van een encoder. Sinds nlp-document-vectors staan de 3.000 zinnen in data/uci-sentiment.tsv.gz (data/tools/make_uci_sentiment.py), met de woorden ongewijzigd; 85 zinnen met scheldwoorden, beledigingen, scheldnamen, of grove of seksuele opmerkingen zijn gemarkeerd als niet te tonen en tellen wel mee."}
- {id: course-sentiment-nl, kind: text, license: "CC-BY-4.0 (the course: a translation of uci-sentiment-sentences, and reviews it writes)", hosting: rehost,
   note_nl: "De zinnen van uci-sentiment-sentences, door de course in het Nederlands vertaald, met hun label, en een handvol korte recensies van een paar zinnen die de course zelf schrijft, in beide talen, voor sentiment per document. Een bruikbare Nederlandse set met sentiment en een open licentie vond het onderzoek niet: DBRD is CC BY-NC-SA. Zo heeft het project een Engelse en een Nederlandse set die over hetzelfde gaan. Sinds nlp-sentiment in data/uci-sentiment-nl.tsv.gz (de 3.000 zinnen, regel voor regel, met label en shown van de Engelse zin) en data/course-reviews.tsv (18 recensies van 3 tot 5 zinnen, 61 zinnen, in beide talen, met een label per zin en per recensie)."}
- {id: pattern-sentiment-lexicons, kind: text, license: "PDDL-1.0 (Pattern, De Smedt and Daelemans)", hosting: rehost,
   note_nl: "De sentimentlexicons van Pattern (CLiPS) voor het Engels (2.918 betekenissen, vooral van bijvoeglijke naamwoorden) en het Nederlands (3.918), elk met polariteit en subjectiviteit, op commit af754685 met vaste SHA-256. Om het eigen lexicon van de leerling mee te vergelijken. Sinds nlp-sentiment-lexicon in data/pattern-sentiment.tsv.gz (6.836 rijen, één per betekenis; de kolom shown is 0 voor 44 rijen met grove of beledigende woorden en woorden voor een groep mensen of voor seks; data/tools/make_pattern_lexicons.py, books.pattern_sentiment)."}
- {id: sms-spam-collection, kind: text, license: "CC-BY-4.0 (SMS Spam Collection, Almeida and Gómez Hidalgo 2011, UCI 228)", hosting: download,
   note_nl: "5.574 sms'jes, waarvan 747 spam (13,4%), de klassieke set voor een spamfilter. De berichten die geen spam zijn, zijn echte privéberichten met voornamen en soms een telefoonnummer, en 159 regels hebben grove of seksuele woorden (vooral spam). Dus de course host de set niet: de leerling downloadt de zip bij UCI (vaste SHA-256 1587ea43) en traint op de eigen pc. De les toont alleen berichten die de course uitkiest, zonder grove taal en met namen en cijferreeksen gemaskeerd. Voor het project text, stap 1. Sinds nlp-project-spam downloadt everything_ai.sms de zip (203.415 bytes, vastgelegd in everything_ai.hub); 403 regels zijn een kopie van een eerdere regel, dus de les splitst de 5.171 verschillende teksten (4.137 om op te trainen, 1.034 om te testen)."}
- {id: ud-english-dutch, kind: text, license: "CC-BY-SA-4.0 (Universal Dependencies 2.19: UD_English-EWT and UD_Dutch-Alpino)", hosting: rehost,
   note_nl: "Een deel van twee treebanks van Universal Dependencies 2.19 (15 november 2026), op hun tag r2.19 met vaste SHA-256: UD_English-EWT zonder de zinnen uit e-mails van Enron, die echte namen en adressen bevatten, en UD_Dutch-Alpino. Alleen woord, lemma, woordsoort, head en relatie. In de andere teksten blijven namen staan, vooral van bekende mensen, bedrijven en plaatsen; de les toont zinnen die de course uitkiest, zonder de paar grove woorden van EWT. Voor woordsoorten, dependency trees, lemma's en een tagger. Sinds nlp-word-classes in data/ud-en-ewt.conllu.gz (11.723 zinnen, zonder de 4.899 van Enron) en data/ud-nl-alpino.conllu.gz (13.603 zinnen), gemaakt met data/tools/make_ud.py."}
- {id: wals-word-order, kind: tabular, license: "CC-BY-4.0 (WALS Online v2020.6, Dryer and Haspelmath)", hosting: rehost,
   note_nl: "Vier eigenschappen van de World Atlas of Language Structures over woordvolgorde: 81A (de dominante volgorde van onderwerp, lijdend voorwerp en werkwoord), 81B (twee dominante volgordes), 83A (lijdend voorwerp en werkwoord) en 85A (voorzetsels of achterzetsels), met familie, genus, gebied en plaats op de kaart van elke taal. Uit de CLDF-data van versie v2020.6 op Zenodo (28 september 2026) met vaste SHA-256; sinds nlp-languages-of-the-world in data/wals-word-order.tsv.gz (1.583 talen), gemaakt met data/tools/make_wals_word_order.py. WALS gebruikt een eigen indeling in families, die op plaatsen afwijkt van Glottolog."}
- {id: uner-english-ewt, kind: text, license: "CC-BY-SA-4.0 (Universal NER v1, Mayhew and others 2024)", hosting: rehost,
   note_nl: "Namen van personen, plaatsen en organisaties in BIO-labels op dezelfde zinnen als UD_English-EWT, op commit 8ed072de met vaste SHA-256, ook zonder de e-mails. Een open Nederlandse set met namen die bruikbaar is als eerste set, vond het onderzoek niet: CoNLL-2002 is alleen voor onderzoek, Europeana NL NER (CC0) is OCR van oude kranten zonder zinsgrenzen, ParlaMint-NL (CC BY 4.0) heeft alleen automatische labels. Dus de Nederlandse voorbeelden schrijft de course zelf. Sinds nlp-bio-tags in data/uner-en-ewt.tsv.gz (11.722 zinnen met 197.019 woorden, zonder de kolom met wie een zin nakeek; de kolom shown is 0 voor 751 zinnen met contactgegevens of grove, seksuele of gewelddadige woorden; data/tools/make_uner.py, everything_ai.uner)."}
- {id: wordnet-en-nl, kind: text, license: "CC-BY-4.0 and the WordNet License (Open English WordNet 2025); CC-BY-SA-4.0 (Open Dutch WordNet in OMW 2.0)", hosting: rehost,
   note_nl: "Een uittreksel van Open English WordNet 2025 (synsets, hyperoniemen, meroniemen, zonder synsets met een beledigende omschrijving) en de Nederlandse lemma's van Open Dutch WordNet uit OMW 2.0 (60.259 lemma's op Engelse synsets), beide met vaste SHA-256. Voor betekenissen van woorden, WordNet en een Nederlandse woordenlijst om samenstellingen te splitsen. Het Nederlandse deel staat sinds nlp-dutch-compounds in data/wordnet-nl.tsv (60.061 rijen, zonder scheldwoorden en grove woorden; data/tools/make_wordnet_nl.py). Het Engelse deel staat sinds nlp-word-relations in data/wordnet-en.tsv.gz (107.425 synsets met namen zoals NLTK ze geeft, definities, hyperoniemen, delen, leden, stoffen en antoniemen; 94 synsets met een beledigende omschrijving of zonder woorden na het weglaten van scheldwoorden eruit; data/tools/make_wordnet_en.py, everything_ai.wordnet). De koppeling loopt via de Collaborative Interlingual Index (CC-BY-4.0, ili-map-pwn30.tab op een vaste commit, met vaste SHA-256) naar Princeton WordNet 3.0: 28.094 van de 30.156 Nederlandse synsets vinden een Engelse; de andere 2.062 heeft Open English WordNet samengevoegd of weggehaald. De licentietekst van WordNet staat in LICENSES/LicenseRef-WordNet.txt."}
- {id: snowball-stopwords, kind: text, license: "BSD-3-Clause (Snowball)", hosting: rehost,
   note_nl: "De lijsten met stop words van Snowball voor het Engels (174 woorden) en het Nederlands (101 woorden, gerangschikt van het meest tot het minst voorkomende woord, elk met een Engelse vertaling), zoals snowballstem.org ze op 22 november 2026 publiceerde, met vaste SHA-256: de lijsten hebben geen versies. Sinds nlp-normalize ongewijzigd in data/snowball-stop-en.txt en data/snowball-stop-nl.txt, nagekeken met data/tools/make_snowball_stopwords.py. De Engelse lijst laat us, will, can en nog een paar woorden met opzet weg, en zegt in een opmerking waarom."}
- {id: snowball-stems, kind: text, license: "BSD-3-Clause (Snowball, snowball-data)", hosting: rehost,
   note_nl: "De voorbeeldwoordenlijsten van Snowball voor de stemmer van Porter uit 1980 (42.603 Engelse woorden) en voor de stemmer van Porter voor het Nederlands (45.670 Nederlandse woorden), elk woord met de stam die de stemmer van Snowball geeft: voc.txt en output.txt uit de mappen porter/ en dutch_porter/ van snowball-data, zoals raw.githubusercontent.com de bestanden op 22 november 2026 gaf, met vaste SHA-256. Sinds nlp-stemming in data/snowball-porter.tsv.gz en data/snowball-dutch-porter.tsv.gz (data/tools/make_snowball_stems.py); tests/test_stemmers.py vergelijkt de stemmers van de course ermee. Sinds Snowball 3.0.0 bevat dutch/ de uitvoer van de stemmer van Kraaij en Pohlmann, dus de course neemt dutch_porter/."}
- {id: glove-50d, kind: model, license: "PDDL-1.0 (GloVe 6B, Pennington and others 2014)", hosting: rehost,
   note_nl: "De vectoren van 50 dimensies van GloVe 6B (Wikipedia 2014 en Gigaword 5) voor de 50.000 meest voorkomende woorden van alleen de letters a tot en met z, in float16, zo'n 5 MB. Uit het eerste bestand van de zip van Stanford (glove.6B.50d.txt, SHA-256 d8f717f8); de kopie op Hugging Face heeft een extra regel, dus de course zet die van Stanford vast. Echte word embeddings om buren en analogieën op te zoeken."}
- {id: word2vec-analogies, kind: text, license: "Apache-2.0 (word2vec, Mikolov and others 2013)", hosting: rehost,
   note_nl: "questions-words.txt: 19.544 analogievragen in 14 groepen (hoofdsteden, munten, familie, meervouden en meer), op commit 20c129af met vaste SHA-256. De Nederlandse analogieën schrijft de course zelf: 185 paren woorden in tien van de veertien groepen (data/course-word-pairs-nl.tsv), samen 3.584 vragen."}
- {id: fasttext-nl-30k, kind: model, license: "CC-BY-SA-3.0 (fastText cc.nl.300, Grave and others 2018)", hosting: download,
   note_nl: "De eerste 20 MB van cc.nl.300.vec.gz: de 30.355 meest voorkomende Nederlandse tokens (woorden, maar ook leestekens en getallen) met vectoren van 300 dimensies, vastgezet op de eerste bytes (SHA-256 8c59089d), zoals de course al doet bij C4. De course houdt daarvan de 28.209 woorden van alleen letters, met hoofdletters. Om dezelfde buren en analogieën in het Nederlands te zien."}
- {id: model-bert-tiny, kind: model, license: "Apache-2.0 (Google, BERT miniatures, Turc and others 2019)", hosting: download,
   note_nl: "google/bert_uncased_L-2_H-128_A-2: een BERT van 2 layers en 4,4 miljoen parameters, met de kop die gemaskeerde woorden voorspelt, als safetensors (17,7 MB) en vocab.txt (232 kB) op revisie 30b0a37c met vaste SHA-256. Getraind op Engelse Wikipedia en BookCorpus. De course schrijft het model en de WordPiece-tokenizer zelf (everything_ai.bert, tot op 0,0001 gelijk aan Hugging Face transformers, tests/test_bert.py) en deelt geen checkpoint. Wel deelt de course sinds nlp-static-vs-contextual wat BERT-Tiny geeft voor bank in 44 eigen zinnen (data/course-bank-sentences.tsv, CC BY-SA 4.0), vóór het eerste blok en na elk blok: data/bert-tiny-bank.npz (46 kB, Apache-2.0, gemaakt met data/tools/make_bert_bank.py), zodat de oefeningen zonder download werken. Sinds nlp-bert deelt de course ook de scores van de kop bij acht eigen zinnen met één [MASK] en één eigen zin met twee, en de rang van 3.031 verborgen woorden uit de 500 Engelse zinnen van data/tatoeba-langs.tsv.gz: data/bert-tiny-fill.npz (1,2 MB, gemaakt met data/tools/make_bert_fill.py). Sinds nlp-fine-tune-bert deelt de course ook wat BERT-Tiny geeft voor zes achtergehouden zinnen uit data/uci-sentiment.tsv.gz, vóór het eerste block en na elk block, de head die de course op de bevroren vectoren bij [CLS] trainde, en de scores van een door de course gefinetunede BERT-Tiny bij elk stukje van de 1.471 testzinnen van data/uner-en-ewt.tsv.gz: data/bert-tiny-fine-tune.npz (0,5 MB, gemaakt met data/tools/make_bert_fine_tune.py)."}
- {id: xquad-squad-nl, kind: text, license: "CC-BY-SA-4.0 (SQuAD 1.1, Rajpurkar and others 2016; XQuAD, Artetxe and others 2020; SQuAD-NL v1.1, de Vries and others 2023)", hosting: rehost,
   note_nl: "De 2.067 alinea's van de 48 Engelse Wikipedia-pagina's in de development set van SQuAD 1.1, met hetzelfde in het Nederlands uit SQuAD-NL v1.1, en de vragen met hun antwoord in de tekst bij de 240 alinea's van XQuAD: 1.190 vragen in het Engels en 1.183 in het Nederlands. Het Nederlands van de 240 alinea's en hun vragen is machinaal vertaald en daarna door mensen verbeterd (de test set van SQuAD-NL), de andere alinea's zijn alleen machinaal vertaald (de dev set). Uit de parquet-bestanden van rajpurkar/squad en GroNLP/squad-nl-v1.1 op een vaste commit met vaste SHA-256, die data/tools/make_xquad_nl.py één keer naar JSON omzet; de course geeft elke pagina een Nederlandse naam en markeert 149 alinea's met een woord over geweld of seks, die een les niet als voorbeeld laat zien. Voor topic models, vragen beantwoorden en een kleine zoekmachine in twee talen, waarin de eigen alinea van een vraag het relevante document is. Sinds nlp-topic-models deelt de course ook de twee topic models van deze les, één per taal, met 12 topics: data/xquad-topics.npz (0,5 MB, CC BY-SA 4.0, gemaakt met data/tools/make_xquad_topics.py), zodat de checks niet op een training hoeven te wachten."}
- {id: scifact, kind: text, license: "CC-BY-4.0 (claims) and ODC-By-1.0 (abstracts) (SciFact, Wadden and others 2020; per allenai/scifact LICENSE.md)", hosting: download,
   note_nl: "5.183 samenvattingen van biomedische papers en 300 beweringen als zoekvraag met hun relevante samenvattingen, de kopie van BEIR in mteb/scifact op revisie cf10ab68 met vaste SHA-256. Een echte testcollectie om BM25 op af te stellen en te meten. De licentie komt uit LICENSE.md van allenai/scifact; de kopie van mteb zegt unknown en oudere lijsten noemen CC BY-NC, dus de leerling downloadt het en de course host het niet."}
- {id: ntrex-128, kind: text, license: "CC-BY-SA-4.0 (NTREX-128, Federmann and others 2022)", hosting: download,
   note_nl: "1.997 zinnen nieuws in 123 documenten uit WMT19, door vertalers vertaald in 128 talen, op commit 468c6b69 met vaste SHA-256: het Engels en het Nederlands helemaal, en de eerste 100 zinnen in een veertigtal andere talen. Voor BLEU, chrF en TER, vertalen per document, en hoeveel stukjes een tokenizer van elke taal maakt. De Engelse bronzinnen komen van nieuwssites (WMT19), die zelf het auteursrecht hebben, dus de leerling downloadt de set. FLORES+ vraagt bij het downloaden om de set niet te hosten waar crawlers die vinden, dus de course gebruikt NTREX."}
- {id: scitldr, kind: text, license: "Apache-2.0 (SciTLDR, Cachola and others 2020; the repository's license)", hosting: download,
   note_nl: "De test set van SciTLDR-A: 618 samenvattingen van papers over machine learning, elk met één tot enkele samenvattingen van één zin (gemiddeld 3,2), op commit 5ccad9c0 met vaste SHA-256. Apache-2.0 is de licentie van de repository; een aparte verklaring voor de data is er niet, en de samenvattingen zijn van hun schrijvers, dus de leerling downloadt de set. Voor samenvatten en ROUGE met meer dan één referentie."}
- {id: massive-en-nl, kind: text, license: "CC-BY-4.0 (MASSIVE 1.1, FitzGerald and others, ACL 2023)", hosting: rehost,
   note_nl: "Korte opdrachten aan een assistent met hun intent (60 soorten, ongelijk verdeeld) en slots, in het Engels (en-US) en in dezelfde zinnen in het Nederlands (nl-NL), uit de tarball van versie 1.1 met vaste SHA-256 (4cba5faa), zonder de velden over de annotatoren; 147 opdrachten met grof taalgebruik, seks, geweld of politici bij naam laat een les niet als voorbeeld zien. Voor micro- en macro-gemiddelden en voor slots vullen."}
- {id: eliza-doctor-1965, kind: text, license: "CC0-1.0 (Weizenbaum estate)", hosting: rehost,
   note_nl: "Het oorspronkelijke DOCTOR-script van ELIZA uit 1965 (.TAPE. 100), teruggevonden in de papieren van Weizenbaum bij MIT en volgens de pagina van het project met toestemming van de erven vrijgegeven als CC0; uit de repository rupertl/eliza-ctss op commit 3af426b7 met vaste SHA-256. De Nederlandse versie schrijft de course zelf, op basis daarvan."}
- {id: snli-sample, kind: text, license: "CC-BY-SA-4.0 (SNLI 1.0, Bowman, Angeli, Potts and Manning 2015)", hosting: rehost,
   note_nl: "Paren van zinnen uit SNLI 1.0 (Bowman, Angeli, Potts en Manning, EMNLP 2015): een premisse (het bijschrift van een foto, bijna altijd van Flickr30k), een hypothese die een crowdworker erbij schreef, en het label entailment, neutral of contradiction. De course houdt alle gelabelde paren van 10.000 premissen uit de training set (36.788 paren, gekozen in de volgorde van de SHA-256 van de premisse) en de 9.824 gelabelde paren van de test set, uit de parquet-bestanden van stanfordnlp/snli op Hugging Face op vaste commit cdb5c3d5, met vaste SHA-256 per bestand. 1.308 paren met een grof, seksueel of gewelddadig woord, een scheldwoord, naakt, bloed, een wapen, drank of roken laat een les niet als voorbeeld zien; deze paren tellen wel mee. Gemaakt met data/tools/make_snli_sample.py (data/snli-sample.tsv.gz), voor nlp-entailment."}
- {id: litbank-coref, kind: text, license: "CC-BY-4.0 (LitBank, Bamman, Lewke and Mansoor 2020)", hosting: rehost,
   note_nl: "De coreferentielaag van LitBank (Bamman, Lewke en Mansoor, LREC 2020): ongeveer 2.000 woorden uit elk van 100 Engelstalige romans en verhalen van 1719 tot 1922, met elke mention van zes typen entiteiten (PER, FAC, LOC, GPE, ORG, VEH) en de ketens, uit de repository dbamman/litbank op commit 3e50db0f, met een vaste SHA-256 over de bestanden van coref/tsv. De course houdt per werk de zinnen zoals LitBank de zinnen tokeniseerde, en de 28.411 mentions die in een keten staan; de 692 mentions die LitBank alleen via een appositie of een koppelwerkwoord met een andere mention verbindt, vallen weg. 564 van de 8.562 zinnen, met een grof, seksueel of gewelddadig woord, een scheldwoord, drank of een wapen, laat een les niet als voorbeeld zien; deze zinnen blijven in het bestand. Gemaakt met data/tools/make_litbank_coref.py (data/litbank-coref.json.gz), voor nlp-coreference."}
- {id: sts-pairs, kind: text, license: "CC-BY-SA-4.0 (STS Benchmark scores; captions of PASCAL VOC-2008, Rashtchian and others 2010; SNLI, Bowman and others 2015; the Dutch of stsb-multi-mt, Philip May 2021); the cosine similarities of Granite Embedding 107M multilingual, Apache-2.0", hosting: rehost,
   note_nl: "1.750 paren uit de STS Benchmark (Cer, Diab, Agirre, Lopez-Gazpio en Specia, SemEval 2017), elk met de score van mensen van 0 tot 5, uit de zip van GLUE met vaste SHA-256 (e60a6393): alleen de bronnen images (bijschriften van foto's van PASCAL, CC BY-SA) en track5.en-en (zinnen van SNLI, CC BY-SA 4.0), want voor de andere bronnen (MSRpar, MSRvid, headlines, DEFT, de fora) vraagt de licentie een akkoord met Microsoft Research, is de licentie onduidelijk of moet elke auteur een link krijgen. De Nederlandse zinnen zijn de machinevertaling door DeepL van stsb-multi-mt (Philip May, 2021, commit 30de0dec, met vaste SHA-256 per bestand), onder dezelfde licentie; de scores horen bij de Engelse paren. 25 paren met naakt, bloed, wapens, de dood, roken of drank laat een les niet als voorbeeld zien; deze paren tellen wel mee. Daarbij de cosine similarity van Granite Embedding voor elk paar, in het Engels en het Nederlands (data/stsb-captions-granite.npz). Beide bestanden gemaakt met data/tools/make_sts_captions.py, voor nlp-sts."}
- {id: mteb-results, kind: text, license: "CC0-1.0 (embeddings-benchmark/results)", hosting: rehost,
   note_nl: "De hoofdscores van 15 embedding models op de 41 Engelse taken van MTEB(eng, v2), de Engelse benchmark van het leaderboard van MTEB (MMTEB, Enevoldsen e.a. 2025), met het aantal parameters van elk model: uit de repository embeddings-benchmark/results op de vaste commit 2aa49422, waarvan de licentie CC0 is. Per model de map en de revisie waarmee de scores berekend zijn; de taken en types zoals in mteb op commit 86d02b55. Gemaakt met data/tools/make_mteb_scores.py (data/mteb-eng-v2.tsv), voor nlp-mteb."}
