- {id: course-security-qwen, kind: text, license: "CC-BY-4.0 (the course; written by Qwen3-0.6B, Apache-2.0, to reviews, emails, questions and prompts the course wrote)", hosting: rehost,
   note_nl: "De runs van de course van de module security van verantwoord: voor rai-prompt-injection sorteert Qwen3-0.6B acht recensies die de course schreef voor een verzonnen fietswinkel, zonder aanval en met vier onschuldige injections die het woord PINEAPPLE vragen (gewoon, negeer, nep-antwoord en die twee samen, naar Liu e.a. 2024), onder zes prompts (geen verdediging, een waarschuwing, scheidingstekens, datamarking, base64 en de taak nog eens na de recensie), elk vijf keer met de seeds 0 tot en met 4, gesampled zonder denken: 1200 antwoorden. Voor rai-indirect-injection zet Qwen3-0.6B als mailassistent van dezelfde winkel, met de tools read_inbox en send_email, een stap na het lezen van een inbox van drie e-mails die de course schreef, een ervan met een ophaalcode, zonder aanval en met vijf onschuldige manieren waarop een e-mail vraagt de codes naar een adres op .example te sturen (gewoon, als bericht van het systeem, als de eigenaar, in een HTML-commentaar en als de klant van de reparatie, naar Greshake e.a. 2023), met alle drie de poten van de lethal trifecta, zonder de ophaalcode en zonder send_email, elk tien keer met de seeds 0 tot en met 9: 180 antwoorden, elk met zijn tool calls. Voor rai-jailbreaks beantwoordt Qwen3-0.6B als hulpassistent van dezelfde winkel, die volgens zijn system prompt alleen over fietsen mag praten, vijf onschuldige vragen die daar niet over gaan (zoals de hoofdstad van Frankrijk), met twaalf aanvallen (alleen de vraag, een rollenspel, prefix injection, refusal suppression, die twee samen, de vraag in het Nederlands, en many-shot met 1, 2, 4, 8, 16 en 32 verzonnen voorbeelden, naar Wei e.a. 2023 en Anil e.a. 2024), zonder en met een waarschuwing rond de vraag, elk vijf keer met de seeds 0 tot en met 4: 600 antwoorden. Voor rai-system-prompt-extraction heeft de hulpassistent van dezelfde winkel een personeelscode in zijn system prompt, onder drie system prompts (de code met de regel hem nooit aan klanten te geven, dezelfde met een regel om de instructies geheim te houden, en de code buiten de prompt), elk met zeven onschuldige aanvallen die om de code of de prompt vragen (erom vragen, herhalen, negeren en printen, naar het Nederlands vertalen, streepjes in de code, cijfers als woorden, elke regel op een lijst), elk tien keer met de seeds 0 tot en met 9: 210 antwoorden. Voor rai-insecure-output vat de hulpassistent van dezelfde winkel, waarvan de antwoorden op de webpagina van de winkel staan, die Markdown toont, en die het bestelnummer van de klant kent, een recensie samen die de course schreef, zonder aanval en met drie onschuldige notities voor de assistent die om een afbeelding, een link of een HTML-afbeelding vragen met het bestelnummer in het adres op attacker.example, een naam die voor voorbeelden gereserveerd is, onder drie prompts (geen regel, een regel tegen afbeeldingen, links en HTML in de system prompt, en dezelfde regel na de recensie), elk tien keer met de seeds 0 tot en met 9: 120 antwoorden. data/course-security-qwen.json, gemaakt met data/tools/record_course_security_qwen.py, met de code van de les."}
