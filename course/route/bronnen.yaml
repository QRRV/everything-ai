# Datasets and models that route lessons and papers use, by the id in their "data" field.
# License facts come from licenties/reports/ (the license thread owns them); this file only records which one the route picks.
# hosting: rehost = the course may host a copy; download = learners fetch it from upstream, pinned to a revision and hash;
#          synthetic = generated by lesson code; tbd = still to choose.
# checkpoints: false = the course does not hand out models trained on it; a lesson that trains on it lists the data of
#          the course's own reference checkpoint in reference_data.
# Format: FORMAT.md.

bronnen:
- {id: tiny-shakespeare, kind: text, license: "public domain", hosting: rehost}
- {id: tinystories, kind: text, license: "CDLA-Sharing-1.0", hosting: rehost, checkpoints: false,
   note_nl: "Gemaakt met GPT-3.5 en GPT-4. Leerlingen trainen erop op hun eigen pc; de referentie-checkpoints van de course komen uit cosmopedia, tot de licentie-thread anders beslist."}
- {id: tinystories-instruct, kind: text, license: "to check", hosting: tbd, checkpoints: false,
   note_nl: "Licentie staat niet in het licentierapport. Geen les gebruikt het: llm-sft en llm-lora maken hun eigen instructies voor de verhalen (synthetic-story-prompts)."}
- {id: fineweb-edu-sample-download-only, kind: text, license: "ODC-By-1.0 plus Common Crawl terms", hosting: download, checkpoints: false,
   note_nl: "Alleen voor wie het zelf wil proberen. De ODC-By-licentie dekt alleen de verzameling, niet de teksten zelf, dus de course traint er geen checkpoint op dat ze verspreidt."}
- {id: cosmopedia, kind: text, license: "Apache-2.0", hosting: rehost,
   note_nl: "Gemaakt met Mixtral (Apache-2.0). De course traint hier al haar eigen referentie-checkpoints op: de nachtrun en de LLM-projectstappen (het deel stories, en voor SFT de paren van prompt en tekst)."}
- {id: c4-noclean-sample-download-only, kind: text, license: "ODC-By-1.0 plus Common Crawl terms", hosting: download, checkpoints: false,
   note_nl: "De eerste 20 MB van een shard van C4 van vóór het opschonen (allenai/c4, en.noclean, vastgelegd op commit en SHA-256 in hub.PINNED): ruwe webpagina's om quality filters op te oefenen. FineWeb is al gefilterd, dus te schoon daarvoor. Leerlingen downloaden het zelf; de course host er niets van en traint er geen model op dat ze deelt."}
- {id: fineweb-sample-download-only, kind: text, license: "ODC-By-1.0 plus Common Crawl terms", hosting: download, checkpoints: false,
   note_nl: "Een kleine ruwe webstaal om kwaliteitsfilters en deduplicatie op te oefenen; er wordt geen model op getraind dat de course verspreidt."}
- {id: oasst, kind: sft, license: "Apache-2.0", hosting: rehost}
- {id: helpsteer2, kind: preference, license: "CC-BY-4.0", hosting: rehost}
- {id: qmnist, kind: image, license: "BSD-3-Clause", hosting: rehost,
   note_nl: "Handgeschreven cijfers met een duidelijke licentie; MNIST zelf mag alleen gedownload worden."}
- {id: fashion-mnist, kind: image, license: "MIT", hosting: rehost,
   note_nl: "Kleine grijze plaatjes van kleding, schoenen en tassen in 10 soorten, van Zalando: moeilijker dan cijfers, en de course host een deel van 7.000 plaatjes zelf."}
- {id: cifar-10-download-only, kind: image, license: "no license stated", hosting: download,
   note_nl: "Alleen downloaden, nooit zelf hosten; ethiekopmerking over 80M Tiny Images."}
- {id: palmer-penguins, kind: tabular, license: "CC0-1.0", hosting: rehost,
   note_nl: "344 pinguins, drie soorten, met ontbrekende waarden: klein genoeg voor de CPU en echt genoeg voor de hele workflow."}
- {id: model-gpt2-mit, kind: model, license: "MIT", hosting: download}
- {id: tokenizer-gpt2-mit, kind: model, license: "MIT", hosting: rehost,
   note_nl: "Alleen de twee bestanden van de tokenizer van GPT-2, encoder.json en vocab.bpe (samen 1,5 MB), zodat tiktoken ook zonder internet werkt. Overgenomen uit het PyPI-wheel gpt3_tokenizer 0.1.5; de SHA-256 is die welke tiktoken vastzet, dus het zijn dezelfde bytes als die OpenAI publiceert."}
- {id: model-qwen3-0.6b-base, kind: model, license: "Apache-2.0", hosting: download}
- {id: model-course-qmnist-cnn, kind: model, license: "CC-BY-4.0 (the course; trained on QMNIST, BSD-3-Clause)", hosting: rehost,
   note_nl: "Een klein CNN dat de course zelf op QMNIST traint en met een model card op een model hub zet, zodat de les over hubs geen licentievragen oproept."}
- {id: model-course-gpt-bpe, kind: model, license: "CC-BY-4.0 (the course; trained on stories of Cosmopedia, Apache-2.0)", hosting: rehost,
   note_nl: "De kleine GPT op tokens van gpt-train-bpe (1,3 miljoen parameters, 1.000 merge rules), door de course getraind met haar eigen oplossingen op verhalen uit Cosmopedia, niet op TinyStories (besluit 7). Vangnet voor wie zelf geen GPT op tokens getraind heeft."}
- {id: model-course-modern-gpt, kind: model, license: "CC-BY-4.0 (the course; trained on stories of Cosmopedia, Apache-2.0)", hosting: rehost,
   note_nl: "De ModernGPT van llm-modern-gpt (1,2 miljoen parameters, RMSNorm, SwiGLU, RoPE en grouped-query attention), door de course getraind met haar eigen oplossingen op dezelfde verhalen uit Cosmopedia als model-course-gpt-bpe (besluit 7). Vangnet voor wie zelf geen ModernGPT getraind heeft: de les schrijft er dan mee met een KV cache."}
- {id: model-course-capstone, kind: model, license: "CC-BY-4.0 (the course; trained on stories of Cosmopedia, Apache-2.0)", hosting: rehost,
   note_nl: "Het model van llm-pretrain-capstone: diepte 6 van de familie uit llm-fit-scaling-law (3,1 miljoen parameters), door de course compute-optimal getraind op 20 tokens per parameter aan verhalen voor jonge kinderen uit shards 1 tot en met 4 van Cosmopedia (shard 0 bevat de vragen van story-cloze), met dezelfde code als de les, ruim vier uur op twee CPU-threads. Vangnet voor de lessen na de capstone, voor wie zelf geen model pretrainde (besluit 7)."}
- {id: model-course-sft, kind: model, license: "CC-BY-4.0 (the course; trained on stories of Cosmopedia, Apache-2.0)", hosting: rehost,
   note_nl: "Het model van llm-sft: model-course-capstone, door de course met dezelfde code als de les gefinetuned op instructies voor verhalen voor jonge kinderen uit shard 5 van Cosmopedia, elk met een of twee van zijn zelfstandige naamwoorden als gevraagde woorden. Vangnet voor de lessen na llm-sft, voor wie zelf geen model finetunede (besluit 7)."}
- {id: model-course-dpo, kind: model, license: "CC-BY-4.0 (the course; trained on answers of model-course-sft)", hosting: rehost,
   note_nl: "De adapters van llm-dpo: LoRA van rang 8 op model-course-sft, door de course met dezelfde code als de les getraind met DPO op de preference pairs uit course-dpo-answers. Vangnet voor de lessen na llm-dpo, voor wie zelf geen DPO draaide (besluit 7)."}
- {id: course-dpo-answers, kind: text, license: "CC-BY-4.0 (the course; written by model-course-sft)", hosting: rehost,
   note_nl: "Vier antwoorden van model-course-sft op elk van 1.000 instructies met gevraagde woorden, uit verhalen voor jonge kinderen van shard 5 van Cosmopedia die het SFT-model niet zag; geen enkele is een testinstructie van llm-sft. data/course-dpo-answers.json, gemaakt met data/tools/make_course_dpo_answers.py."}
- {id: course-eval-chat, kind: text, license: "CC-BY-4.0 (the course; written by model-course-capstone, model-course-sft and model-course-dpo)", hosting: rehost,
   note_nl: "De antwoorden van de drie modellen van de course (basis, SFT, SFT met DPO) op de 200 prompts van llm-eval-chat: de 100 testinstructies van llm-sft, 50 om een verhaal zonder een woord, 50 om hooguit 1 tot 5 zinnen; met de gevraagde woorden van elke instructie van de SFT-run van de course, om de schone subset te maken. data/course-eval-chat.json, gemaakt met data/tools/make_course_eval_chat.py."}
- {id: model-course-gpt-chars, kind: model, license: "CC-BY-4.0 (the course; trained on Tiny Shakespeare, public domain)", hosting: rehost,
   note_nl: "De kleine GPT van gpt-train-chars (1 miljoen parameters, tekens van Tiny Shakespeare), door de course getraind met haar eigen oplossingen. Vangnet voor wie zelf geen GPT getraind heeft: gpt-generate schrijft er dan mee."}
- {id: nanochat-code, kind: code, license: "MIT", hosting: download}
- {id: paper-grokking, kind: paper, license: "arXiv, reading only", hosting: download,
   note_nl: "Figuren niet overnemen maar opnieuw tekenen uit eigen data."}
- {id: synthetic-modular-arithmetic, kind: synthetic, license: "course (MIT-0 code)", hosting: synthetic}
- {id: synthetic-fictional-facts, kind: synthetic, license: "course (MIT-0 code)", hosting: synthetic}
- {id: synthetic-story-prompts, kind: synthetic, license: "course (MIT-0 code)", hosting: synthetic,
   note_nl: "Opdrachten als 'schrijf een verhaal met de woorden X en Y', met een checker die ziet of de woorden erin staan."}
- {id: synthetic-story-cloze, kind: text, license: "Apache-2.0 (stories of cosmopedia; the questions made by the course)", hosting: rehost,
   note_nl: "Meerkeuzevragen: het echte vervolg van een verhaal tegen zinnen uit andere verhalen. data/story-cloze.json, gemaakt met data/tools/make_story_cloze.py: 500 vragen uit verhalen die geen model van de course zag, en 500 uit verhalen waarop de GPT's van de course trainden."}
- {id: course-red-team-prompts, kind: text, license: "course (CC BY-SA 4.0)", hosting: rehost,
   note_nl: "Een kleine set schadelijke en onschuldige-maar-eng-klinkende verzoeken, door de course geschreven, zonder werkende schadelijke inhoud."}
- {id: course-red-team-answers, kind: text, license: "CC-BY-4.0 (the course; written by model-course-capstone, model-course-sft and model-course-dpo)", hosting: rehost,
   note_nl: "De antwoorden van de drie modellen van de course (basis, SFT, SFT met DPO) op elk verzoek van course-red-team-prompts. data/course-red-team-answers.json, gemaakt met data/tools/make_course_red_team_answers.py."}
- {id: course-seeds, kind: text, license: "CC-BY-4.0 (the course)", hosting: rehost,
   note_nl: "De runs van de course over vijf seeds voor repro-guided-compare: de ModernGPT van de course met de instellingen van Power en anderen (2022) op optellen modulo 97, weight decay 1 en 0 bij 90% en weight decay 1 bij 30% van de tabel, seeds 0 tot en met 4, 12.000 stappen, met de accuracy op alle trainings- en validatievergelijkingen op de gelogde stappen. data/course-seeds.jsonl, gemaakt met data/tools/record_ablation.py en uit course-grokking en course-ablation. Vangnet voor wie de seeds niet zelf draait."}
- {id: course-ablation, kind: text, license: "CC-BY-4.0 (the course)", hosting: rehost,
   note_nl: "De ablation van de course voor repro-guided-ablation: de ModernGPT van de course met de instellingen van Power en anderen (2022) op optellen modulo 97, weight decay 1 en 0 bij 30% tot 90% van de tabel, seed 0, 12.000 stappen, met de accuracy op alle trainings- en validatievergelijkingen op de gelogde stappen. data/course-ablation.jsonl, gemaakt met data/tools/record_ablation.py, de run_seed van repro-guided-figure. Vangnet voor wie de grid niet zelf draait."}
- {id: course-grokking, kind: text, license: "CC-BY-4.0 (the course)", hosting: rehost,
   note_nl: "De runs van de course voor repro-guided-figure: de ModernGPT van de course met de instellingen van Power en anderen (2022) op optellen modulo 97 bij 30% van de tabel, seeds 0, 1 en 2, 12.000 stappen, met de accuracy op alle trainings- en validatievergelijkingen op de gelogde stappen. data/course-grokking.jsonl, gemaakt met data/tools/record_grokking.py, de run_seed van de les. Vangnet voor wie de runs niet zelf draait."}
