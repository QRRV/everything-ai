# The 18 branches (takken) of the course grid. Every map topic gets exactly one home branch:
# first the branch whose "domains" list holds the topic's domain, then the "overrides" below win.
# A lesson has its own "tak" field; it may cover topics whose home is another branch (a cross-branch lesson).
# Status: main-route = part of the first route that gets built; later = shown on the map as "komt nog".
# build_order is a proposal for Quinn, not a decision.
# attach (later branches only): the attach points, main-route lessons this branch connects to, in route order.
#   The branch can begin after the first; its later lessons build on the others too. Also a proposal.
# rest_after (main-route branches only): after which branch the rest of this branch is built, the topics the main
#   route does not cover and no earlier branch has built ahead. Also a proposal.
# Format: FORMAT.md.

takken:

- id: stam
  title: "Foundations: math, Python, data, machine learning and deep learning"
  title_nl: "Fundament: wiskunde, Python, data, machine learning en deep learning"
  domains: [D2, D3, D11]
  status: main-route
  build_order: 1
  rest_after: toepassingen
  project: {id: nn, title: "Your own neural network: from one neuron by hand to a deep network in PyTorch", title_nl: "Je eigen neurale netwerk: van één neuron met de hand tot een diep netwerk in PyTorch"}
  final: nn-deep-net-project

- id: taal
  title: "Language, NLP and large language models"
  title_nl: "Taal, NLP en large language models"
  domains: [D15, D16]
  status: main-route
  build_order: 1
  rest_after: rl
  project: {id: llm, title: "Your own LLM: from counting letters to a pretrained and post-trained model", title_nl: "Je eigen LLM: van letters tellen tot een gepretraind en nagetraind model"}
  final: llm-dpo

- id: onderzoek
  title: "Research skills and the frontier"
  title_nl: "Onderzoeksvaardigheden en de frontier"
  domains: [D27]
  status: main-route
  build_order: 1
  rest_after: toepassingen
  project: {id: repro, title: "Reproducing a paper: guided first, then one of your own choice", title_nl: "Een paper nabouwen: eerst begeleid, daarna een eigen keuze"}
  final: repro-own-report

- id: beeld
  title: "Computer vision and all CNN families"
  title_nl: "Computer vision en alle CNN-families"
  domains: [D13]
  status: later
  build_order: 2
  project: {id: cnn, title: "Your own CNN grows: LeNet, VGG blocks, ResNet, then detection and segmentation", title_nl: "Je eigen CNN groeit: LeNet, VGG-blokken, ResNet, daarna detectie en segmentatie"}
  attach: [cnn-convolution-idea, cnn-pytorch]
  final_nl: "Een eigen ResNet op CIFAR-10 of Fashion-MNIST met Grad-CAM, en een kleine U-Net of detector"

- id: generatief
  title: "Generative models and multimodal AI"
  title_nl: "Generatieve modellen en multimodale AI"
  domains: [D12]
  status: later
  build_order: 3
  project: {id: gen, title: "Your own generator: autoencoder, VAE, GAN and finally a diffusion model", title_nl: "Je eigen generator: autoencoder, VAE, GAN en ten slotte een diffusiemodel"}
  attach: [torch-mlp-digits, prob-distributions]
  final_nl: "Een klasse-geconditioneerd diffusiemodel dat je zelf traint op Fashion-MNIST of CIFAR-10"

- id: rl
  title: "Reinforcement learning"
  title_nl: "Reinforcement learning"
  domains: [D18]
  status: later
  build_order: 4
  project: {id: agent, title: "Your own agent: bandit, tabular Q-learning, DQN and PPO", title_nl: "Je eigen agent: bandit, tabel-Q-learning, DQN en PPO"}
  attach: [rl-what-is-rl, rl-q-learning, llm-rlhf-idea]
  final_nl: "Een PPO-agent die je vanaf nul schrijft en traint in een Gymnasium-omgeving"

- id: bouwen
  title: "Building with AI: prompts, RAG and agents"
  title_nl: "Bouwen met AI: prompts, RAG en agents"
  domains: [D17]
  status: later
  build_order: 5
  project: {id: app, title: "Your own assistant on a local open model: prompts, RAG, tools and evals", title_nl: "Je eigen assistent op een lokaal open model: prompts, RAG, tools en evals"}
  attach: [start-using-ai-tools, llm-chat-template]
  final_nl: "Een agent met retrieval en tools, met een eigen evaluatieset en foutanalyse"
  note_nl: "Geen API-sleutels en geen internet nodig: de API-oefeningen praten met een lokale server (Ollama of llama.cpp, met een OpenAI-compatibele API) en een open model met een permissieve licentie. Betaalde API's komen alleen als uitleg of als optionele verdieping."

- id: verantwoord
  title: "Responsible and safe AI: ethics, fairness, explainability, privacy, security and alignment"
  title_nl: "Verantwoorde en veilige AI: ethiek, fairness, uitlegbaarheid, privacy, security en alignment"
  domains: [D24, D25]
  status: later
  build_order: 6
