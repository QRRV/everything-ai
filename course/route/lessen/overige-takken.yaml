- id: search-astar
  tak: klassieke-ai
  title: "A*: search with a sense of direction"
  level: basis
  module: agents
  idea: "A* takes from a priority queue the path with the smallest f = g + h, its steps so far plus an estimate of the steps still to go; with an estimate that never says too much and changes by at most 1 per step, as in a maze, it still finds a shortest path, but expands fewer states."
