- id: rl-q-learning
  tak: rl
  title: "Learning from your own steps: Q-learning"
  level: basis
  module: agents
  idea: "Without the transition function, an agent learns Q(s, a) from its own steps: Q-learning moves each Q a step towards the reward plus the discounted best Q where it landed, and ε-greedy makes it explore with a random action now and then, so that the return per episode grows."
