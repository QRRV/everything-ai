- id: cv-histogram-equalization
  title: "Spread the grays: histogram equalization"
  level: basis
  module: image-processing
  idea: "A dull photo uses only part of the grays; mapping each gray to 255 times the share of pixels with that gray or a darker one spreads them over the whole range, and the histogram shows it."
  covers: [d13-klassieke-beeldverwerking#0]
  requires: [cv-color-spaces, stats-describe]
