# ResNet already gave its residual connection a convolution of 1 by 1 (cnn-resnet); this lesson names it and shows
# what it is for. The term list has it as pointwise-convolution ("1×1 convolution"). cv-fpn and cv-fcn need it.
# The lesson mixes the colors of the course's landscape (data-images-as-arrays) with 1×1 convolutions, counts the
# bottleneck of ResNet-50 (70,016 parameters with biases, against 590,080 for one 3×3 convolution from 256 to 256), and
# the learner builds Bottleneck (cnn/bottleneck.py). The demo puts it in the middle of a wider ColorCNN on 6,000
# photos of CIFAR-10 for 20 epochs: with 16 in the middle the network has 34,090 parameters instead of 66,570, and
# reads 521 to 550 test photos right against 532 to 572, and learns its training photos less by heart. Wall time is
# not claimed: on one thread the course's runs took about as long with and without the bottleneck.
- id: cv-1x1-convolution
  title: "1×1 convolutions: mixing the channels"
  level: gevorderd
  module: cnn-families
  idea: "A 1×1 convolution mixes the channels of each pixel without looking at its neighbors, as a linear layer on every pixel; it makes the number of channels smaller or larger cheaply, such as before an expensive 3×3 convolution."
