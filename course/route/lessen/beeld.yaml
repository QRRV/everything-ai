# The lesson counts multiplications exactly: by the paper's rule d·w²·r², 4 times the blocks would be 8 and twice the
# channels 128, but counted those cost only 3.53 and 3.48 times as much (the first convolution grows otherwise), so
# the demo grows to 9 blocks and 136 channels. On 6,000 photos of CIFAR-10 made 16 by 16, for 20 epochs, the base
# network (2 blocks of 64 channels) reads 506 to 524 test photos right; grown to about 4 times its multiplications,
# deeper 513 to 536 (it overfits), wider 536 to 555, sharper (32 by 32) 514 to 558 and all three together (φ = 2)
# 543 to 571: all three together first, as in the paper, though the runs overlap and deeper hardly beats the base
# network, and the lesson says so.
- id: cv-efficientnet
  title: "EfficientNet: wider, deeper or sharper"
  level: gevorderd
  module: cnn-families
  idea: "A CNN can grow in depth, in width or in the resolution of its input photos; growing all three together in a fixed ratio, compound scaling, gave EfficientNet more accuracy on ImageNet for the same computation than growing just one, and you work out what each choice costs."
