- id: cv-fpn
  title: "A feature pyramid for small and large objects"
  level: gevorderd
  module: detection
  idea: "Deep feature maps know what is there but are coarse, early ones are sharp but know little; a feature pyramid network makes the deep maps larger again with nearest-neighbor interpolation, gives the earlier ones the same number of channels with a 1×1 convolution and adds them up, so that every scale has both and the detector finds small objects too."
  covers: [objectdetectie#4]
  # Measured on the course's scenes with spread=True (radius 5-40 px; checks.py, REFERENCE and TRAINED): the backbone
  # of cv-one-stage-detector with two more parts, C2-C5 (32/64/128/128 channels, squares of 4-32 px); lateral 1x1 to
  # 32 channels, nearest-neighbor x2 top down, smooth 3x3; one shared head (2 anchors x 8); anchors 2 and 2*sqrt(2)
  # squares wide per level, 2,720 in all; 299,728 parameters. Loss with hard negative mining (3 background anchors per
  # positive at most, as SSD); with the plain loss of cv-one-stage-detector it finds 9 of 786 shapes. 8 epochs, batch 32, one
  # thread (~170 s). Seeds 0-4, 786 test shapes (268 small, 282 medium, 236 large): FPN 727-741 found (small 244-249),
  # mAP 0.934-0.950; without the top-down path 731-739 (small 242-252), mAP 0.947-0.957; all anchors on C4 553-573
  # (small 129-143), mAP 0.761-0.790; all on C2 687-706 (small 202-219), 505-546 false boxes, mAP 0.814-0.844.
  requires: [cv-one-stage-detector, cv-1x1-convolution]
  introduces: [c:feature-pyramid-network, c:lateral-connection, c:image-pyramid, c:hard-negative-mining, py:interpolate]
