# --- basis: working with images (classical image processing, in NumPy) ---------------------------------------
- id: cv-image-files
  title: "From light to a file of numbers"
  level: basis
  module: image-processing
  idea: "An image file stores a number per pixel and per color: PNG keeps every number exactly, JPEG keeps a much smaller approximation."
  covers: [beelden-als-data#3, beelden-als-data#4]
  requires: [data-images-as-arrays, data-text-as-numbers, ml-regression-metrics]
