- id: cv-canny
  title: "Thin, connected edges: Canny"
  level: basis
  module: image-processing
  idea: "Canny turns the thick edges of Sobel into thin, connected lines: it keeps only the strongest point across each edge, and a weaker point only where it touches a strong one."
