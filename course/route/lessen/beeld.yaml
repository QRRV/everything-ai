# A standard DenseNet-BC-100 is about 7 times ResNet-20, too slow for a demo on a CPU: the demo of cv-densenet puts one
# dense block with its transition in the middle of the network of cv-1x1-convolution, on 6,000 photos of CIFAR-10, and
# compares growth rates at the same number of channels with a chain of the same depth and weights.
- id: cv-densenet
  title: "DenseNet: every layer sees all the layers before it"
  level: gevorderd
  module: cnn-families
  idea: "In a dense block every layer gets the feature maps of all layers before it, stacked along the channels, and adds only a few channels of its own, the growth rate; between blocks, a transition layer mixes the channels with a 1×1 convolution, in DenseNet-BC into half as many, and halves the maps with pooling. DenseNet uses features again instead of learning them again."
  covers: [d11-cnn-architecturen#1]
