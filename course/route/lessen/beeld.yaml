# Inception, DenseNet and U-Net stack maps along the channels with torch.cat (py:torch-cat), which torch-tensors
# introduces (moved there from attn-multi-head when cv-inception was built: both chains share torch-tensors).
# The lesson counts inception (3a) of GoogLeNet (163,696 parameters with biases and 128 million multiplications for a
# photo, against 387,296 parameters and 416 channels out for the paper's naive block, without the 1×1 convolutions
# before the 3×3 and 5×5 filters and after the pooling), and the learner builds Inception (cnn/inception.py). The demo
# puts it in the middle of the network of cv-1x1-convolution, on 6,000 photos of CIFAR-10 for 20 epochs: 553 to 585
# test photos right with 44,658 parameters, against 532 to 572 with one 3×3 convolution (66,570). Then it switches off
# one branch at a time after training: the 1×1 branch costs 100 to 144 test photos, the 5×5 branch from 2 more to 34
# fewer. That says what the trained network leans on, not what a network trained without the branch could do.
- id: cv-inception
  title: "Inception: filters of several sizes side by side"
  level: gevorderd
  module: cnn-families
  idea: "Inception puts branches of 1×1, 3×3 and 5×5 filters side by side, each behind a 1×1 convolution that makes the channels fewer, and stacks what they find along the channels; one block sees small and large patterns at once, at a cost a plain stack of large filters could not pay."
  covers: [d11-cnn-architecturen#1]
