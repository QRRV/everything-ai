# --- basis: boxes and masks ----------------------------------------------------------------------------------
- id: cv-annotations
  title: "Labels, boxes, masks and keypoints"
  level: basis
  module: boxes-and-masks
  idea: "What a vision model must find decides how its data is labeled: one label per image, a box per object, a mask per object or points on exact places of it; the more exact, the longer the labeling takes."
