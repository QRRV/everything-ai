  # 3x3 to 18 (3 anchors x 2 logits + 4 offsets), proposals = top 100 by probability, NMS 0.7, first 32; RoI pooling to
  # 4 x 4 (F.adaptive_max_pool2d on the squares of the corners); second stage 1024-128-8; 167,386 parameters (one-stage
  # 38,616). True boxes join the proposals in training; approximate joint training; 8 epochs, batch 32, one thread
  # (~180 s). Seeds 0-4: mAP@0.5 0.947-0.962, @0.75 0.734-0.779, 761-776 shapes found, 107-116 false boxes, 804-805
  # shapes with a proposal above IoU 0.5. Seed 0, proposals kept to detect: 1 -> 0.241, 8 -> mAP@0.75 0.824 (highest),
  # 64 -> 0.751. RoIAlign instead (seed 0): mAP@0.5 0.964, @0.75 0.891.
  requires: [cv-one-stage-detector]
  introduces: [c:two-stage-detector, c:region-proposal-network, c:roi-pooling, c:faster-r-cnn, py:adaptive-max-pool2d, py:torch-argsort]
