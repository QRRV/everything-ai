# show the edges and colors. Each filter is drawn on its own scale, 0.5 + w / (2·max|w|), gray = 0: mostly edges, spots
# of one color, and 8 filters (2, 4, 7, 9, 13, 36, 38, 48) whose weights are below 1e-5 and whose maps are 0 on every
# photo. The maps are of the course photos, prepared as in cv-try-classifier; channel 120 of layer3 is the strongest on
# the cat, high around both eyes, and 154th of 256 on the coffee. Receptive fields 7, 11 (pool), 43, 99, 211, 435; the
# tests check them by autograd. No training: the slider over the filters and the demo need only the ResNet-18 download.
