# The 3×3 filters of a small CIFAR CNN are 9 pixels and barely readable; the 7×7 filters of ResNet-18's first layer
# show the edges and colors.
- id: cv-inside-cnn
  title: "Look inside a CNN: filters and feature maps"
  level: gevorderd
  module: color-cnn
  idea: "The first layer of a trained CNN such as ResNet-18 holds small detectors of edges and colors, and the feature maps of deeper layers answer to larger parts of a photo; drawing them shows what the network learned to look for."
