# maps of 14 by 14, 462 million against 52.3 million). The demo puts a depthwise separable convolution in the middle of
# the network of cv-1x1-convolution, on 6,000 photos of CIFAR-10 for 20 epochs: 548 to 581 test photos right with
# 4,800 parameters in its middle, against 532 to 572 with one 3×3 convolution (36,928). Only the depthwise or only the
