# The demo trains 40 epochs with flip, crop and color on cv-color-cnn's 6,000 photos (about a minute on one thread);
# with 20 epochs, augmentation made the small ColorCNN underfit, and at 40 epochs it clearly wins. The other runs of
# its picture (no changes at 20 and 40 epochs, flip, flip and crop, upside down instead of flip) are the course's, 5 seeds
# each. Contrast comes from cv-histogram-equalization; clamp and int() are only in the demo's Dataset, shown in the text.
- id: cv-augment-photos
  title: "Data augmentation for photos: flip, crop and color"
  level: gevorderd
  module: color-cnn
  idea: "A mirror image, a random crop and a small change of color keep what a photo shows, so every epoch can show the CNN slightly different photos; it learns its training photos less by heart and gets more new ones right, while a change that alters the label, such as turning a 6 into a 9, or makes photos unlike real ones, such as an upside-down car, does not help."
