# --- gevorderd: object detection ------------------------------------------------------------------------------------
# On the course's own scenes (scenes.py): no licence questions, no people, and a detector trains on them on a CPU.
- id: cv-anchors
  title: "Anchors: the boxes a detector starts from"
  level: gevorderd
  module: detection
  idea: "Many detectors, unlike DETR, put a fixed set of anchor boxes, a few sizes and shapes, on every square of a feature map, and learn for each anchor only a kind and a small shift and change of size; matching the anchors to the true boxes by IoU decides what each anchor should learn."
  covers: [objectdetectie#0]
  # Measured on the course's scenes (checks.py, REFERENCE): 3 square sizes (16, 24, 32) on 16 x 16 squares of 8 pixels,
  # 768 anchors; RetinaNet's thresholds (0.5 / 0.4) plus every box's best anchors, ties included. scene(18): 20 learn a
  # shape, 13 ignored, 735 background; 500 scenes: 17.2 per scene (2.2%). One size finds at most 81.0% of the shapes
  # (28 px), the three together 98.8% (55.0% at 0.7), Faster R-CNN's 9 anchors 99.0%, 8 x 8 squares 69.6%. The boxes
  # are 9 to 44 pixels and almost square (h/w 0.88 to 1.13). Offsets: mean 0.11 (shift) and 0.15 (log of the size).
  requires: [cv-pretrained-detector, cnn-resnet]
  introduces: [c:anchor-box, c:box-offset]
