- id: cv-morphology
  title: "Grow and shrink shapes: erosion and dilation"
  level: basis
  module: image-processing
  idea: "Erosion keeps a pixel only if its whole neighborhood is white, dilation makes it white if any neighbor is; one after the other, they remove specks (opening) or fill holes (closing)."
  covers: [d13-klassieke-beeldverwerking#5]
  requires: [cv-otsu-threshold, cv-color-spaces]
  introduces: [c:morphological-operation, c:structuring-element, c:erosion, c:dilation, c:opening, c:closing]
