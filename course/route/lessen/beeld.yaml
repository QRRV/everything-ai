# --- basis: boxes and masks ----------------------------------------------------------------------------------
- id: cv-annotations
  title: "Labels, boxes, masks and keypoints"
  level: basis
  module: boxes-and-masks
  idea: "What a vision model must find decides how its data is labeled: one label per image, a box per object, a mask per pixel or a point per joint."
  covers: [beelden-als-data#5]
  requires: [cv-connected-components]
  introduces: [c:annotation, c:object-detection, c:segmentation-mask, c:keypoint]
  uses: [c:bounding-box, c:label, c:connected-component]
  ladder: [numpy]
  data: [course-scenes, coco-annotations]
  needs: any

- id: cv-iou
  title: "How much two boxes overlap: IoU"
  level: basis
  module: boxes-and-masks
  idea: "The intersection over union of a predicted and a true box is the overlap divided by the area they cover together: 1 for a perfect box, 0 for a miss."
  covers: [objectdetectie#0]
  requires: [cv-annotations]
  introduces: [c:intersection-over-union]
  uses: [c:bounding-box, c:object-detection]
  ladder: [python, numpy]
  data: [course-scenes]
  needs: any

- id: cv-nms
  title: "One box per object: non-maximum suppression"
  level: basis
  module: boxes-and-masks
  idea: "A detector proposes many boxes for one object; keeping the most confident box and dropping every box that overlaps it too much leaves one box per object."
  covers: [objectdetectie#0]
  requires: [cv-iou]
  introduces: [c:non-maximum-suppression, c:confidence-score]
  uses: [c:intersection-over-union, c:bounding-box]
  ladder: [python, numpy]
  data: [course-scenes]
  needs: any

- id: cv-map
  title: "Score a detector: mean average precision"
  level: basis
  module: boxes-and-masks
  idea: "A detected box counts as found when its IoU with a true box is high enough; the area under the precision-recall curve per kind, averaged over the kinds, is the detector's mAP."
  covers: [objectdetectie#0]
  requires: [cv-nms, ml-roc-auc]
  introduces: [c:average-precision, c:mean-average-precision]
  uses: [c:precision-recall-curve, c:intersection-over-union, c:confidence-score]
  ladder: [numpy]
  data: [course-scenes]
  needs: any

- id: cv-pretrained-detector
  title: "Use a pretrained detector"
  level: basis
  module: boxes-and-masks
  idea: "A detector trained on COCO draws a box, a kind and a score around each object it knows in a photo; a threshold on the score decides which boxes you keep, and that threshold trades missed objects for false boxes."
  covers: [objectdetectie#1]
  requires: [cv-map, cv-prepare-photo]
  introduces: [c:score-threshold]
  uses: [c:object-detection, c:bounding-box, c:confidence-score, c:non-maximum-suppression, c:pretrained-model]
  ladder: [torch]
  data: [model-detr-resnet50, caltech-101-download-only]
  needs: any
