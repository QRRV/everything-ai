- id: cv-focal-loss
  title: "Focal loss and RetinaNet"
  level: gevorderd
  module: detection
  idea: "Almost every anchor lies on the background, and their many small, easy losses drown out the few objects; focal loss makes the cross-entropy of an anchor smaller the surer the model already is, which let RetinaNet, a one-stage detector with a feature pyramid, match the two-stage detectors."
  covers: [objectdetectie#3]
  # Measured on the course's scenes with spread=True (checks.py, REFERENCE and TRAINED): the FPN detector of cv-fpn
  # (2,720 anchors, one head, softmax over background and 3 kinds); focal loss summed over the anchors that are not
  # ignored and divided by the anchors that learn a shape, plus the box loss; every anchor started at background with
  # pi = 0.01 (background bias log 297, the kinds 0); 8 epochs, batch 32, one thread (~150 s). Seeds 0-4, 786 test
  # shapes: gamma 2 723-734 found, 95-109 false boxes, mAP 0.944-0.951; gamma 0 (CE / shapes) 729-740, 127-145 false;
  # gamma 1 726-741, 100-127 false; gamma 5 706-711, 71-81 false; hard negative mining (cv-fpn) 727-741, 104-114
  # false; without the start, gamma 2 723-735 and CE / shapes 726-737 (no divergence at 2,720 anchors); mean CE 8-59
  # found, with the start 361-428; mean focal loss 233-286. The trained gamma-2 detector: easy background anchors
  # (p_t > 0.9) give 56% of its summed CE on the test scenes and 0.2% of its focal loss.
  requires: [cv-fpn, cv-rcnn]
  introduces: [c:focal-loss, c:retinanet]
  uses: [c:one-stage-detector, c:two-stage-detector, c:region-proposal-network, c:faster-r-cnn, c:feature-pyramid-network, c:hard-negative-mining, c:anchor-box, c:box-offset, c:intersection-over-union, c:bounding-box, c:object-detection, c:non-maximum-suppression, c:confidence-score, c:score-threshold, c:mean-average-precision, c:average-precision, c:backbone, c:feature-map, c:convolution, c:layer, c:logit, c:softmax, c:sigmoid, c:probability, c:cross-entropy, c:mean-absolute-error, c:loss, c:training, c:epoch, c:mini-batch, c:train-set, c:test-set, c:seed, c:model-parameter, c:weight, c:bias-term, c:initialization, c:class-imbalance, c:hyperparameter, c:divergence, c:resnet, c:tensor, c:shape, c:class, c:label, c:logarithm, c:mean, s:exp, s:log, v:loss-curve, py:nn-cross-entropy-loss, py:torch-tensor, py:torch-cat, py:boolean-mask, py:math-module, py:comparison, py:indexing, py:for, py:range, py:len, py:list, py:append, py:keyword-argument, py:method, py:def, py:return, py:import, py:import-as, py:print, py:comment, py:variable, py:arithmetic, py:int, py:float, q:predict, q:choice, q:exercise-with-check, q:slider-task, q:explain, q:run-cell]
  mentions: [c:fully-convolutional-network, c:transposed-convolution]
  ladder: [torch]
  data: [course-scenes]
  reference_data: []
  needs: any

# --- gevorderd: segmentation ----------------------------------------------------------------------------------------
# Segmentation does not need detection, except Mask R-CNN (through cv-rcnn).
- id: cv-fcn
  title: "A kind for every pixel: FCN and transposed convolutions"
  level: gevorderd
  module: segmentation
  idea: "Semantic segmentation gives every pixel a kind; a fully convolutional network has no linear layers, so it takes a photo of any size, and makes its coarse feature maps full size again, upsampling, with transposed convolutions that learn how."
  covers: [segmentatie#3, convolutionele-netwerken#2]
  # Measured on the course's scenes (checks.py, REFERENCE and TRAINED): blocks of conv 3x3 + ReLU + max pool 2 (16, 32,
  # 64 channels), one more conv 3x3, a 1x1 conv to 4 classes, one ConvTranspose2d (kernel 2s, stride s, padding s/2,
  # no bias) started as bilinear and learned; 64,868 parameters at stride 8; 8 epochs, batch 32, one thread (~170 s).
  # Background is 87% of the test pixels. IoU of the pixels of circles / squares / triangles over seeds 0-4: stride 8
  # 0.78-0.87 / 0.53-0.71 / 0.60-0.73; stride 4 (sees 18 px) 0.54-0.66 / 0.07-0.32 / 0.30-0.46; stride 16 0.54-0.72
  # / 0.21-0.47 / 0.27-0.53, with 16 epochs 0.66-0.86 (seeds 1-4 as good as stride 8); stride 32 0.38-0.60, with 16
  # epochs 0.52-0.75. At stride 8: fixed bilinear 0.68-0.87, random start 0.63-0.82, fixed nearest 0.50-0.67 (the best
  # 8x8 blocks would give 0.78 / 0.72 / 0.64). The same FCN on scenes of 96 and 192 px: circles 0.69-0.77, 0.82-0.92.
  requires: [cv-1x1-convolution, cv-iou, cv-annotations]
  introduces: [c:semantic-segmentation, c:fully-convolutional-network, c:upsampling, c:transposed-convolution, py:nn-convtranspose2d]
  uses: [c:segmentation-mask, c:pointwise-convolution, c:intersection-over-union, c:convolution, c:feature-map, c:filter, c:kernel-size, c:stride, c:padding, c:pooling, c:receptive-field, c:relu, c:layer, c:channel, c:output-channel, c:nearest-neighbor-interpolation, c:bilinear-interpolation, c:interpolation, c:classification, c:vgg, c:pretrained-model, c:cross-entropy, c:loss, c:training, c:epoch, c:mini-batch, c:learning-rate, c:train-set, c:test-set, c:seed, c:model-parameter, c:weight, c:initialization, c:backward-pass, c:tensor, c:shape, c:axis, c:class, c:label, c:pixel, c:accuracy, c:mean, v:loss-curve, py:nn-conv2d, py:nn-maxpool2d, py:nn-modulelist, py:nn-cross-entropy-loss, py:nn-init, py:nn-linear, py:torch-tensor, py:torch-permute, py:torch-unsqueeze, py:torch-relu, py:no-grad, py:with, py:requires-grad, py:manual-seed, py:np-zeros, py:zeros-like, py:np-argmax, py:boolean-mask, py:mask-and-or, py:np-sum, py:np-mean, py:indexing, py:slicing, py:augmented-assignment, py:floor-division, py:int-conversion, py:dim, py:for, py:range, py:len, py:list, py:comprehension, py:keyword-argument, py:method, py:def, py:return, py:import, py:print, py:comment, py:variable, py:arithmetic, py:comparison, py:int, py:float, q:predict, q:choice, q:exercise-with-check, q:slider-task, q:explain, q:run-cell]
  mentions: [c:skip-connection, c:mean-iou, c:imagenet, c:alexnet, c:inception]
  ladder: [torch]
  data: [course-scenes]
  reference_data: []
  needs: any

# The natural words encoder and decoder are items of lm-model-families, outside this chain: the lesson says "the way
# down" and "the way up".
- id: cv-unet
  title: "Project: your own U-Net"
  level: gevorderd
  module: segmentation
  kind: project
  project: cnn
  idea: "A U-Net goes down to coarse feature maps and back up, and stacks each map on the way up with the map of the same size from the way down; with those skip connections it gets the details from before every pooling. You train one on the course's scenes and score its masks with mean IoU, the IoU of each class averaged over the classes, background included."
  covers: [d11-cnn-architecturen#5, segmentatie#3]
  # Measured on the course's scenes (checks.py, REFERENCE and TRAINED): blocks of two conv 3x3 (padding 1) + BatchNorm2d
  # + ReLU; the way down 8, 16, 32 channels, each kept, then max pool 2; a bottom block of 64 at 16 px; each step up a
  # ConvTranspose2d 2x2 stride 2, torch.cat with the kept map, a block back to half; a 1x1 conv to 4 classes; 121,556
  # parameters; trained as cv-fcn (8 epochs, batch 32, one thread, ~9 min). Median mean IoU over seeds 0-4, background
  # included: 3 skips 0.95, 2 skips 0.94, 1 skip 0.93, none 0.91 (squares 0.87 -> 0.92, triangles 0.84 -> 0.92); 3 skips
  # without BN 0.43; cv-fcn's FCN 0.77. Seed 3 with 3 skips and seed 0 with 1 skip call the triangles squares after 8
  # epochs (seed 3: 97.3% of the pixels right, mean IoU 0.65); with 16 epochs, seed 3 reaches 0.97. nn.BatchNorm2d is
  # introduced in cv-one-stage-detector, outside this chain: the lesson explains it as nn-batchnorm's BatchNorm1d per
  # channel, so it is in mentions.
  requires: [cv-fcn]
  introduces: [c:u-net, c:skip-connection, c:mean-iou]
  uses: [c:semantic-segmentation, c:fully-convolutional-network, c:upsampling, c:transposed-convolution, py:nn-convtranspose2d, c:batchnorm, s:gamma-scale, s:beta-shift, c:standardization, c:neuron, c:residual-connection, c:receptive-field, c:intersection-over-union, c:segmentation-mask, c:median, c:convolution, c:feature-map, c:filter, c:kernel-size, c:stride, c:padding, c:pooling, c:relu, c:layer, c:channel, c:output-channel, c:pointwise-convolution, c:cross-entropy, c:loss, c:training, c:epoch, c:mini-batch, c:train-set, c:test-set, c:seed, c:model-parameter, c:weight, c:tensor, c:shape, c:axis, c:class, c:label, c:pixel, c:accuracy, c:mean, c:vgg, c:resnet, v:loss-curve, py:nn-conv2d, py:nn-maxpool2d, py:nn-modulelist, py:nn-module, py:torch-cat, py:torch-tensor, py:torch-permute, py:torch-unsqueeze, py:torch-relu, py:manual-seed, py:np-zeros, py:zeros-like, py:boolean-mask, py:mask-and-or, py:np-sum, py:np-mean, py:indexing, py:augmented-assignment, py:for, py:range, py:list, py:append, py:round, py:class, py:init-method, py:forward-method, py:super, py:inheritance, py:self, py:def, py:return, py:import, py:print, py:comment, py:variable, py:arithmetic, py:comparison, py:int, py:float, py:keyword-argument, py:method, py:dim, q:predict, q:choice, q:exercise-with-check, q:slider-task, q:explain, q:run-cell]
  mentions: [py:nn-batchnorm2d, c:gpu, c:paper]
  ladder: [torch]
  data: [course-scenes]
  reference_data: []
