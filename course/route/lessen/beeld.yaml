# cv-grad-cam: the class activation map from layer4 and fc of ResNet-18 on the cat (its mean plus the bias is the
# logit, 19.6482), and Grad-CAM, which for ResNet-18 is its positive part divided by 49. The slider shows Grad-CAMs
# the course measured, on a collage made from two of the course's photos (the middle half of the cat beside the
# middle half of the coffee), so it needs no download: ResNet-18's 8 best guesses, the cat classes 95% to 96% on the
# cat half, espresso (0.02) 87% on the coffee half, bucket split 44/56. On this collage the maps from layer3 no longer
# part (37% to 65% on the cat half): the paper says maps get worse in earlier layers (section 3, appendix B.1). Its checks use made-up maps, a ResNet-18
# with random weights and the DigitCNN with random weights, a CNN without global average pooling.
- id: cv-grad-cam
  title: "Grad-CAM: where a CNN looked"
  level: gevorderd
  module: explaining
  idea: "When a CNN ends with global average pooling, the mean of each feature map, and one linear layer, the weights of a class over the feature maps make a heat map, the class activation map; Grad-CAM finds those weights for any CNN from the gradient of the class score, adds up the weighted maps and keeps the positive part, a coarse map of the places that speak for that class, which shows where the evidence for a class lies, not how sure the model is."
  covers: [vision-modellen-visualiseren-en-begrijpen#1, vision-modellen-visualiseren-en-begrijpen#2]
  requires: [cv-saliency, nn-activation-stats, torch-autograd]
  introduces: [c:global-average-pooling, c:class-activation-map, c:grad-cam, py:retain-grad]
