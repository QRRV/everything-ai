- id: cv-otsu-threshold
  title: "Black or white: a threshold and Otsu's method"
  level: basis
  module: image-processing
  idea: "A threshold turns a gray image into a binary one; Otsu's method tries every gray and picks the threshold with the smallest within-group variance, where the pixels lie, on average, closest to the mean of their own group."
  covers: [d13-klassieke-beeldverwerking#1]
  requires: [cv-histogram-equalization, prob-expectation]
  introduces: [c:point-operation, c:thresholding, c:binary-image, c:within-group-variance, c:otsu-method]
