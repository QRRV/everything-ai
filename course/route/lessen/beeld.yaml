# --- gevorderd: where a CNN looks -----------------------------------------------------------------------------------
# On ResNet-18 and the course's photos (224 pixels): in a small CIFAR CNN the last feature map is 8×8 or 4×4, so a
# heat map over a photo of 32 by 32 is a blob. The learner's own CIFAR CNN can be compared.
# cv-saliency: the maps of the cat, the coffee and the drawing of fruit for ResNet-18's best guess. The slider in
# The idea shows probabilities the course measured, so it needs no download: a change of 1 to 12 (of 255) against
# the slope on the 5% most salient pixels of balloon's map, or on 5% random pixels. Its checks use a ResNet-18 with
# random weights and made-up maps. No Caltech-101 or CIFAR-10: three photos show the map and its limits.
- id: cv-saliency
  title: "Saliency: the pixels that change the answer"
  level: gevorderd
  module: explaining
  idea: "The gradient of a class score with respect to the pixels of the photo says which pixels would change that score the most; drawn as a picture, it is a first and noisy explanation: it shows where a classifier's score is sensitive, not what the classifier needs."
  covers: [saliency-en-uitleg-evalueren#0]
