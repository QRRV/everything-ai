  warns: [faithfulness]
  data: [model-qwen3-0.6b, course-summaries]
  ladder: [python]
  needs: any

# --- bouwen/agents: agents and tools -------------------------------------------
- id: build-tool-calling
  title: "Tools as JSON: function calling"
  level: basis
  domein: bouwen
  module: agents
