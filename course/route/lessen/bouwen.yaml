  needs: any

- id: build-prompt-templates
  title: "Prompts as code: templates and versions"
  level: basis
  domein: bouwen
  module: prompts
  idea: "A prompt you use in a program is a template with fields you fill in, kept in a file under version control, so you know which version gave which answers."
  covers: [prompting-voor-ontwikkelaars#3]
  requires: [build-system-prompt]
  introduces: [c:prompt-template, c:prompt-version]
  data: []
  ladder: [python]
  needs: any

- id: build-project-prompts
  title: "Project: your assistant, prompted well"
  level: basis
  domein: bouwen
  module: prompts
  kind: project
  project: app
  idea: "Your assistant gets a system prompt and templates from files of its own, and gives answers as JSON it checks itself, so the rest of your app can use them."
  covers: []
  requires: [build-project-call, build-prompt-templates, build-structured-output]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: build-model-specific
  title: "Each model its own prompt"
  level: basis
  domein: bouwen
  module: prompts
  idea: "A prompt that works for one model can fail for another: each has its own habits and its own guide; moving to a new model means running your examples again and adjusting the prompt."
  covers: [prompting-voor-ontwikkelaars#4]
  requires: [build-prompt-templates, build-choose-model]
  introduces: [c:prompt-migration]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: build-defensive-prompts
  title: "Prompts that hold"
  level: basis
  domein: bouwen
  module: prompts
  idea: "Text from users or documents can contain instructions of its own (prompt injection); mark such text clearly as data, tell the model not to follow instructions in it, and check the answer anyway."
  covers: [prompting-voor-ontwikkelaars#9]
  requires: [build-system-prompt]
  introduces: [c:prompt-injection, c:defensive-prompting]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: build-self-consistency
  title: "Ask more than once"
  level: basis
  domein: bouwen
  module: prompts
  idea: "Ask the same question several times with sampling and take the answer that comes back most often (self-consistency): more calls, more often right, as counted on questions with one right answer."
  covers: [sampling-ensembles-en-zoeken#0]
  requires: [build-sampling-api]
  introduces: [c:self-consistency]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: build-context-engineering
  title: "What goes into the window"
  level: basis
  domein: bouwen
  module: prompts
