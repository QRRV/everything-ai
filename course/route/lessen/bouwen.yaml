  title: "JSON you can rely on"
  level: basis
  domein: bouwen
  module: prompts
  idea: "Ask for JSON and you often get almost-JSON: check the answer against a schema, and when it does not fit, ask again with what was wrong; hosted APIs can force valid JSON while the model writes."
