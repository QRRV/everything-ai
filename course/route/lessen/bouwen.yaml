  title: "Tools an agent can use well"
  level: basis
  domein: bouwen
  module: agents
  idea: "A model can only use a tool as well as it is described: a clear name, a description that says when to use it, arguments with examples and error messages that say what to do instead; a measured run shows the difference. Tools run in your program or at the provider."
