- id: build-system-prompt
  title: "System prompts and prefill"
  level: basis
  domein: bouwen
  module: prompts
  idea: "The system prompt says once how the assistant behaves in the whole conversation, and a prefill writes the first words of its answer for it, so the answer starts the way you need."
  covers: [prompting-voor-ontwikkelaars#2]
  requires: [build-call-api]
