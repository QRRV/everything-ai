# --- bouwen/rag: retrieval-augmented generation ---------------------------------
- id: build-rag-idea
  title: "Look it up first: what RAG is"
  level: basis
  domein: bouwen
  module: rag
  idea: "A model answers from what it learned, and makes things up where that falls short; retrieval-augmented generation first looks up texts that fit the question and puts them in the prompt, so the answer can come from them."
  covers: [rag-basis#0]
  requires: [build-call-api, lm-hallucination, start-prompt-chains]
  introduces: [c:retrieval-augmented-generation, c:retrieval]
  data: []
  needs: any

- id: build-rag-first
  title: "Your first RAG"
  level: basis
  domein: bouwen
  module: rag
  idea: "A whole RAG fits in a few functions: find the texts that share the most words with the question, put them in the prompt with the question, and send it to the model."
  covers: [rag-basis#1]
  requires: [build-rag-idea, build-system-prompt]
  introduces: [c:rag-pipeline, c:knowledge-base]
  data: [model-qwen3-0.6b, course-summaries]
  ladder: [python]
  needs: any

- id: build-documents-to-text
  title: "From files to text"
  level: basis
  domein: bouwen
  module: rag
  idea: "Before you can search documents you need their text: from Markdown and HTML it comes out cleanly, from a PDF with lost tables and columns, and from a scan only with OCR."
  covers: [rag-basis#2]
  requires: [build-rag-first, py-files]
  introduces: [c:document-parsing, c:ingestion]
  data: [course-summaries]
  ladder: [python]
  needs: any

- id: build-chunking
  title: "Cutting documents into pieces"
  level: basis
  domein: bouwen
  module: rag
  idea: "Documents are cut into chunks that are searched one by one: a fixed length, along paragraphs and sentences (recursive), or where the meaning changes (semantic); how you cut decides how often the right piece is found."
  covers: [rag-basis#3]
  requires: [build-documents-to-text]
  introduces: [c:chunk, c:chunking, c:chunk-overlap]
  data: [course-summaries]
  ladder: [python]
  needs: any

- id: build-bm25
  title: "Search by words: BM25"
  level: basis
  domein: bouwen
  module: rag
  idea: "BM25 scores a text by the words it shares with the question: a rare word counts more than a common one, a word that comes back often counts less each time, and a long text gets no head start."
  covers: [rag-basis#5]
  requires: [build-chunking, math-exp-log]
  introduces: [c:lexical-retrieval, c:term-frequency, c:inverse-document-frequency, c:bm25]
  data: [course-summaries]
  ladder: [python, numpy]
  needs: any

- id: build-retrieval-embeddings
  title: "Search by meaning"
  level: basis
  domein: bouwen
  module: rag
  idea: "With embeddings, a question finds texts that mean the same without sharing words, even in another language: embed every chunk once, embed the question, and take the chunks with the highest cosine similarity."
  covers: [rag-basis#4]
  requires: [build-bm25, build-embeddings-api]
  introduces: [c:dense-retrieval, c:cross-lingual-retrieval]
  data: [model-granite-embedding, course-summaries]
  ladder: [python, numpy]
  needs: any

- id: build-grounded-answers
  title: "Answers from the sources"
  level: basis
  domein: bouwen
  module: rag
  idea: "Tell the model to answer only from the chunks it got, to name the chunk for each claim, and to say it does not know when they do not answer the question; then check whether the named chunk says it."
  covers: [rag-basis#6]
  requires: [build-retrieval-embeddings]
  introduces: [c:grounded-generation]
  data: [model-qwen3-0.6b, course-summaries]
  ladder: [python]
  needs: any

- id: build-project-rag
  title: "Project: your assistant reads your documents"
  level: basis
  domein: bouwen
  module: rag
  kind: project
  project: app
  idea: "Your assistant answers questions about your own documents, or about the summaries of the course: cut them into chunks, search by words and by meaning, and answer from the sources with the source named."
  covers: []
  requires: [build-project-prompts, build-grounded-answers]
  data: [model-qwen3-0.6b, model-granite-embedding, course-summaries]
  ladder: [python, numpy]
  needs: any

- id: build-vector-index
  title: "Searching many vectors fast"
  level: basis
  domein: bouwen
  module: rag
  idea: "Comparing a question with every vector is slow for millions of them; an index such as IVF only compares with the vectors in the nearest clusters, much faster and almost always with the same answer (approximate nearest neighbors); HNSW and FAISS do it better."
  covers: [retrieval-techniek#0]
  requires: [build-retrieval-embeddings, ml-kmeans]
  introduces: [c:vector-index, c:approximate-nearest-neighbors, c:ivf-index, c:hnsw]
  data: [model-granite-embedding, course-summaries]
  ladder: [python, numpy]
  needs: any

- id: build-metadata-filters
  title: "Filters and vector databases"
  level: basis
  domein: bouwen
  module: rag
  idea: "Every chunk carries metadata (its language, its lesson, its level), and a filter searches only among the chunks that fit; a vector database keeps vectors, metadata and index together."
  covers: [retrieval-techniek#3]
  requires: [build-vector-index]
  introduces: [c:metadata-filter, c:vector-database]
  mentions: [c:metadata]
  data: [model-granite-embedding, course-summaries]
  ladder: [python, numpy]
  needs: any

- id: build-hybrid-search
  title: "Words and meaning together"
  level: basis
  domein: bouwen
  module: rag
  idea: "Search by words finds exact names and codes, search by meaning finds the same idea in other words; reciprocal rank fusion merges the two lists by rank, and finds more of the right chunks than either."
  covers: [retrieval-techniek#4]
  requires: [build-retrieval-embeddings]
  introduces: [c:hybrid-search, c:reciprocal-rank-fusion]
  data: [model-granite-embedding, course-summaries]
  ladder: [python, numpy]
  needs: any

- id: build-reranking
  title: "A second look: reranking"
  level: basis
  domein: bouwen
  module: rag
  idea: "Fast search gives the ten best candidates; a reranker reads each of them together with the question and puts them in a better order, slower but more precise."
  covers: [retrieval-techniek#5]
  requires: [build-hybrid-search]
  introduces: [c:reranking]
  data: [model-qwen3-0.6b, course-summaries]
  ladder: [python]
  needs: any

- id: build-query-rewriting
  title: "Ask it differently"
  level: basis
  domein: bouwen
  module: rag
  idea: "A short or vague question finds little; let the model first write an answer to search with (HyDE), several versions of the question, or the question in parts, and search with those."
  covers: [retrieval-techniek#7]
  requires: [build-hybrid-search]
  introduces: [c:query-transformation, c:hyde]
  data: [model-qwen3-0.6b, course-summaries]
  ladder: [python]
  needs: any

- id: build-rag-eval
  title: "Is the RAG right?"
  level: basis
  domein: bouwen
  module: rag
  idea: "A RAG fails in the search or in the answer, so measure both: did the right chunks come back (context recall and precision), and does the answer follow from them and fit the question (faithfulness and answer relevance)."
  covers: [rag-evalueren-en-in-productie#0]
