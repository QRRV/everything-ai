- id: build-workflow-or-agent
  title: "A workflow or an agent?"
  level: basis
  domein: bouwen
  module: agents
  idea: "In a workflow your code fixes the steps and the model fills them in; in an agent the model chooses the steps itself; a workflow is cheaper, faster and easier to test, so use an agent only where the steps cannot be known beforehand."
