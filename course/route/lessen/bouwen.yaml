- id: build-workflow-patterns
  title: "Five workflow patterns"
  level: basis
  domein: bouwen
  module: agents
  idea: "Most workflows are made of five patterns: steps in a row, a router that picks a path, parts in parallel, an orchestrator that hands out work to workers, and an evaluator that sends an answer back until it is good."
  covers: [workflows-en-agentpatronen#1]
