# Lessons of the domain bouwen (building with AI: prompts, RAG and agents), level basis, and the five core lessons
# (domein fundament: modules start, python and agents) that its lessons need.
# The plan: docs/onderzoek/reports/Voorstel domein Bouwen met AI.md (besluit 1.18, advice 6). The route bouwen in routes.yaml
# starts where the core ends and gives the order. Every lesson runs on a CPU: the model is Qwen3-0.6B on the course's own
# server, and the checks talk to a stand-in with the same API.
# Planning data; "introduces" is the plan and "uses" is filled in fully when a lesson is built. Format: ../FORMAT.md.
map: v2.3
lessons:

# --- the core: AI tools, prompts, JSON and agents -------------------------------
- id: start-ai-tools-landscape
  title: "Which AI tool for what"
  level: basis
  domein: fundament
  module: start
  idea: "AI tools come in kinds (chat assistants, tools inside other programs, models you run yourself); an assistant can search, read files and run code, reads at most its context window, and everything you paste into it leaves your computer."
  covers: [ai-geletterdheid-voor-gebruikers#1, ai-geletterdheid-voor-gebruikers#2, ai-geletterdheid-voor-gebruikers#3, ai-geletterdheid-voor-gebruikers#6]
  requires: [start-using-ai-tools]
  introduces: [c:context-window, c:open-weights, p:privacy-hygiene]
  uses: [p:verify-ai-output, c:ai-assistant, q:choice, q:predict]
  mentions: [c:program, c:model, c:language-model, c:token]
  warns: [window]
  data: []
  needs: any

- id: start-prompt-basics
  title: "Asking well: roles, examples and steps"
  level: basis
  domein: fundament
  module: start
  idea: "A prompt has parts (instruction, context, examples, the form of the answer) in messages with a role; examples (few-shot), a role and asking for the steps first (chain of thought) each change what a model answers, as the same question asked seven ways shows."
  covers: [prompt-basis#0, prompt-basis#1, prompt-basis#2]
  requires: [start-ai-tools-landscape]
  introduces: [c:prompt, c:message-role, c:delimiter, c:few-shot-prompting, c:zero-shot-prompting, c:role-prompting, c:chain-of-thought]
  mentions: [c:example, c:model, c:chat-model]
  warns: [role]
  uses: [c:context-window, p:privacy-hygiene, c:ai-assistant, p:verify-ai-output, q:predict, q:choice, q:exercise-with-check]
  data: [model-qwen3-0.6b, course-prompts-qwen]
  needs: any

- id: start-prompt-chains
  title: "Prompts that check themselves"
  level: basis
  domein: fundament
  module: start
  idea: "A big task goes better in small prompts in a row (prompt chaining); a model can check and improve its own answer (Self-Refine, Chain-of-Verification); and an answer from a source you give, with the source named, can be checked."
  covers: [prompt-basis#3, prompt-basis#4, prompt-basis#5, prompt-basis#6]
  requires: [start-prompt-basics]
  introduces: [c:prompt-chaining, c:self-refine, c:chain-of-verification, c:grounding, c:citation, c:multimodal-prompt]
  mentions: [c:model]
  uses: [c:prompt, c:message-role, c:delimiter, c:few-shot-prompting, c:chain-of-thought, c:ai-assistant, p:verify-ai-output, q:predict, q:choice, q:exercise-with-check]
  data: [model-qwen3-0.6b, course-chains-qwen, course-prompts-qwen]
  needs: any

- id: py-json
  title: "Data as text: JSON"
  level: basis
  domein: fundament
  module: python
  idea: "JSON writes lists, dicts, strings, numbers, True, False and None as text that every language can read; json.dumps turns them into text and json.loads back, and text that is not valid JSON raises an error."
  covers: []
  requires: [py-dicts, py-files, py-errors, py-imports]
  introduces: [c:json, py:json]
  uses: [py:import, c:module, py:dict, py:list, py:indexing, py:open, py:with, c:file-path, c:newline, py:def, py:return, py:for, py:arithmetic, py:comparison, py:bool, py:none, py:str, py:string-literal, py:int, py:float, py:print, py:comment, py:underscore-name, py:variable, q:predict, q:choice, q:exercise-with-check, q:run-cell]
  data: []
  ladder: [python]
  needs: any

- id: agent-idea
  title: "What an agent is: a model, tools and a loop"
  level: basis
  domein: fundament
  module: agents
  idea: "An agent is a language model with tools in a loop towards a goal: it chooses a tool, sees the result and chooses again until it is done; from a chatbot to an agent that works on its own is a spectrum, and the agent of reinforcement learning is the same idea with a learned policy."
  covers: [wat-een-agent-is#0, wat-een-agent-is#1, wat-een-agent-is#2, wat-een-agent-is#3, wat-een-agent-is#4]
  requires: [rl-what-is-rl, start-prompt-chains, py-json]
  introduces: [c:llm-agent, c:tool, c:tool-call, c:agent-loop, c:step-limit, c:autonomy-spectrum]
  mentions: [c:model, c:language-model]
  warns: [agent, tool]
  uses: [c:agent, c:environment, c:action, c:reward, c:return, c:policy, c:prompt, c:message-role, c:prompt-chaining, c:self-refine, c:json, py:json, py:def, py:return, py:for, py:range, py:if, py:comparison, py:list, py:append, py:dict, py:indexing, py:print, py:comment, py:underscore-name, py:variable, py:string-literal, q:predict, q:choice, q:exercise-with-check, q:run-cell]
  data: [model-qwen3-0.6b, course-agent-qwen]
  ladder: [python]
  needs: any

# --- bouwen/werk: AI in your work ------------------------------------------------
- id: build-ai-at-work
  title: "AI at work: centaur or cyborg"
  level: basis
  domein: bouwen
  module: werk
  idea: "People who work with AI either hand it whole tasks and check them (centaur) or weave it through every step (cyborg); both only help inside the jagged frontier, as the study of Dell'Acqua and others (2023) measured."
  covers: [d17-ai-in-dagelijks-werk#0, d17-ai-in-dagelijks-werk#1]
  requires: [start-prompt-chains]
  introduces: [c:centaur-work, c:cyborg-work]
  data: []
  needs: any

- id: build-research-and-learn
  title: "Searching, deep research and learning with AI"
  level: basis
  domein: bouwen
  module: werk
  idea: "An assistant that searches gives sources you can check, and deep research reads dozens of them for one report; to learn, ask it to question you and explain step by step instead of handing you the answer."
  covers: [d17-ai-in-dagelijks-werk#2, d17-ai-in-dagelijks-werk#3]
  requires: [build-ai-at-work, start-your-own-assistant]
  introduces: [c:deep-research, p:learn-by-being-questioned]
  data: []
  needs: any

- id: build-make-without-code
  title: "Making things without code"
  level: basis
  domein: bouwen
  module: werk
  idea: "Creative tools make pictures, music and text from a description, and vibe coding makes a small program from one; both are fast for a first version and break where nobody reads what was made."
  covers: [d17-ai-in-dagelijks-werk#4, d17-ai-in-dagelijks-werk#5]
  requires: [build-ai-at-work]
  introduces: [c:vibe-coding]
  mentions: [c:program]
  data: []
  needs: any

- id: build-automate-work
  title: "Automating work: flows, personal agents and process mining"
  level: basis
  domein: bouwen
  module: werk
  idea: "No-code tools and personal agents chain steps of work without programming; before you automate a process, process mining shows from an event log how the work really goes: count which step follows which."
  covers: [d17-ai-in-dagelijks-werk#6, d17-ai-in-dagelijks-werk#7]
  requires: [build-ai-at-work, data-groupby]
  introduces: [c:no-code-automation, c:personal-agent, c:robotic-process-automation, c:process-mining, c:event-log, c:directly-follows-graph]
  data: []
  ladder: [python]
  needs: any

- id: build-coding-help
  title: "From autocomplete to agents: help with code"
  level: basis
  domein: bouwen
  module: werk
  idea: "AI helps with code in three ways, from completing the line you type, through a chat about your code, to an agent that changes files and runs them; which one fits depends on how much you check, and a tool is set up with what it may read and do."
  covers: [ai-ondersteund-programmeren#1, ai-ondersteund-programmeren#2]
  requires: [build-ai-at-work, start-your-own-assistant]
  introduces: [c:code-completion, c:coding-agent]
  data: []
  needs: any

- id: build-coding-workflow
  title: "Working with a coding agent: plan, spec and context"
  level: basis
  domein: bouwen
  module: werk
  idea: "A coding agent works best in a fixed rhythm: first a spec of what should happen, then a plan, then small steps you check; what it knows of your project comes from the context you give it, such as AGENTS.md."
  covers: [ai-ondersteund-programmeren#3, ai-ondersteund-programmeren#4, ai-ondersteund-programmeren#5]
  requires: [build-coding-help]
  introduces: [c:spec-driven-coding, p:plan-then-code]
  data: []
  needs: any

- id: build-ai-explains-code
  title: "Let AI explain code, and do the chores"
  level: basis
  domein: bouwen
  module: werk
  idea: "AI can explain code you did not write and summarize what it does, and take the chores off your hands (renaming, docstrings, a first test); you still check what it says against the code itself."
  covers: [ai-ondersteund-programmeren#6, ai-ondersteund-programmeren#7]
  requires: [build-coding-help, py-functions]
  introduces: [p:code-to-language]
  data: []
  ladder: [python]
  needs: any

- id: build-check-ai-code
  title: "Checking code that AI wrote"
  level: basis
  domein: bouwen
  module: werk
  idea: "Code from AI looks right more often than it is: tests with assert, a review and static analysis find its mistakes; a randomized trial found developers with Copilot faster (Peng and others 2023), and another found much generated code insecure (Pearce and others 2022)."
  covers: [d17-ai-code-kwaliteit-en-teampraktijk#0, d17-ai-code-kwaliteit-en-teampraktijk#1]
  requires: [build-coding-workflow, py-errors]
  introduces: [c:unit-test, py:assert, c:code-review, c:static-analysis, c:randomized-controlled-trial]
  data: []
  ladder: [python]
  needs: any

# --- bouwen/apis: calling models -------------------------------------------------
- id: build-tokens-prices
  title: "Tokens and prices: count before you send"
  level: basis
  domein: bouwen
  module: apis
  idea: "An API charges per token, with output tokens dearer than input tokens; count the tokens of a prompt and its answer with the model's own tokenizer, and you know what a call costs before you make it."
  covers: [model-api-s#1]
  requires: [lm-tokens-outside, start-prompt-basics]
  introduces: [c:input-token, c:output-token, c:token-price]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: build-call-api
  title: "Calling a model over HTTP"
  level: basis
  domein: bouwen
  module: apis
  idea: "A model behind an API is a URL you send a request to: the conversation as JSON, the answer as JSON back; the course's own server speaks the same OpenAI-compatible protocol as hosted APIs, Ollama and llama.cpp, so the same few lines of urllib work with all of them."
  covers: [model-api-s#0]
  requires: [build-tokens-prices, lm-base-vs-chat, py-json]
  introduces: [c:api, c:endpoint, c:http-request, c:openai-compatible-api, c:local-server, py:urllib-request]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: build-project-call
  title: "Project: your assistant answers"
  level: basis
  domein: bouwen
  module: apis
  kind: project
  project: app
  idea: "Your project app gets its first module: a function that sends a conversation to the API and gives back the answer and the tokens it cost, so every later step of the project talks to the model through it."
  covers: []
  requires: [build-call-api, py-own-modules]
  introduces: [c:api-client]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: build-streaming
  title: "The answer as it comes: streaming"
  level: basis
  domein: bouwen
  module: apis
  idea: "With stream on, the server sends the answer in small pieces as server-sent events, each a line of JSON; you show the first words after a moment instead of waiting for the whole answer."
  covers: [model-api-s#2]
  requires: [build-call-api]
  introduces: [c:streaming, c:server-sent-events]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: build-errors-retries
  title: "When a call fails: errors, limits and retries"
  level: basis
  domein: bouwen
  module: apis
  idea: "A call can fail: a status code says why (a bad request, too many requests, a server error), and a timeout stops waiting; try again only what can succeed later, each time waiting longer (exponential backoff)."
  covers: [model-api-s#3]
  requires: [build-call-api, py-errors]
  introduces: [c:http-status-code, c:rate-limit, c:timeout, c:retry, c:exponential-backoff]
  data: []
  ladder: [python]
  needs: any

- id: build-batch-keys-costs
  title: "Batches, keys and the bill"
  level: basis
  domein: bouwen
  module: apis
  idea: "Many requests that may wait go cheaper as one batch; a key that gives access to a paid API belongs in an environment variable, never in your code; and counting tokens per call keeps the bill in sight."
  covers: [model-api-s#4, model-api-s#5]
  requires: [build-errors-retries]
  introduces: [c:batch-api, c:api-key, c:environment-variable, py:os-environ]
  warns: [key]
  data: []
  ladder: [python]
  needs: any

- id: build-choose-model
  title: "Choosing a model, and routing between models"
  level: basis
  domein: bouwen
  module: apis
  idea: "A model is chosen on quality for your task, speed and price, measured on your own examples; a router sends easy questions to a small model and hard ones to a large one, and a gateway puts many models behind one address."
  covers: [modelkeuze-routing-en-open-weights#0, modelkeuze-routing-en-open-weights#1]
  requires: [build-call-api]
  introduces: [c:model-routing, c:model-gateway]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: build-where-models-run
  title: "Where a model runs"
  level: basis
  domein: bouwen
  module: apis
  idea: "An open-weight model runs on your own computer in a local runtime such as Ollama or llama.cpp, or at a company that hosts it for you; the API stays the same, only the address changes."
  covers: [modelkeuze-routing-en-open-weights#3, modelkeuze-routing-en-open-weights#4, modelkeuze-routing-en-open-weights#5]
  requires: [build-choose-model]
  introduces: [c:local-runtime, c:hosted-inference]
  data: []
  ladder: [python]
  needs: any

- id: build-multimodal-apis
  title: "Beyond text: images, audio and realtime"
  level: basis
  domein: bouwen
  module: apis
  idea: "The same messages can carry images and audio, a realtime API talks in both directions as you speak, and some tools (web search, running code) run at the provider instead of in your program."
  covers: [multimodale-realtime-en-overige-api-s#0, multimodale-realtime-en-overige-api-s#3]
  requires: [build-call-api]
  introduces: [c:multimodal-api, c:realtime-api, c:hosted-tool]
  data: []
  needs: any

- id: build-embeddings-api
  title: "Embeddings and documents through an API"
  level: basis
  domein: bouwen
  module: apis
  idea: "An embeddings endpoint turns a text into a vector, so texts with the same meaning lie close together, also across languages; files and documents go along with a request as text or as an upload."
  covers: [multimodale-realtime-en-overige-api-s#1, multimodale-realtime-en-overige-api-s#2]
  requires: [build-call-api, ml-embeddings-idea]
  introduces: [c:embeddings-api, c:file-upload]
  data: [model-granite-embedding]
  ladder: [python, numpy]
  needs: any

- id: build-ai-services
  title: "Ready-made AI: vision, speech, translation and classic NLP"
  level: basis
  domein: bouwen
  module: apis
  idea: "For seeing, listening and translating there are ready-made services behind an API, and the classic tasks of language (sentiment, entities, summaries) can go to such a service or to an LLM with a prompt."
  covers: [klassieke-ai-diensten-via-api-s#0, klassieke-ai-diensten-via-api-s#1]
  requires: [build-call-api]
  introduces: [c:ai-service, c:classic-nlp-task]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: build-generation-hubs
  title: "Images from an API, and model hubs"
  level: basis
  domein: bouwen
  module: apis
  idea: "Image and video generation is one request with a description; a model hub holds thousands of open models with their cards, and a pipeline wraps one into a single call."
  covers: [klassieke-ai-diensten-via-api-s#2, klassieke-ai-diensten-via-api-s#3]
  requires: [build-ai-services, torch-pretrained]
  introduces: [c:image-generation-api]
  warns: [pipeline]
  data: []
  needs: any

- id: build-llm-or-small-model
  title: "A large model or a small one?"
  level: basis
  domein: bouwen
  module: apis
  idea: "For one fixed task, such as sorting messages, a small model trained on a few hundred examples can beat an LLM with a prompt in quality, speed and price; the LLM wins when there are no labels or the task keeps changing."
  covers: [klassieke-ai-diensten-via-api-s#4]
  requires: [build-ai-services, ml-sklearn, ml-f1-score]
  introduces: [c:task-specific-model]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: build-on-device
  title: "AI on your own device"
  level: basis
  domein: bouwen
  module: apis
  idea: "A model in the browser or on a phone works without a network, costs nothing per call and keeps data on the device, but it must be small; libraries such as TensorFlow.js and Pyodide run models and Python in the browser."
  covers: [browser-en-on-device-ai#0, browser-en-on-device-ai#7]
  requires: [build-where-models-run]
  introduces: [c:on-device-ai]
  warns: [device]
  data: []
  needs: any

- id: build-js-basics
  title: "Just enough JavaScript"
  level: basis
  domein: bouwen
  module: apis
  idea: "AI in the browser is written in JavaScript: a module imports another, await waits for a result while the page keeps responding, and a web worker computes beside the page; just enough to read and change the code of the next lesson."
  covers: [browser-en-on-device-ai#1]
  requires: [build-on-device, py-functions]
  introduces: [c:javascript, c:await, c:web-worker]
  data: []
  needs: any

- id: build-model-in-browser
  title: "Your model in the browser"
  level: basis
  domein: bouwen
  module: apis
  idea: "A small network you trained earlier in the course goes to the browser as JSON and computes there, in a few lines of JavaScript; Transformers.js and WebLLM do the same with large open models, and the Prompt API of Chrome with one built into the browser."
  covers: [browser-en-on-device-ai#2, browser-en-on-device-ai#4, browser-en-on-device-ai#5]
  requires: [build-js-basics, torch-mlp-digits, py-json]
  introduces: [c:transformers-js, c:webllm, c:built-in-browser-ai]
  mentions: [c:transformer]
  data: [qmnist]
  ladder: [python, torch]
  needs: any

# --- bouwen/prompts: prompts for developers -----------------------------------
- id: build-sampling-api
