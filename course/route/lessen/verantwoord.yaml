- id: rai-two-kinds-of-harm
  title: "Two kinds of harm"
  level: basis
  domein: verantwoord
  module: ethiek
  idea: "A model can harm people by what it hands out (a loan, a job: allocative harm) and by how it shows them (stereotypes, being left out: representational harm); you measure the first per group, and you have to look for the second."
  covers: [waarom-ai-ethiek#1]
  requires: [rai-bias-in-data]
  introduces: [c:allocative-harm, c:representational-harm, c:fairness]
