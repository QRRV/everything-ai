- id: rai-specification-gaming
  title: "Doing what you said, not what you meant"
  level: basis
  domein: verantwoord
  module: veiligheid
  idea: "An agent rewarded for points in a boat race learned to circle and collect them instead of finishing; give a Q-learning agent a reward that almost says what you want, and it finds the gap."
