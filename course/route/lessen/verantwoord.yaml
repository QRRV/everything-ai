  level: basis
  domein: verantwoord
  module: veiligheid
  idea: "One way to sort the risks of AI is accidents, misuse and structural risks; the International AI Safety Report sorts them into malicious use, malfunctions (losing control among them) and systemic risks. A taxonomy makes sure nothing is forgotten."
