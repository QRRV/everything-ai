- id: rai-dual-use-and-frameworks
  title: "AI as a weapon, and the rules against it"
  level: basis
  domein: verantwoord
  module: security
  idea: "The same model that helps defenders helps attackers write phishing and malware (dual use); frameworks such as Google's SAIF, the guidelines of the UK's NCSC and the US CISA, and ETSI EN 304 223 say what secure AI development asks of you."
