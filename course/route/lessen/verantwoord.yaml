- id: rai-reliability
  title: "Robust, resilient, available, predictable"
  level: basis
  domein: verantwoord
  module: veiligheid
  idea: "A reliable system keeps working when the input is a little off (robustness), recovers after a failure (resilience), is there when needed (availability) and behaves the same each time (predictability); add noise to digits and watch the accuracy fall."
  covers: [robuustheid-betrouwbaarheid-en-assurance#0]
