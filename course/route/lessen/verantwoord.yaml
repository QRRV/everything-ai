  needs: any

- id: rai-drift-and-tails
  title: "Drifting into failure, and black swans"
  level: basis
  domein: verantwoord
  module: veiligheid
  idea: "Systems fail slowly, by many small departures from the rules that each look normal, and through rare events that are bigger than anything before; with heavy tails, the past maximum says little about the next."
