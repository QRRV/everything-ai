  level: basis
  domein: verantwoord
  module: fairness
  idea: "Treating someone worse because of a protected ground is direct discrimination; a neutral rule that hits one group much harder is indirect discrimination, unless there is a good reason. In the Netherlands the AWGB forbids both, and the Netherlands Institute for Human Rights judges complaints."
