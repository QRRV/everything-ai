  needs: any

- id: rai-pickle-safetensors
  title: "A model file that runs code"
  level: basis
  domein: verantwoord
  module: security
  idea: "A pickle file can run any code while it is loaded, so a model file from a stranger can take over your computer; safetensors stores only numbers; the course downloads outside models as safetensors, and loads its own files with weights_only."
