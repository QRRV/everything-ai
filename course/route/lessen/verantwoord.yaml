- id: rai-goodhart
  title: "When a measure becomes a target"
  level: basis
  domein: verantwoord
  module: veiligheid
  idea: "Goodhart's law: optimize a measure hard and it stops measuring what you wanted. Choose the best of many options by a noisy score and the winner is mostly lucky; the harder you select, the larger the gap."
  covers: [specification-gaming-en-reward-hacking#1]
  requires: [rai-specification-gaming, np-random]
  introduces: [c:goodharts-law, c:proxy-gaming]
