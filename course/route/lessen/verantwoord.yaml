  level: basis
  domein: verantwoord
  module: veiligheid
  idea: "The argument goes that intelligence and goals are independent (the paperclip maximizer), that almost any goal is served by more power, and that humans could slowly lose their say; Carlsmith, Christiano and AI 2027 work these out into scenarios."
