  mentions: [c:random-forest, c:permutation-importance, c:partial-dependence-plot, c:lime]
  data: []
  ladder: [python]
  needs: any

- id: rai-reason-codes
  title: "Reasons for a decision"
  level: basis
  domein: verantwoord
  module: uitleggen
  idea: "A refused loan comes with reason codes, the features that weighed most against you; people want a contrastive, short explanation (why this and not that), and the GDPR gives a right to meaningful information about the logic."
  covers: [xai-begrippen-en-het-recht-op-uitleg#1, xai-begrippen-en-het-recht-op-uitleg#2]
  requires: [rai-kinds-of-explanation]
  introduces: [c:reason-code, c:contrastive-explanation, c:right-to-explanation]
  mentions: [c:gdpr, c:personal-data]
  data: [uci-adult]
  ladder: [python, numpy]
  needs: any

- id: rai-glass-box-models
  title: "Glass-box models"
  level: basis
  domein: verantwoord
  module: uitleggen
  idea: "A linear model shows its reasoning in its weights and a small tree in its splits; you can follow every prediction by hand, as long as the features mean something and the model stays small."
  covers: [glass-box-modellen#0]
  requires: [rai-kinds-of-explanation]
  introduces: [c:glass-box-model]
  mentions: [c:false-positive-rate, c:generalized-additive-model, c:white-box]
  data: [uci-adult]
  ladder: [python, numpy]
  needs: any

- id: rai-additive-models
  title: "Additive models"
  level: basis
  domein: verantwoord
  module: uitleggen
  idea: "A generalized additive model adds one curve per feature; it fits bends a line cannot and stays readable, and Explainable Boosting Machines learn those curves with boosting."
  covers: [glass-box-modellen#1]
  requires: [rai-glass-box-models, ml-gradient-boosting]
  introduces: [c:generalized-additive-model, c:explainable-boosting-machine]
  mentions: [c:risk-score]
  data: [uci-adult]
  ladder: [python, numpy]
  needs: any

- id: rai-rashomon
  title: "Many good models"
  level: basis
  domein: verantwoord
  module: uitleggen
  idea: "Train the same kind of model on slightly different data and you get models that are equally accurate but disagree about many people (the Rashomon effect); Rudin argues that for high-stakes decisions you should then pick a model you can read."
  covers: [glass-box-modellen#4]
  requires: [rai-glass-box-models, ml-random-forest]
  introduces: [c:rashomon-effect]
  data: [uci-adult]
  ladder: [python, numpy]
  needs: any

- id: rai-permutation-importance
  title: "Which features matter?"
  level: basis
  domein: verantwoord
  module: uitleggen
  idea: "Shuffle one column and see how much worse the model gets: permutation importance. Impurity importance from a forest is free but favors features with many values, and leaving a feature out asks a different question."
  covers: [evaluatie-en-modelselectie#9, d24-globale-model-agnostische-methoden#0]
  requires: [rai-kinds-of-explanation, ml-random-forest]
  introduces: [c:permutation-importance, c:feature-importance]
  data: [uci-adult]
  ladder: [python, numpy]
  needs: any

- id: rai-pdp-ice
  title: "How a prediction moves with a feature"
  level: basis
  domein: verantwoord
  module: uitleggen
  idea: "Change one feature for every row and average the predictions: a partial dependence plot. Drawing one line per row instead (ICE) shows where people react differently from the average."
  covers: [d24-globale-model-agnostische-methoden#1, model-agnostische-post-hoc-methoden#4]
  requires: [rai-permutation-importance]
  introduces: [c:partial-dependence-plot, c:ice-curve]
  data: [uci-adult]
  ladder: [python, numpy]
  needs: any

- id: rai-global-surrogate
  title: "A small model that copies a big one"
  level: basis
  domein: verantwoord
  module: uitleggen
  idea: "Train a small tree on the predictions of a complex model: a global surrogate. Its fidelity, how often it agrees with the big model, tells you how far you can trust it as an explanation."
  covers: [d24-globale-model-agnostische-methoden#5]
  requires: [rai-pdp-ice, ml-decision-tree]
  introduces: [c:surrogate-model, c:fidelity]
  warns: [competing objectives]
  data: [uci-adult]
  ladder: [python, numpy]
  needs: any

- id: rai-lime
  title: "LIME: a simple model around one prediction"
  level: basis
  domein: verantwoord
  module: uitleggen
  idea: "To explain one prediction, LIME makes variations of the example, asks the model about them, and fits a small weighted linear model nearby; its weights are the explanation, and they change with the choices you make."
  covers: [model-agnostische-post-hoc-methoden#0]
  requires: [rai-global-surrogate]
  introduces: [c:lime]
  mentions: [c:normal-distribution]
  data: [uci-adult]
  ladder: [python, numpy]
  needs: any

- id: rai-shapley-values
  title: "Shapley values"
  level: basis
  domein: verantwoord
  module: uitleggen
  idea: "A Shapley value shares a prediction fairly among the features: the average contribution of a feature over all orders in which you add them. With four features you can compute them exactly, and they add up to the prediction minus the average prediction."
  covers: [model-agnostische-post-hoc-methoden#1]
  requires: [rai-lime]
  introduces: [c:shapley-value, c:shap]
  data: [uci-adult]
  ladder: [python, numpy]
  needs: any

- id: rai-xai-tools
  title: "Tools for explanations"
  level: basis
  domein: verantwoord
  module: uitleggen
  idea: "SHAP, InterpretML and DiCE do what you built by hand at scale; the lesson shows their calls next to your own code (shown, not run), and which choices (background data, samples) change the answer."
  covers: [xai-tooling#0]
  requires: [rai-shapley-values]
  introduces: [c:kernelshap, c:interpretml]
  data: [uci-adult]
  ladder: [python, numpy]
  needs: any

- id: rai-counterfactuals
  title: "What would have to change?"
  level: basis
  domein: verantwoord
  module: uitleggen
  idea: "A counterfactual explanation says the smallest change that would flip the decision (with five more hours of work a week, yes); it is easy to understand, but there are many, and some ask for changes nobody can make."
  covers: [d24-counterfactuals-voorbeelden-en-recourse#0]
  requires: [rai-reason-codes, rai-shapley-values]
  introduces: [c:counterfactual-explanation, c:algorithmic-recourse]
  data: [uci-adult]
  ladder: [python, numpy]
  needs: any

- id: rai-project-audit-explain
  title: "Project: explain your classifier"
  level: basis
  domein: verantwoord
  module: uitleggen
  kind: project
  project: audit
  idea: "The second step of your audit: explain the classifier of step one with permutation importance, a partial dependence plot, Shapley values for one person and a counterfactual, and write down what the explanations show about the bias you measured."
  covers: []
  requires: [rai-project-audit-bias, rai-counterfactuals, rai-xai-tools]
  introduces: [c:audit-report]
  data: [uci-adult]
  ladder: [python, numpy]
  needs: any

- id: rai-llm-self-explanations
  title: "Can a model explain itself?"
  level: basis
  domein: verantwoord
  module: uitleggen
  idea: "Ask a language model why it answered and you get a fluent reason, but it need not be the real one: give it a hint that changes its answer, and its explanation often does not mention the hint."
  covers: [uitlegbaarheid-voor-llms#0]
  requires: [rai-kinds-of-explanation, start-prompt-basics, lm-what-is-a-language-model]
  introduces: [c:self-explanation]
  mentions: [c:faithfulness]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: rai-source-attribution
  title: "Which source did the answer come from?"
  level: basis
  domein: verantwoord
  module: uitleggen
  idea: "An answer that cites a source is easier to check, but the citation can be wrong; leave one source out and see whether the answer changes, to test which source it really used."
  covers: [uitlegbaarheid-voor-llms#1]
  requires: [rai-llm-self-explanations, start-prompt-chains]
  introduces: [c:source-attribution]
