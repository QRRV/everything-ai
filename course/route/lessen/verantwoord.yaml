  needs: any

- id: rai-risk-decomposition
  title: "Risk as chance times harm"
  level: basis
  domein: verantwoord
  module: veiligheid
  idea: "Risk is the chance of an event times the harm it does, summed over what can happen; the disaster equation splits it into hazard, exposure and vulnerability, and each part is a place to reduce it."
  covers: [d25-safety-engineering#0, d25-safety-engineering#1]
  requires: [rai-reliability, prob-expectation]
  introduces: [c:disaster-risk-equation]
  data: []
  ladder: [python]
  needs: any

- id: rai-nines
  title: "Nines of reliability"
  level: basis
  domein: verantwoord
  module: veiligheid
  idea: "99% sounds safe, but at a million requests a day it is 10,000 failures; each extra nine is ten times fewer, and a chain of steps is only as reliable as their product."
  covers: [d25-safety-engineering#2]
  requires: [rai-risk-decomposition, prob-basics]
  introduces: [c:nines-of-reliability]
  data: []
  ladder: [python]
  needs: any

- id: rai-safe-design-principles
  title: "Designing for safety"
  level: basis
  domein: verantwoord
  module: veiligheid
  idea: "Redundancy, separation of duties, least privilege, fail-safes and negative feedback are old principles from engineering that apply to AI systems as they are."
  covers: [d25-safety-engineering#3]
  requires: [rai-nines]
  introduces: [c:fail-safe, c:redundancy, c:separation-of-duties]
