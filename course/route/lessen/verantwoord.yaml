  needs: any

- id: rai-swiss-cheese
  title: "Safeguards in a row"
  level: basis
  domein: verantwoord
  module: veiligheid
  idea: "Each safeguard has holes; an accident happens when the holes of all safeguards line up (the Swiss cheese model). With independent safeguards the chances multiply, and a fault tree adds them up along AND and OR."
