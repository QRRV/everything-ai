- id: rai-hub-integrity
  title: "Is this the model you meant?"
  level: basis
  domein: verantwoord
  module: security
  idea: "A model or dataset on a hub can be replaced or poisoned; a pinned revision and a SHA-256 hash make sure you get exactly the file that was checked, as the course does for every download."
  covers: [supply-chain-en-agent-security#1]
  requires: [rai-pickle-safetensors, torch-pretrained]
  introduces: [c:supply-chain-attack, c:hash-pinning]
  mentions: [c:hash]
  data: []
