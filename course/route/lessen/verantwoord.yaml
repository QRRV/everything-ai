- id: rai-kinds-of-explanation
  title: "Kinds of explanation"
  level: basis
  domein: verantwoord
  module: uitleggen
  idea: "An explanation can come from the model itself or be made afterwards, cover one prediction or the whole model, and work for one kind of model or any; some models stay opaque, by secrecy, by skill or by their size."
  covers: [xai-begrippen-en-het-recht-op-uitleg#0, xai-begrippen-en-het-recht-op-uitleg#3]
  requires: [ml-decision-tree, ml-logistic-regression]
