  needs: any

- id: rai-package-squatting
  title: "Packages that are not what they seem"
  level: basis
  domein: verantwoord
  module: security
  idea: "An attacker registers a package with a name close to a popular one, or one that language models tend to invent; check a name before you install it, and ask a model for package names and count how many did not exist on PyPI when the course recorded it."
