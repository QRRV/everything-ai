# --- privacy: privacy -----------------------------------------------------------------------------------------------
- id: rai-what-is-privacy
  title: "What is privacy?"
  level: basis
  domein: verantwoord
  module: privacy
  idea: "Privacy has meant being left alone, controlling information about yourself, and protection against a list of harms (Solove); people say they care about it and give it away anyway, the privacy paradox."
  covers: [privacybegrippen-en-de-avg#0]
  requires: [data-provenance, rai-bias-in-data]
  introduces: [c:privacy]
  data: []
  ladder: [python]
  needs: any

- id: rai-gdpr
  title: "The GDPR for AI"
  level: basis
  domein: verantwoord
  module: privacy
  idea: "Under the GDPR you need a legal ground to process personal data, people have rights (access, correction, objection), and who decides why data is processed (the controller) carries the responsibility, also when a model is trained."
  covers: [privacybegrippen-en-de-avg#2, privacybegrippen-en-de-avg#3]
  requires: [rai-what-is-privacy]
  introduces: [c:gdpr, c:data-controller, c:personal-data, c:data-subject, c:lawful-basis, c:purpose-limitation, c:right-to-erasure]
  data: []
  ladder: [python]
  needs: any

- id: rai-contextual-integrity
  title: "Information in the wrong place"
  level: basis
  domein: verantwoord
  module: privacy
  idea: "Contextual integrity says that information may flow where the rules of its context allow it; a language model can guess where someone lives or how old they are from a few posts, and an agent can pass on what was told in confidence."
  covers: [privacybegrippen-en-de-avg#1, privacy-in-llm-producten-en-privacy-engineering#0]
  requires: [rai-what-is-privacy, start-prompt-basics, lm-what-is-a-language-model]
  introduces: [c:contextual-integrity, c:attribute-inference]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: rai-pseudonymization
  title: "Pseudonymous is not anonymous"
  level: basis
  domein: verantwoord
  module: privacy
  idea: "Replacing a name with a code is pseudonymization: the data is still personal data, because records can be linked and a person singled out; anonymous means nobody can be found again by anyone."
  covers: [anonimisering-en-heridentificatie#0]
  requires: [rai-gdpr, py-dicts]
  introduces: [c:pseudonymization, c:anonymization, c:re-identification]
  data: []
  ladder: [python]
  needs: any

- id: rai-k-anonymity
  title: "Hiding in a group: k-anonymity"
  level: basis
  domein: verantwoord
  module: privacy
  idea: "A table is k-anonymous when every combination of age, place and other quasi-identifiers occurs at least k times; you get there by coarsening values, and l-diversity adds that a group must not all share the same secret."
  covers: [anonimisering-en-heridentificatie#1]
  requires: [rai-pseudonymization, data-groupby]
  introduces: [c:k-anonymity, c:quasi-identifier, c:l-diversity]
  data: [uci-adult]
  ladder: [python, numpy]
  needs: any

- id: rai-linkage-attacks
  title: "Linking tables"
  level: basis
  domein: verantwoord
  module: privacy
  idea: "Join an anonymous table with a public one on birth date, ZIP code and sex, and many rows get their name back; that is how a governor's medical records were found in 1997."
  covers: [anonimisering-en-heridentificatie#2]
  requires: [rai-k-anonymity, data-merge]
  introduces: [c:linkage-attack]
  data: []
  ladder: [python]
  needs: any

- id: rai-randomized-response
  title: "Answering with a coin"
  level: basis
  domein: verantwoord
  module: privacy
  idea: "Let each person flip a coin before answering a sensitive question: nobody's answer gives them away, yet the group's rate can still be estimated. That is local differential privacy, and the coin sets how much privacy you get."
  covers: [differential-privacy#0]
  requires: [rai-linkage-attacks, prob-basics, np-random]
  introduces: [c:randomized-response, c:local-differential-privacy]
  data: []
  ladder: [python, numpy]
  needs: any

- id: rai-federated-learning
  title: "Training without collecting the data"
  level: basis
  domein: verantwoord
  module: privacy
  idea: "In federated learning each device trains on its own data and only sends its weights; the server averages them (FedAvg). When every device holds different digits, the average learns more slowly."
  covers: [federated-learning-en-pets#0]
  requires: [rai-what-is-privacy, torch-mlp-digits]
  introduces: [c:federated-learning, c:fedavg]
  data: [qmnist]
  ladder: [python, numpy, torch]
  needs: any

- id: rai-secret-sharing
  title: "Computing on secrets"
  level: basis
  domein: verantwoord
  module: privacy
  idea: "Split a number into random shares that add up to it, and several parties can compute a sum without anyone seeing another's number: secure multiparty computation. Homomorphic encryption and zero-knowledge proofs do related things with cryptography."
  covers: [federated-learning-en-pets#3]
  requires: [rai-federated-learning]
  introduces: [c:privacy-enhancing-technology, c:secure-multi-party-computation]
  data: []
  ladder: [python]
  needs: any

- id: rai-memorization
  title: "What a model remembers"
  level: basis
  domein: verantwoord
  module: privacy
  idea: "A language model can repeat pieces of its training data word for word, especially text it saw many times; give it the start of a well-known text and count how much it completes exactly."
  covers: [memorisatie-inference-aanvallen-en-unlearning#0]
  requires: [rai-what-is-privacy, lm-sampling, start-prompt-basics]
  introduces: [c:memorization, c:training-data-extraction]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: rai-find-pii
  title: "Finding and hiding personal data"
  level: basis
  domein: verantwoord
  module: privacy
  idea: "Before text goes into a model or a training set, a pipeline finds names, phone numbers and citizen service numbers and replaces them; a check digit tells a real number from a random one, and every filter misses something."
  covers: [privacy-in-llm-producten-en-privacy-engineering#1, privacybewuste-dataverwerking#2]
  requires: [rai-pseudonymization, py-strings, ml-pipelines]
  introduces: [c:check-digit]
  mentions: [c:pii-redaction]
  data: []
  ladder: [python]
  needs: any

- id: rai-privacy-by-design
  title: "Privacy by design"
  level: basis
  domein: verantwoord
  module: privacy
  idea: "Collect only what the purpose needs, use it only for that purpose and delete it when it is done; built into a pipeline from the start, these rules prevent leaks that no filter afterwards can."
  covers: [privacy-in-llm-producten-en-privacy-engineering#2, privacybewuste-dataverwerking#1]
  requires: [rai-find-pii]
  introduces: [c:privacy-by-design, c:data-minimization]
  data: []
  ladder: [python]
  needs: any

- id: rai-data-governance
  title: "Who looks after the data?"
  level: basis
  domein: verantwoord
  module: privacy
  idea: "Data governance gives every dataset an owner and a steward, decides who may see what, and keeps a catalog of what exists; without it, nobody can answer a request to delete someone's data."
  covers: [privacybewuste-dataverwerking#0]
  requires: [rai-privacy-by-design]
  introduces: [c:data-governance, c:access-control]
  data: []
  ladder: [python]
  needs: any


# --- security: security ---------------------------------------------------------------------------------------------
- id: rai-security-basics
  title: "Thinking like an attacker"
  level: basis
  domein: verantwoord
  module: security
  idea: "Security protects confidentiality, integrity and availability; STRIDE lists what can go wrong, and an attack tree breaks an attacker's goal into steps, so you can find the cheapest way in."
  covers: [dreigingsmodellering#0]
