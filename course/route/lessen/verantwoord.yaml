  title: "Concrete problems in AI safety"
  level: basis
  domein: verantwoord
  module: veiligheid
  idea: "In 2016 five problems were named that show up in today's systems: side effects, reward hacking, oversight that does not scale, unsafe exploration, and a world that changes; each has a small example you can run."
