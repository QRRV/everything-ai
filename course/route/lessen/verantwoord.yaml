  data: []
  ladder: [python]
  needs: any

- id: rai-classic-vulnerabilities
  title: "Injection and secrets"
  level: basis
  domein: verantwoord
  module: security
  idea: "Put user text straight into an SQL statement and the user can rewrite the statement: SQL injection. The fix is to pass text as data, never as code; the same idea returns with language models."
  covers: [dreigingsmodellering#1]
  requires: [rai-security-basics, py-strings]
  introduces: [c:sql-injection]
  mentions: [c:language-model]
  data: []
  ladder: [python]
  needs: any

- id: rai-ml-threat-models
  title: "Attacks on machine learning"
  level: basis
  domein: verantwoord
  module: security
  idea: "An attacker on a model may know everything about it or only see its answers, and may want to fool it (evasion), spoil its training (poisoning), learn its data (privacy) or use it to attack others; NIST sorts the attacks that way."
  covers: [dreigingsmodellering#2, dreigingsmodellering#3]
  requires: [rai-security-basics, ml-workflow]
  introduces: [c:evasion-attack, c:white-box]
  mentions: [c:privacy]
  data: []
  ladder: [python]
  needs: any

- id: rai-owasp-lists
  title: "The OWASP lists for LLM apps"
  level: basis
  domein: verantwoord
  module: security
  idea: "OWASP's top 10 for LLM applications ranks the biggest risks, with prompt injection first, then leaking data, insecure output, too much agency and more, and its list for agents starts with a hijacked goal; a list like this is where a review starts."
  covers: [dreigingsmodellering#5]
  requires: [rai-ml-threat-models, start-prompt-chains]
  introduces: [c:owasp-top-10-for-llm]
  mentions: [c:prompt-injection]
  data: []
  ladder: [python]
  needs: any

- id: rai-data-poisoning
  title: "Poisoning the training data"
  level: basis
  domein: verantwoord
  module: security
  idea: "Flip a share of the labels and the model gets worse everywhere; flip only some labels of one class and it fails just there. Training the digit network with more and more flipped labels shows how much it tolerates."
  covers: [poisoning-en-backdoors#0]
  requires: [rai-ml-threat-models, torch-mlp-digits]
  introduces: [c:data-poisoning, c:label-flipping]
  data: [qmnist]
  ladder: [python, numpy, torch]
  needs: any

- id: rai-prompt-injection
  title: "How often does an injection work?"
  level: basis
  domein: verantwoord
  module: security
  idea: "A model cannot tell its maker's instructions from text that only looks like instructions; send the same injections against a prompt with and without defenses, and the attack success rate shows how much each defense helps, and that none is enough."
  covers: [aanvallen-op-llm-applicaties#0]
  requires: [rai-ml-threat-models, build-defensive-prompts]
  introduces: [c:attack-success-rate, c:spotlighting]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: rai-indirect-injection
  title: "Injection through a document"
  level: basis
  domein: verantwoord
  module: security
  idea: "The attack text need not come from the user: it can sit in a web page, an email or a tool result the model reads. An agent that reads untrusted text, has private data and can send messages is open to theft (the lethal trifecta)."
  covers: [aanvallen-op-llm-applicaties#1]
  requires: [rai-prompt-injection, agent-idea]
  introduces: [c:indirect-prompt-injection, c:lethal-trifecta]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: rai-jailbreaks
  title: "Jailbreaks"
  level: basis
  domein: verantwoord
  module: security
  idea: "A jailbreak makes a model do what its training told it to refuse: by role play, many examples, hiding the request or building up over several turns. They work because helpfulness and refusal compete, and because safety training did not cover every form."
  covers: [aanvallen-op-llm-applicaties#2]
  requires: [rai-prompt-injection]
  introduces: [c:competing-objectives, c:many-shot-jailbreaking]
  mentions: [c:jailbreak]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: rai-system-prompt-extraction
  title: "Getting the system prompt out"
  level: basis
  domein: verantwoord
  module: security
  idea: "A system prompt is not a secret: users can often get the model to repeat it. Put nothing in it that may not leak, and test how often it does."
  covers: [aanvallen-op-llm-applicaties#4]
  requires: [rai-jailbreaks]
  introduces: [c:system-prompt-extraction]
  mentions: [c:jailbreak]
  data: [model-qwen3-0.6b]
  ladder: [python]
  needs: any

- id: rai-insecure-output
  title: "Model output is untrusted input"
  level: basis
  domein: verantwoord
  module: security
  idea: "What a model writes can contain HTML, SQL or a link that sends data away; treat it like user input: escape it before showing it, never run it as code, and never paste it into an SQL statement."
  covers: [d24-llm-applicatiebeveiliging#0]
  requires: [rai-classic-vulnerabilities, rai-prompt-injection]
  introduces: [c:insecure-output-handling]
  data: []
  ladder: [python]
  needs: any

- id: rai-secrets-and-endpoints
  title: "Keys and open doors"
  level: basis
  domein: verantwoord
  module: security
  idea: "An API key in your code ends up on GitHub, and a model server listening on every address is open to your whole network; keep keys in the environment, listen on 127.0.0.1, and ask for a token."
  covers: [d24-llm-applicatiebeveiliging#3]
