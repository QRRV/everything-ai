- id: rai-red-teaming
  title: "Red teaming"
  level: basis
  domein: verantwoord
  module: security
  idea: "Red teaming means attacking your own system before others do, by hand and with automated attack lists; bug and bias bounties pay outsiders who find problems, if they report them responsibly."
