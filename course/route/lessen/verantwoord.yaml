  needs: any

- id: rai-outer-inner-alignment
  title: "Outer and inner alignment"
  level: basis
  domein: verantwoord
  module: veiligheid
  idea: "Outer alignment asks whether the objective says what we want; inner alignment asks whether the trained model pursues that objective or something that only matched it during training."
  covers: [ai-veiligheid-als-vakgebied#1]
  requires: [rai-goodhart]
  introduces: [c:outer-alignment, c:inner-alignment]
  data: []
  ladder: [python]
  needs: any

- id: rai-ethics-vs-safety
  title: "AI ethics and AI safety"
  level: basis
  domein: verantwoord
  module: veiligheid
  idea: "One camp works on harm that AI does now, the other on catastrophes it might cause later; they argue about priorities and worldviews (longtermism and its critics), and share more than the debate suggests."
