- id: rai-content-provenance
  title: "Where did this picture come from?"
  level: basis
  domein: verantwoord
  module: security
  idea: "Detecting fakes is an arms race the detector tends to lose; provenance turns it around: the maker signs the content and its history (C2PA), and anyone can check that nothing changed since."
