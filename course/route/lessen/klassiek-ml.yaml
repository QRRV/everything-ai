- id: ml-tsne
  title: "A map of many dimensions: t-SNE"
  level: basis
  domein: klassiek-ml
  module: ongesuperviseerd
  idea: "t-SNE draws points of many dimensions on a flat map so that neighbors stay neighbors; it shows groups PCA blurs, but the size of a group and the distance between groups on the map are not promised, and another perplexity draws another map."
