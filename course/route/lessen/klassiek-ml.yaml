- id: ml-collaborative-filtering
  title: "Customers like you: collaborative filtering"
  level: basis
  domein: klassiek-ml
  module: aanbevelen
  idea: "Neighborhood collaborative filtering ignores what items are and looks only at who bought what: two products are alike when the same customers buy them, and a customer gets the products most like what they bought."
  covers: [recommender-systems#2]
  requires: [ml-content-based]
  introduces: [c:collaborative-filtering, c:item-item-similarity, c:cold-start]
  data: [online-retail-baskets]
  ladder: [numpy]
  needs: any

- id: ml-network-data
  title: "Networks as data: degrees and hubs"
  level: basis
  domein: klassiek-ml
  module: aanbevelen
  idea: "In a real network a few nodes have most of the edges: the degrees of the airports in the network of flights fall on a straight line on a log scale, and a few hubs make almost every airport a few flights from any other, a small world."
  covers: [d10-netwerkanalyse-en-graph-mining#0]
  requires: [math-graphs, math-log-scales]
  introduces: [c:degree-distribution, c:hub, c:small-world, c:scale-free-network]
  data: [openflights-routes]
  ladder: [python, numpy]
  needs: any

- id: ml-pagerank
  title: "Who matters in a network? Centrality and PageRank"
  level: basis
  domein: klassiek-ml
  module: aanbevelen
  idea: "Centrality says how important a node is: by its degree, by how close it is to all others, by how many shortest paths run through it, or by PageRank, the share of time a random walker spends there, computed by spreading scores along the edges until they stop changing."
  covers: [d10-netwerkanalyse-en-graph-mining#1]
  requires: [ml-network-data]
  introduces: [c:centrality, c:closeness-centrality, c:betweenness-centrality, c:pagerank, c:random-walk, c:power-iteration]
  data: []
  ladder: [python, numpy]
  needs: any

# --- tables in practice ---------------------------------------------------------
- id: ml-gbdt-default
  title: "The default for tables: gradient-boosted trees"
  level: basis
  domein: klassiek-ml
  module: praktijk
  idea: "On a table of mixed columns, histogram gradient boosting is the model to try first: it bins every feature, handles missing values and categories itself, stops early on a validation part, and usually beats a forest and a linear model with little tuning."
  covers: [tabulaire-data-in-de-praktijk#0]
  requires: [ml-gradient-boosting, ml-pipelines, ts-time-index]
  introduces: [c:histogram-gradient-boosting, c:native-categorical, c:early-stopping-trees]
  data: [metro-traffic]
  ladder: [python]
  needs: any

- id: ml-competitions
  title: "What competitions teach: the leaderboard"
  level: basis
  domein: klassiek-ml
  module: praktijk
  idea: "In a competition the public leaderboard scores part of the test set and the private one the rest; who submits often and keeps the best public score fits that part, and drops on the private board, as the validation set warned."
  covers: [tabulaire-data-in-de-praktijk#5]
  requires: [ml-gbdt-default, ml-validation-set]
  introduces: [c:leaderboard, c:public-leaderboard, c:private-leaderboard, c:leaderboard-overfitting]
  data: []
  ladder: [python, numpy]
  needs: any

- id: ml-imbalanced
  title: "When one class is rare"
  level: basis
  domein: klassiek-ml
  module: praktijk
  idea: "With 3 failures in 100 machines a model that never predicts a failure is 97% accurate and useless; class weights make every rare example count more, undersampling and oversampling change the counts, and SMOTE makes new rare examples between neighbors, judged by precision and recall."
  covers: [onevenwichtige-data#1]
  requires: [ml-roc-auc, ml-f1-score, ml-knn]
  introduces: [c:class-weight, c:undersampling, c:oversampling, c:smote]
  data: [ai4i-maintenance]
  ladder: [python, numpy]
  needs: any

- id: ml-grid-random-search
  title: "Searching settings: grid search and random search"
  level: basis
  domein: klassiek-ml
  module: praktijk
  idea: "Grid search tries every combination of a few values per setting; random search draws combinations, and with the same number of tries it tests more values of the setting that matters, so it usually finds a better one."
  covers: [automl#1]
  requires: [ml-cross-validation, ml-pipelines, ml-hyperparameters]
  introduces: [c:grid-search, c:random-search, c:search-space]
  data: [ai4i-maintenance]
  ladder: [python]
  needs: any

- id: ml-automl
  title: "Let the computer choose: AutoML"
  level: basis
  domein: klassiek-ml
  module: praktijk
  idea: "AutoML searches models and their settings within a budget: successive halving gives many candidates a little data, keeps the best half and gives them more, and tools such as Optuna, auto-sklearn and AutoGluon add smarter search and ensembles, but still need a fair split and a metric from you."
  covers: [automl#0, automl#7]
  requires: [ml-grid-random-search, ml-random-forest]
  introduces: [c:automl, c:successive-halving, c:budget]
  warns: [budget]
  data: [ai4i-maintenance]
  ladder: [python]
  needs: any

- id: data-labels
  title: "Where labels come from"
  level: basis
  domein: klassiek-ml
  module: praktijk
  idea: "A label comes from a person who judges, a measurement, or behavior such as a return or a click; a label from behavior is free and plentiful but arrives late and says what people did, not what is true, and the time it takes to arrive is the feedback loop."
  covers: [labelen-en-annotatie#0, labelen-en-annotatie#3]
  requires: [ml-classification, data-provenance]
  introduces: [c:annotation-label, c:natural-label, c:feedback-loop]
  data: []
  ladder: [python]
  needs: any

- id: data-annotation
  title: "Labeling well: guidelines and agreement"
  level: basis
  domein: klassiek-ml
  module: praktijk
  idea: "Labels from people are as good as their guidelines: two annotators who label the same messages agree more than chance only as far as the rules are clear, Cohen's kappa measures it, gold questions catch careless work, and fair pay and care for annotators belong to the process."
  covers: [labelen-en-annotatie#1, labelen-en-annotatie#2, labelen-en-annotatie#4]
  requires: [data-labels, prob-basics]
  introduces: [c:annotation-guideline, c:inter-annotator-agreement, c:cohens-kappa, c:gold-question, c:crowdsourcing]
  data: [course-spam-messages]
  ladder: [python]
  needs: any

- id: data-centric-ai
  title: "Fix the data, not the model"
  level: basis
  domein: klassiek-ml
  module: praktijk
  idea: "Keep the model fixed and improve the data: examples whose label the model, trained without them, finds very unlikely are often wrong; checking those first and fixing them raises the test score more than the same time spent on the model."
  covers: [weinig-labels-synthetische-data-en-data-centric-ai#0]
  requires: [data-annotation, ml-cross-validation, ml-log-loss]
  introduces: [c:data-centric-ai, c:label-noise, c:out-of-fold-prediction]
  data: [palmer-penguins]
  ladder: [python, numpy]
  needs: any

- id: data-synthetic
  title: "Data you make yourself"
  level: basis
  domein: klassiek-ml
  module: praktijk
  idea: "When data is scarce you can make more: change examples you have, simulate the process that makes them, or let a model write examples and labels; it helps when what you make looks like the real data on the points that matter, and you test it on real data only."
  covers: [weinig-labels-synthetische-data-en-data-centric-ai#1]
  requires: [data-centric-ai]
  introduces: [c:simulation, c:synthetic-label]
  mentions: [c:synthetic-data]
  data: [ai4i-maintenance]
  ladder: [python, numpy]
  needs: any

