- id: ml-hierarchical-clustering
  title: "Clusters inside clusters: hierarchical clustering"
  level: basis
  domein: klassiek-ml
  module: ongesuperviseerd
  idea: "Agglomerative clustering starts with every point as a cluster and merges the two closest until one is left; the linkage says what closest means, and the dendrogram shows every merge, so you choose the number of clusters afterwards."
  covers: [clustering#3]
  requires: [ml-choosing-k]
  introduces: [c:hierarchical-clustering, c:linkage, c:dendrogram, py:scipy-linkage]
