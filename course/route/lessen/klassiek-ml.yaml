# --- the core: graphs -----------------------------------------------------------
- id: math-graphs
  title: "Graphs: nodes, edges and paths"
  level: basis
  domein: fundament
  module: grafen-en-ruimte
  idea: "A graph is a set of nodes joined by edges, directed or not, weighted or not; you store it as a list of neighbors or as an adjacency matrix, and breadth-first search finds the shortest path in steps between two nodes."
  covers: [discrete-wiskunde-en-grafen#2]
  requires: [search-bfs, np-arrays]
  introduces: [c:graph, c:node, c:edge, c:directed-graph, c:weighted-graph, c:adjacency-list, c:adjacency-matrix, c:graph-path, c:degree]
