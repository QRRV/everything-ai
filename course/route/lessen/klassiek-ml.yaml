- id: ml-no-free-lunch
  title: "No model wins everywhere"
  level: basis
  domein: klassiek-ml
  module: modellen
  idea: "Every model assumes something about the data, such as a straight boundary, near points alike or splits along one feature; it wins where the assumption holds and loses where it does not, so without an assumption nothing can be learned and averaged over all problems no model wins."
  covers: [inductive-bias-no-free-lunch-occam#0]
  requires: [ml-nearest-centroid, ml-max-margin, ml-decision-tree, ml-cross-validation]
  introduces: [c:no-free-lunch-theorem, py:list-concatenation]
  mentions: [c:inductive-bias]
  uses: [c:k-nearest-neighbors, c:nearest-centroid-classifier, c:centroid, c:maximum-margin-classifier, c:decision-tree, c:tree-depth, c:tree-split, c:decision-boundary, c:cross-validation, c:fold, c:accuracy, c:lazy-learning, c:generalization, c:train-set, c:training, c:classification, c:class, c:label, c:feature, c:prediction, c:model, v:scatter-plot, py:list, py:nested-list, py:append, py:len, py:range, py:for, py:if, py:comparison, py:indexing, py:def, py:return, py:arithmetic, py:int, py:float, py:print, py:comment, py:variable, q:predict, q:choice, q:exercise-with-check, q:slider-task, q:run-cell]
