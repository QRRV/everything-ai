- id: ml-dbscan
  title: "Clusters of any shape: DBSCAN"
  level: basis
  domein: klassiek-ml
  module: ongesuperviseerd
  idea: "DBSCAN calls a point a core point when enough others lie within a radius, grows clusters from core points to their neighbors and calls the rest noise, so it finds clusters of any shape without a number of clusters, where k-means cuts a ring in two."
  covers: [clustering#4]
  requires: [ml-hierarchical-clustering, ml-knn]
  introduces: [c:dbscan, c:core-point, c:noise-point, c:density-based-clustering]
