- id: ml-association-rules
  title: "Bought together: support, confidence and lift"
  level: basis
  domein: klassiek-ml
  module: ongesuperviseerd
  idea: "An association rule says that orders with one product often hold another; support counts how often both occur, confidence how often the second follows the first, and lift how much more often than chance, and Apriori finds frequent sets by growing only sets whose parts are frequent."
  covers: [patroonmining-en-dichtheidsschatting#0]
  requires: [prob-conditional, py-tuples-sets, data-groupby]
  introduces: [c:association-rule, c:support, c:confidence, c:lift, c:frequent-itemset, c:apriori, py:set-subset]
