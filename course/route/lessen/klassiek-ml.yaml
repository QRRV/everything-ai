- id: ml-one-vs-rest
  title: "Many classes from two: one-vs-rest and one-vs-one"
  level: basis
  domein: klassiek-ml
  module: modellen
  idea: "A model for two classes handles many: one-vs-rest trains one model per class against all others and takes the most confident, one-vs-one trains one per pair and lets them vote, and an output code gives each class its own row of answers."
  covers: [multiclass-multilabel-en-ranking#0]
  requires: [ml-max-margin, ml-softmax]
  introduces: [c:one-vs-rest, c:one-vs-one, c:output-code]
  uses: [c:maximum-margin-classifier, c:soft-margin, c:margin, c:softmax, c:logit, c:probability, c:k-nearest-neighbors, c:majority-voting, c:matrix, c:matrix-multiplication, c:vector, c:standardization, c:weight, c:bias-term, c:validation-set, c:train-set, c:classification, c:class, c:prediction, c:model, v:scatter-plot, py:np-array, py:matmul-operator, py:np-argmax, py:indexing, py:list, py:tuple, py:dict, py:for, py:if, py:comparison, py:def, py:return, py:import, py:import-as, py:round, py:arithmetic, py:float, py:string-literal, py:print, py:comment, py:variable, py:underscore-name, q:predict, q:choice, q:exercise-with-check, q:slider-task, q:run-cell]
