- id: ml-nearest-centroid
  title: "Learn now or later: the nearest centroid"
  level: basis
  domein: klassiek-ml
  module: modellen
  idea: "k-nearest neighbors learns nothing until it is asked and then searches all examples (lazy); the nearest centroid computes one mean per class beforehand (eager), so it predicts in a moment and keeps little, but can only draw straight boundaries between the classes."
  covers: [instance-based-leren-en-naive-bayes#2, instance-based-leren-en-naive-bayes#3]
  requires: [ml-knn, ml-kmeans]
  introduces: [c:lazy-learning, c:eager-learning, c:nearest-centroid-classifier]
