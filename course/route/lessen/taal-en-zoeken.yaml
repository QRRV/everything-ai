# --- zoeken: search engines -----------------------------------------------------------------------------------------
- id: ir-what-is-search
  title: "Search: needs and relevance"
  level: basis
  domein: taal
  module: zoeken
  idea: "Search is everywhere (the web, a shop, your mail, a library), and a search engine serves an information need, not the words typed in; a result is relevant when it helps with that need, which is why one search query can need different results and why people judge search."
  covers: [information-retrieval-en-zoekmachines#0, information-retrieval-en-zoekmachines#1]
  requires: [nlp-document-vectors]
  introduces: [c:information-retrieval, c:information-need, c:relevance, c:search-query]
  data: []
  ladder: [python]
  needs: any

- id: ir-inverted-index
  title: "The inverted index"
  level: basis
  domein: taal
  module: zoeken
  idea: "An inverted index lists for every word the documents that contain it; a search query with AND intersects those lists, which is fast because it never reads the documents themselves."
  covers: [information-retrieval-en-zoekmachines#2]
  requires: [ir-what-is-search]
  introduces: [c:inverted-index, c:postings-list, c:boolean-retrieval]
  data: [xquad-squad-nl]
  ladder: [python]
  needs: any

- id: ir-vector-space
  title: "Ranking by cosine: the vector space model"
  level: basis
  domein: taal
  module: zoeken
  idea: "Rank documents by the cosine between their TF-IDF vectors and that of the search query; the cosine favors short documents, so long relevant ones come up too rarely, which pivoted length normalization corrects."
  covers: [d15-retrievalmodellen-en-ranking#0]
  requires: [ir-inverted-index, nlp-tf-idf]
  introduces: [c:vector-space-model]
  data: [xquad-squad-nl]
  ladder: [python, numpy]
  needs: any

- id: ir-bm25
  title: "BM25: the classic ranking"
  level: basis
  domein: taal
  module: zoeken
  idea: "BM25 improves on TF-IDF: every repeat of a word adds less than the one before (k1) and long documents are scaled down (b); with its two settings tuned on one half of a test collection's queries and measured on the other, it is still hard to beat."
  covers: [d15-retrievalmodellen-en-ranking#1]
  requires: [ir-vector-space]
  introduces: [c:bm25]
  mentions: [c:lexical-retrieval]
  data: [xquad-squad-nl, scifact]
  ladder: [python, numpy]
  needs: any

- id: ir-vertical-search
  title: "Search engines for one domain"
  level: basis
  domein: taal
  module: zoeken
  idea: "A vertical search engine (news, products, local, law) knows the fields of its documents, so it weighs a match in the title more, filters on price or date, and ranks by freshness or distance."
  covers: [d15-webzoeken#8]
  requires: [ir-bm25]
  introduces: [c:vertical-search]
  data: []
  ladder: [python]
  needs: any

- id: ir-precision-at-k
  title: "Did the search work? P@k, MAP and MRR"
  level: basis
  domein: taal
  module: zoeken
  idea: "With relevance judgments per search query you count the relevant results among the first k (precision at k), average the precision at every relevant result (MAP) and take one over the rank of the first relevant one (MRR)."
  covers: [d15-evaluatie-en-interactief-zoeken#0]
  requires: [ir-bm25, ml-confusion-matrix]
  introduces: [c:cranfield-paradigm, c:relevance-judgment, c:precision-at-k, c:mean-reciprocal-rank]
  data: [xquad-squad-nl, scifact]
  ladder: [python]
  needs: any

- id: ir-ndcg
  title: "Graded relevance: nDCG"
  level: basis
  domein: taal
  module: zoeken
  idea: "When results are more or less relevant, nDCG adds up their grades, counting each less the lower it stands, and divides by the best possible order, so every search query scores between 0 and 1."
  covers: [d15-evaluatie-en-interactief-zoeken#0]
  requires: [ir-precision-at-k]
  introduces: [c:ndcg]
  data: []
  ladder: [python, numpy]
  needs: any

- id: ir-snippets
  title: "Snippets: showing the results"
  level: basis
  domein: taal
  module: zoeken
  idea: "A result page shows a snippet per hit: the stretch of the document with the most words of the search query, those words in bold, so people can judge a result before they click it."
