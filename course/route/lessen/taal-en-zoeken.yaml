# Lessons of the domain taal (language and search: linguistics, processing and classifying text, meaning as vectors, structure,
# neural NLP, the classic tasks, search engines and other languages), level basis. The plan: docs/onderzoek/reports/Voorstel
# domein Taal en zoeken.md (besluit 1.18, advice 6). The route taal in routes.yaml starts where the core ends and gives the
# order. The language lessons of the core and of the domain llm are in taal.yaml. Every lesson runs on a CPU.
# Planning data; "introduces" is the plan and "uses" is filled in fully when a lesson is built. Format: ../FORMAT.md.
map: v2.3
lessons:

# --- taalkunde: linguistics for AI ----------------------------------------------------------------------------------
- id: nlp-what-is-nlp
  title: "What NLP is"
  level: basis
  domein: taal
  module: taalkunde
  idea: "NLP makes computers work with human language: understanding it (NLU, from text to meaning) and producing it (NLG, from meaning to text); computational linguistics studies language itself with computers."
  covers: [wat-nlp-is#0, wat-nlp-is#2]
  requires: [lm-bigram-counts, data-text-as-numbers]
  introduces: [c:natural-language-processing, c:computational-linguistics, c:natural-language-understanding, c:natural-language-generation]
  data: []
  ladder: [python]
  needs: any

- id: nlp-why-language-is-hard
  title: "Why language is hard for computers"
  level: basis
  domein: taal
  module: taalkunde
  idea: "One form can mean several things (ambiguity), one meaning has many forms (variation), and what a sentence means depends on who says it where (context); a program has to choose, and counting the choices shows how fast they add up."
  covers: [wat-nlp-is#1]
  requires: [nlp-what-is-nlp]
  introduces: [c:ambiguity]
  data: []
  ladder: [python]
  needs: any

- id: nlp-history
  title: "From rules to statistics to neural networks"
  level: basis
  domein: taal
  module: taalkunde
  idea: "NLP went from hand-written rules to statistics learned from corpora to neural networks and LLMs, and shared tasks with fixed data and a fixed score (CoNLL, SemEval, WMT) drove each step by making systems comparable."
  covers: [wat-nlp-is#3, wat-nlp-is#5]
  requires: [nlp-why-language-is-hard]
  introduces: [c:shared-task]
  mentions: [c:language-model, c:neural-language-model, c:machine-translation]
  data: []
  ladder: [python]
  needs: any

- id: nlp-pipeline
  title: "An NLP pipeline"
  level: basis
  domein: taal
  module: taalkunde
  idea: "Classic NLP chains steps (split sentences and words, tag them, find names), each feeding the next; toolkits such as spaCy, NLTK and Stanza package such chains, and a mistake early on is carried through to the end."
  covers: [wat-nlp-is#4]
  requires: [nlp-what-is-nlp]
  introduces: [c:nlp-pipeline, c:spacy, c:nltk]
  data: []
  ladder: [python]
  needs: any

- id: nlp-morphemes
  title: "Words and their parts"
  level: basis
  domein: taal
  module: taalkunde
  idea: "Words are built from morphemes: inflection makes forms of one word (walk, walked), derivation makes a new word (happy, happiness), and compounding puts words together (doghouse); a program can split a word along a list of known parts."
  covers: [morfologie#0, morfologie#1]
  requires: [nlp-what-is-nlp]
  introduces: [c:morphology, c:morpheme, c:inflection, c:derivation, c:compound]
  warns: [derivation]
  data: []
  ladder: [python]
  needs: any

- id: nlp-dutch-compounds
  title: "Splitting Dutch compounds"
  level: basis
  domein: taal
  module: taalkunde
  idea: "Dutch writes compounds as one word, so a program splits them by looking for known words, recursively, with linking sounds such as -s- and -en- and often more than one possible split."
  covers: [morfologie#2, morfologie#3]
  requires: [nlp-morphemes, py-recursion]
  introduces: [c:decompounding]
  data: [wordnet-en-nl]
  ladder: [python]
  needs: any

- id: nlp-word-classes
  title: "Parts of speech and phrases"
  level: basis
  domein: taal
  module: taalkunde
  idea: "Words have parts of speech (noun, verb, adjective and more) by how they behave, and group into phrases; one international scheme uses the same 17 tags for over 150 languages, which you count in real labeled sentences."
  covers: [syntaxis#0]
  requires: [nlp-morphemes]
  introduces: [c:syntax, c:part-of-speech]
  mentions: [c:universal-dependencies, c:treebank]
  data: [ud-english-dutch]
  ladder: [python]
  needs: any

- id: nlp-phrase-structure
  title: "Phrase structure and endless sentences"
  level: basis
  domein: taal
  module: taalkunde
  idea: "A sentence is built of nested constituents that a grammar of rewrite rules describes; because a rule can call itself, a few rules make infinitely many sentences."
  covers: [syntaxis#1, syntaxis#4]
  requires: [nlp-word-classes]
  introduces: [c:constituent, c:context-free-grammar]
  data: []
  ladder: [python]
  needs: any

- id: nlp-dependencies
  title: "Who depends on whom: dependency trees"
  level: basis
  domein: taal
  module: taalkunde
  idea: "A dependency tree links every word to its head with a labeled relation (subject, object and so on); Universal Dependencies annotates treebanks of over 100 languages this way, in the CoNLL-U format."
  covers: [syntaxis#2]
  requires: [nlp-phrase-structure]
  introduces: [c:dependency-relation, c:universal-dependencies]
  mentions: [c:treebank]
  data: [ud-english-dutch]
  ladder: [python]
  needs: any

- id: nlp-syntactic-ambiguity
  title: "One sentence, several trees"
  level: basis
  domein: taal
  module: taalkunde
  idea: "A sentence can have several trees: where a prepositional phrase attaches, what 'and' connects, or a headline that reads two ways; the number of ways to bracket a phrase grows very fast with its length."
  covers: [syntaxis#3]
  requires: [nlp-phrase-structure, nlp-why-language-is-hard]
  introduces: [c:attachment-ambiguity]
  data: []
  ladder: [python]
  needs: any

- id: nlp-meaning-and-truth
  title: "Meaning: when is a sentence true?"
  level: basis
  domein: taal
  module: taalkunde
  idea: "The meaning of a sentence can be taken as the situations in which it is true, built from the meanings of its parts (compositionality); you write that as code that checks sentences against a small world."
  covers: [semantiek-pragmatiek-en-discourse#0, semantiek-pragmatiek-en-discourse#1]
  requires: [nlp-phrase-structure]
  introduces: [c:semantics, c:truth-conditions, c:compositionality]
  data: []
  ladder: [python]
  needs: any

- id: nlp-pragmatics
  title: "What is meant, not said"
  level: basis
  domein: taal
  module: taalkunde
  idea: "Speakers mean more than they say: a question can be a request (a speech act), 'some' suggests 'not all' (an implicature, after Grice's maxims), and 'stop' takes for granted that something had started (a presupposition)."
  covers: [semantiek-pragmatiek-en-discourse#2]
  requires: [nlp-meaning-and-truth]
  introduces: [c:pragmatics, c:speech-act, c:implicature, c:presupposition]
  data: []
  ladder: [python]
  needs: any

- id: nlp-conversation
  title: "How a conversation works"
  level: basis
  domein: taal
  module: taalkunde
  idea: "People take turns, check that they understood each other (grounding) and do something with each turn (ask, answer, thank: a dialogue act), which a program can label turn by turn."
  covers: [semantiek-pragmatiek-en-discourse#3]
  requires: [nlp-pragmatics]
  introduces: [c:turn-taking, c:conversational-grounding, c:dialogue-act]
  warns: [grounding]
  data: []
  ladder: [python]
  needs: any

- id: nlp-discourse
  title: "A text is more than its sentences"
  level: basis
  domein: taal
  module: taalkunde
  idea: "Sentences hang together by repeated words and references (cohesion) and by sense (coherence), and each tends to put what is known first and what is new last (information structure)."
  covers: [semantiek-pragmatiek-en-discourse#4, semantiek-pragmatiek-en-discourse#5]
  requires: [nlp-pragmatics]
  introduces: [c:cohesion, c:coherence, c:information-structure]
  data: []
  ladder: [python]
  needs: any

- id: nlp-sounds
  title: "Sounds, phonemes and IPA"
  level: basis
  domein: taal
  module: taalkunde
  idea: "A phoneme is a sound that changes meaning in a language, IPA writes each sound with one symbol, and rules such as Dutch final devoicing (hond sounds like hont) change sounds by their place in the word."
  covers: [fonetiek-corpora-en-typologie#0, fonetiek-corpora-en-typologie#1]
  requires: [nlp-morphemes]
  introduces: [c:phonetics, c:phonology, c:phoneme, c:ipa]
  data: []
  ladder: [python]
  needs: any

- id: nlp-corpora
  title: "Corpora and treebanks"
  level: basis
  domein: taal
  module: taalkunde
  idea: "A corpus is a collection of real text chosen for a purpose; a treebank adds trees, a lexical database adds facts about words, and the people who label a corpus follow written guidelines so that they all label the same way, which you try on a few sentences."
  covers: [fonetiek-corpora-en-typologie#2, fonetiek-corpora-en-typologie#3]
  requires: [nlp-dependencies]
  introduces: [c:corpus, c:treebank, c:concordance]
  mentions: [c:cgn, c:cohens-kappa, c:common-crawl, c:language-variety]
  data: [gutenberg-books]
  ladder: [python]
  needs: any

- id: nlp-zipf-heaps
  title: "Zipf's law and Heaps' law"
  level: basis
  domein: taal
  module: taalkunde
  idea: "In every corpus a few words are very frequent and most are rare, frequency falling roughly as one over rank (Zipf), and the vocabulary keeps growing with the text, roughly as a power of its length (Heaps)."
  covers: [fonetiek-corpora-en-typologie#4]
  requires: [nlp-corpora, math-log-scales, lm-tokens-outside]
  introduces: [c:zipfs-law, c:heaps-law]
  data: [gutenberg-books, tatoeba-sentences]
  ladder: [python, numpy]
  needs: any

- id: nlp-languages-of-the-world
  title: "About 7,000 languages"
  level: basis
  domein: taal
  module: taalkunde
  idea: "Languages fall into families and differ in how they order subject, verb and object, as the World Atlas of Language Structures records; most NLP tools work for only a few of them."
  covers: [fonetiek-corpora-en-typologie#6]
  requires: [nlp-word-classes, nlp-dependencies]
  introduces: [c:linguistic-typology]
  mentions: [c:common-crawl]
  data: [ud-english-dutch, wals-word-order]
  ladder: [python]
  needs: any

- id: nlp-language-and-society
  title: "Language, groups and dialects"
  level: basis
  domein: taal
  module: taalkunde
  idea: "How people speak marks who they are; Dutch has Netherlandic and Flemish varieties, dialects and Frisian next to it, and a tool built on standard text knows fewer of the words of the others, which you count."
  covers: [d15-sociolinguistiek-en-taalvariatie#0, d15-sociolinguistiek-en-taalvariatie#1]
  requires: [nlp-languages-of-the-world]
  introduces: [c:sociolinguistics, c:language-variety]
  mentions: [c:treebank, c:corpus]
  data: [ud-english-dutch, tatoeba-sentences]
  ladder: [python]
  needs: any

- id: nlp-language-change
  title: "Languages meet and change"
  level: basis
  domein: taal
  module: taalkunde
  idea: "Languages borrow words, speakers switch languages within a sentence (code-switching), and words change meaning and spelling over time, so a corpus describes the language of its own time and people: novels of the 19th century are not Dutch or English of today."
  covers: [d15-sociolinguistiek-en-taalvariatie#2]
  requires: [nlp-language-and-society, nlp-corpora]
  introduces: [c:code-switching, c:semantic-change]
  data: [gutenberg-books, tatoeba-sentences]
  ladder: [python]
  needs: any


# --- tekst-verwerken: processing and classifying text ---------------------------------------------------------------
- id: nlp-regex
  title: "Finding patterns: regular expressions"
  level: basis
  domein: taal
  module: tekst-verwerken
  idea: "A regular expression describes a set of strings with character classes, repetition and anchors; Python's re finds every place where it matches, and a group takes out the part you want."
  covers: [tekstverwerking#1]
  requires: [nlp-what-is-nlp]
  introduces: [c:regular-expression, py:re-search, py:re-findall, py:raw-string]
  data: [tatoeba-sentences]
  ladder: [python]
  needs: any

- id: nlp-tokenize
  title: "Cutting text into sentences and words"
  level: basis
  domein: taal
  module: tekst-verwerken
  idea: "Classic tokenization splits off punctuation by rules with exceptions (abbreviations, numbers, don't), splitting sentences at every full stop fails on e.g., and languages without spaces need a dictionary and the longest match."
  covers: [tekstverwerking#2]
  requires: [nlp-regex]
  introduces: [c:sentence-segmentation, c:word-segmentation]
  mentions: [c:treebank, c:universal-dependencies]
  data: [ud-english-dutch, tatoeba-sentences]
  ladder: [python]
  needs: any

- id: nlp-normalize
  title: "Normalizing: case, accents and stop words"
  level: basis
  domein: taal
  module: tekst-verwerken
  idea: "Lowercasing, removing accents and dropping very common words make Café and cafe one word and shrink the vocabulary, but they also throw away information, such as US against us."
  covers: [tekstverwerking#3]
  requires: [nlp-tokenize, lm-tokens-outside]
  introduces: [c:text-normalization, c:case-folding, c:stop-word]
  data: [snowball-stopwords, gutenberg-books, tatoeba-sentences]
  ladder: [python]
  needs: any

- id: nlp-stemming
  title: "Stems and lemmas"
  level: basis
  domein: taal
  module: tekst-verwerken
  idea: "A stemmer chops off suffixes by rules (Porter: running to run, but also university to univers), a lemmatizer looks up the dictionary form (ran to run); both put the forms of one word together."
  covers: [tekstverwerking#4]
  requires: [nlp-normalize, nlp-morphemes]
  introduces: [c:stemming, c:word-stem, c:lemma, c:lemmatization]
  mentions: [c:information-retrieval, c:treebank, c:universal-dependencies, py:or-operator, py:not-operator]
  data: [ud-english-dutch]
  ladder: [python]
  needs: any

- id: nlp-edit-distance
  title: "How far apart are two words? Edit distance"
  level: basis
  domein: taal
  module: tekst-verwerken
  idea: "The edit distance is the smallest number of insertions, deletions and substitutions that turn one word into another; a table in which each cell builds on its neighbors computes it (dynamic programming)."
  covers: [tekstverwerking#5]
  requires: [nlp-normalize, np-arrays]
  introduces: [c:edit-distance, c:dynamic-programming]
  data: []
  ladder: [python, numpy]
  needs: any

- id: nlp-spelling
  title: "A spelling corrector"
  level: basis
  domein: taal
  module: tekst-verwerken
  idea: "A spelling corrector keeps a word that is in its corpus; otherwise it takes the known words one edit away, or two edits away when there are none, and picks the one that is most frequent in the corpus: the most likely intended word."
  covers: [tekstverwerking#5]
  requires: [nlp-edit-distance, nlp-corpora]
  introduces: [c:spelling-correction, c:noisy-channel-model]
  data: [gutenberg-books, tatoeba-sentences]
  ladder: [python]
  needs: any

- id: nlp-language-id
  title: "Which language is this?"
  level: basis
  domein: taal
  module: tekst-verwerken
  idea: "Every language has its own frequent letter sequences; comparing a text's profile of character n-grams with a profile per language tells which language it is, and the same counts flag text that is no language at all, such as markup or broken encoding."
  covers: [tekstverwerking#7]
  requires: [nlp-normalize, lm-bigram-counts]
  introduces: [c:language-identification]
  data: [tatoeba-sentences]
  ladder: [python]
  needs: any

- id: nlp-document-vectors
  title: "A document as a vector"
  level: basis
  domein: taal
  module: tekst-verwerken
  idea: "With a fixed vocabulary every document becomes a vector of word counts, mostly zeros (sparse), so documents can be compared with the cosine and given to any classifier."
  covers: [klassieke-tekstclassificatie#0]
  requires: [lm-naive-bayes, math-norms-cosine, nlp-normalize]
  introduces: [c:document-term-matrix, c:sparse-matrix]
  mentions: [c:information-retrieval, c:vector-space-model]
  data: [uci-sentiment-sentences]
  ladder: [python, numpy]
  needs: any

- id: nlp-tf-idf
  title: "TF-IDF: weighing the words"
  level: basis
  domein: taal
  module: tekst-verwerken
  idea: "Weigh each count by how rare the word is over all documents (inverse document frequency), so words that occur everywhere count for little; that weighting is TF-IDF."
  covers: [klassieke-tekstclassificatie#1]
  requires: [nlp-document-vectors, math-exp-log]
  introduces: [c:term-frequency, c:inverse-document-frequency, c:tf-idf]
  mentions: [c:information-retrieval, c:bm25]
  data: [gutenberg-books]
  ladder: [python, numpy]
  needs: any

- id: nlp-logistic-text
  title: "Logistic regression on words"
  level: basis
  domein: taal
  module: tekst-verwerken
  idea: "Logistic regression on TF-IDF vectors learns one weight per word: the largest weights show which words push towards each class, and on short texts naive Bayes often does just as well, which you measure."
  covers: [klassieke-tekstclassificatie#3]
  requires: [nlp-tf-idf, ml-logistic-regression, ml-train-logistic]
  introduces: [c:maximum-entropy-classifier]
  data: [uci-sentiment-sentences]
  ladder: [python, numpy]
  needs: any

- id: nlp-micro-macro
  title: "Many classes: micro and macro averages"
  level: basis
  domein: taal
  module: tekst-verwerken
  idea: "With many classes the macro average gives every class the same weight and the micro average every example, so a classifier that ignores the rare classes looks good on micro and bad on macro."
  covers: [klassieke-tekstclassificatie#5]
  requires: [nlp-logistic-text, ml-f1-score]
  introduces: [c:macro-averaging, c:micro-averaging]
  data: [massive-en-nl]
  ladder: [python]
  needs: any

- id: nlp-project-spam
  title: "Project: a spam filter with TF-IDF"
  level: basis
  domein: taal
  module: tekst-verwerken
  kind: project
  project: text
  idea: "Your own spam filter: TF-IDF features and logistic regression on real text messages, compared with naive Bayes and judged on the spam you miss and the messages you wrongly block."
  covers: []
  requires: [nlp-logistic-text]
  introduces: []
  data: [sms-spam-collection]
  ladder: [python, numpy]
  needs: any

- id: nlp-dutch-tools
  title: "Tools and corpora for Dutch"
  level: basis
  domein: taal
  module: tekst-verwerken
  idea: "Dutch has its own tools (the Alpino parser, Frog, spaCy's Dutch models) and corpora (SoNaR, Lassy, CGN, Open Dutch WordNet); in a Dutch treebank you see what rules written for English miss."
  covers: [nederlandse-nlp#0, nederlandse-nlp#1]
  requires: [nlp-dependencies, nlp-stemming, nlp-corpora, nlp-pipeline]
  introduces: [c:alpino, c:frog, c:lassy, c:sonar, c:cgn]
  mentions: [c:wordnet]
  data: [ud-english-dutch]
  ladder: [python]
  needs: any


# --- betekenis: meaning as a vector ---------------------------------------------------------------------------------
- id: nlp-distributional-hypothesis
  title: "A word by the company it keeps"
  level: basis
  domein: taal
  module: betekenis
  idea: "Words that occur in the same contexts have similar meanings; counting which words occur near each word gives every word a vector, and similar words get similar vectors."
  covers: [distributionele-semantiek-en-word-embeddings#0]
  requires: [nlp-document-vectors]
  introduces: [c:distributional-hypothesis, c:distributional-semantics, c:co-occurrence-matrix]
  mentions: [c:context-window]
  data: [gutenberg-books]
  ladder: [python, numpy]
  needs: any

- id: nlp-word-embeddings
  title: "Word embeddings: neighbors and analogies"
  level: basis
  domein: taal
  module: betekenis
  idea: "Pretrained word embeddings place words so that the nearest neighbors are related words and differences carry relations (king minus man plus woman lands near queen), though analogies work less well than the famous examples suggest."
  covers: [distributionele-semantiek-en-word-embeddings#2]
  requires: [nlp-distributional-hypothesis, ml-embeddings-idea]
  introduces: [c:word-embedding, c:glove]
  mentions: [c:common-crawl]
  data: [glove-50d, word2vec-analogies, fasttext-nl-30k]
  ladder: [python, numpy]
  needs: any

- id: nlp-static-vs-contextual
  title: "One vector per word, or one per use"
  level: basis
  domein: taal
  module: betekenis
  idea: "A static embedding gives bank one vector in every sentence; a contextual model gives every occurrence its own vector, so the bank of a river and the bank with your money can come apart, which you check on a small model."
  covers: [distributionele-semantiek-en-word-embeddings#6]
  requires: [nlp-word-embeddings]
  introduces: [c:static-embedding, c:contextual-embedding]
  mentions: [c:bert, c:attention]
  data: [glove-50d, model-bert-tiny]
  ladder: [python, numpy]
  needs: any

- id: nlp-word-relations
  title: "Senses and relations between words"
  level: basis
  domein: taal
  module: betekenis
  idea: "One word can have several related senses (polysemy), several words one meaning (synonymy), and meanings form hierarchies (a dog is an animal: hyponymy) and wholes with parts (meronymy)."
  covers: [d15-lexicale-semantiek#0]
  requires: [nlp-why-language-is-hard, py-while]
  introduces: [c:word-sense, c:polysemy, c:synonymy, c:hyponymy, c:meronymy]
  mentions: [c:wordnet, c:word-embedding, c:embedding-model, c:part-of-speech, c:glove]
  data: [wordnet-en-nl]
  ladder: [python]
  needs: any

- id: nlp-wordnet
  title: "WordNet: a network of meanings"
  level: basis
  domein: taal
  module: betekenis
  idea: "WordNet groups words into synsets joined by relations; the path between two synsets gives a similarity, and a small lexicon of your own is built the same way."
  covers: [d15-lexicale-semantiek#1]
  requires: [nlp-word-relations, math-graphs]
  introduces: [c:wordnet, c:lexicon]
  mentions: [c:cosine-similarity, c:word-embedding, c:glove]
  data: [wordnet-en-nl]
  ladder: [python]
  needs: any

- id: nlp-sentence-embeddings
  title: "A vector for a whole sentence"
  level: basis
  domein: taal
  module: betekenis
  idea: "The mean of the word vectors loses word order and negation; a transformer trained so that sentences with the same meaning get nearby vectors (as the Sentence Transformers library does) keeps more of them, though negation stays hard."
  covers: [sentence-embeddings#0]
  requires: [nlp-static-vs-contextual, attn-idea]
  introduces: [c:sentence-embedding, c:sentence-transformers]
  mentions: [c:embedding-model, c:natural-language-inference]
  data: [glove-50d, model-granite-embedding, model-bert-tiny, course-sentence-pairs]
  ladder: [python, numpy]
  needs: any

- id: nlp-sts
  title: "Same meaning? Similarity and paraphrases"
  level: basis
  domein: taal
  module: betekenis
  idea: "Semantic textual similarity scores how alike two sentences are in meaning; a threshold on the cosine of their embeddings turns that into paraphrase detection, judged against people's scores."
  covers: [sentence-embeddings#2]
  requires: [nlp-sentence-embeddings, ml-confusion-matrix]
