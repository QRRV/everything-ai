# ===================== basis =====================
- id: res-what-is-a-paper
  title: "What a paper, a preprint and peer review are"
  level: basis
  module: research-basis
  idea: "Research is shared as papers; a preprint is not yet reviewed, and peer review is a check by other researchers, not a guarantee."
  covers: [d27-wetenschappelijke-geletterdheid#0]
  requires: [start-ai-ml-genai]
  introduces: [c:paper, c:preprint, c:peer-review]
  uses: [c:artificial-intelligence, c:machine-learning, c:deep-learning, c:generative-ai, q:predict, q:choice, q:explain]
  mentions: [c:transformer, c:model, c:benchmark]
  warns: [paper]
  needs: any

- id: res-reading-claims
  title: "Reading AI claims critically"
  level: basis
  module: research-basis
  idea: "A press release, a paper and a benchmark score say different things; ask what was measured, against which baseline."
  covers: [d27-wetenschappelijke-geletterdheid#1]
  requires: [res-what-is-a-paper, ml-baselines]
  introduces: [c:benchmark, q:check-a-claim]
  uses: [c:baseline, c:paper, c:preprint, c:peer-review, c:accuracy, c:test-set, c:train-set, c:model-parameter, c:class, c:model, c:training, q:predict, q:choice, q:explain, q:exercise-with-check]
  mentions: [c:contamination, c:language-model, c:experiment]
  needs: any

- id: res-figure-and-table
  title: "Reading an abstract, a figure and a results table"
  level: basis
  module: research-basis
  idea: "Read the caption, the axes and the units first, then the claim; a results table compares rows under the same conditions."
  covers: [d27-wetenschappelijke-geletterdheid#2]
  requires: [res-reading-claims, torch-loss-curves]
  introduces: [q:read-a-figure, c:abstract, c:caption]
  uses: [c:paper, c:benchmark, c:accuracy, c:metric, c:test-set, c:training, c:loss, v:loss-curve, v:train-val-curves, c:validation-set, c:epoch, v:log-scale, v:bar-chart, c:mean, c:seed, py:list, py:tuple, py:for, py:if, py:comparison, py:none, py:variable, py:float, py:string-literal, py:print, py:comment, q:predict, q:choice, q:exercise-with-check, q:explain]
  needs: any

- id: res-research-cycle
  title: "How research works: question, hypothesis, experiment"
  level: basis
  module: research-basis
  idea: "Research starts with a question, turns it into a hypothesis you can test, and an experiment that could prove you wrong."
  covers: [d27-hoe-ai-onderzoek-werkt#0]
  requires: [res-what-is-a-paper]
  introduces: [c:hypothesis, c:experiment]
  uses: [c:paper, c:preprint, c:peer-review, c:generative-ai, c:artificial-intelligence, q:predict, q:choice, q:explain, q:exercise-with-check]
  needs: any

