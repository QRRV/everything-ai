# ===================== gevorderd: mathematics, formally =====================
- id: math-derivative-rules
  title: "Derivative rules"
  level: gevorderd
  module: math-formal
  idea: "A few rules (power, product, exp, log and the chain rule) give the exact derivative of any formula you build from them."
