  title: "Floating point and the log-sum-exp trick"
  level: gevorderd
  module: math-formal
  idea: "Computers store numbers with limited precision, which is why exp of a big logit overflows; the subtract-the-maximum trick from softmax also gives a stable log-sum-exp."
