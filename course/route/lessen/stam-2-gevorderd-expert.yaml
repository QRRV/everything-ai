- id: info-entropy
  title: "Entropy: average surprise"
  level: gevorderd
  module: math-formal
  idea: "Entropy is the expected surprise of a distribution, measured in bits; no code that codes one symbol at a time can do better on average."
  covers: [informatietheorie#0, informatietheorie#1]
