  needs: any

- id: info-cross-entropy-kl
  title: "Cross-entropy and KL divergence"
  level: gevorderd
  module: math-formal
  idea: "Cross-entropy is the surprise when you expect distribution q but the truth is p; KL divergence is the extra surprise above the entropy of p."
