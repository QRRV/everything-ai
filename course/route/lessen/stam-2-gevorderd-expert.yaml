- id: math-matrix-rank
  title: "Rank: how many directions a matrix has"
  level: gevorderd
  module: math-formal
  idea: "The rank of a matrix is the number of independent directions in it; a d×d matrix written as a d×r matrix times an r×d matrix has rank at most r and needs only 2·d·r numbers."
