# Lessons whose home branch is "stam" (the shared foundation), level basis.
# Planning data; the map: key below names the map version. Format: ../FORMAT.md. Titles are English working titles.
tak: stam
map: v2.2
lessons:

# --- module start -----------------------------------------------------------
- id: start-how-this-course-works
  title: "How a lesson works"
  level: basis
  module: start
  idea: "You read a short explanation, run code, predict what happens, try an exercise, and a check tells you why your answer is right or wrong."
  covers: [notebooks#0]
  introduces: [q:run-cell, q:predict, q:exercise-with-check, p:scratchpad, p:restart-lesson, q:choice, q:explain]
  needs: any

- id: start-ai-ml-genai
  title: "AI, machine learning, deep learning and generative AI"
  level: basis
  module: start
  idea: "These four words are nested circles: generative AI is a kind of deep learning, which is a kind of machine learning, which is one way to build AI."
  covers: [definities-en-framings#0, wat-ml-is#1]
  requires: [start-how-this-course-works]
  introduces: [c:artificial-intelligence, c:machine-learning, c:deep-learning, c:generative-ai]
  needs: any

- id: start-rules-vs-learning
  title: "Writing rules versus learning from examples"
  level: basis
  module: start
  idea: "Instead of writing the rules yourself, you show the computer examples and let it find the rule."
  covers: [wat-ml-is#0]
  requires: [start-ai-ml-genai]
  introduces: [c:learning-from-data]
  mentions: [c:example]
  needs: any

- id: start-map-of-ai
  title: "The map of AI and how this course is organized"
  level: basis
  module: start
  idea: "AI is a large field; the course shows the whole map, a shared trunk, branches per area and three levels, and you choose a route through it."
  covers: [definities-en-framings#2]
  requires: [start-ai-ml-genai]
  introduces: [c:course-branch, c:course-level, c:course-route]
  uses: [q:choice, q:predict]
  mentions: [c:model, c:paper, c:attention, c:gpt]
  needs: any

- id: start-using-ai-tools
  tak: bouwen
  title: "Using AI tools with your eyes open"
  level: basis
  module: start
  idea: "A chat assistant is a language model behind an interface: it can explain, draft and code, but it also says wrong things with confidence, so you check what matters."
  covers: [ai-geletterdheid-voor-gebruikers#0, ai-geletterdheid-voor-gebruikers#4, ai-geletterdheid-voor-gebruikers#5]
  requires: [start-ai-ml-genai]
  introduces: [c:ai-assistant, p:verify-ai-output]
  uses: [q:choice, q:predict, q:explain]
  mentions: [c:model, c:language-model]
  needs: any

- id: start-short-history
  title: "A short history of AI"
  level: basis
  module: start
  idea: "AI went through waves of hope and winters; deep learning and then large language models are the latest wave."
  covers: [geschiedenis#2, geschiedenis#4, geschiedenis#5, geschiedenis#6, geschiedenis#7, geschiedenis#8]
  requires: [start-ai-ml-genai]
  introduces: [c:ai-winter]
  uses: [q:choice, q:predict]
  mentions: [c:model, c:language-model, c:perceptron, c:backpropagation, c:gpu, c:neuron, c:layer]
  needs: any

