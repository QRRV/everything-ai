# Routes are ordered lists of lesson ids. A lesson has one place in the course (its domein and module, see
# domeinen.yaml) but can appear in many routes.
# The first route is the kern: the start everyone takes before choosing a domain (besluit 1.18). Every later route is
# the route of one domain and starts after the kern: the core steps of the kern count as done, and every other lesson
# its steps need is a step of the route itself, borrowed from a shared module of the foundation or from another domain.
# A domain without a route of its own yet has its first lessons in the route that uses them.
# "extra: true" marks an optional (verdieping) step in this route; every other step is core for this route.
# Format: FORMAT.md.

routes:
