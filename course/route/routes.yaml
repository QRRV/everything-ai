      nl: "Gevorderd af: je hebt CNN's op kleurenfoto's getraind, de CNN-families van AlexNet tot EfficientNet leren kennen, laten zien waar een CNN naar kijkt, een Vision Transformer gebouwd en je eigen detector of U-Net getraind."
