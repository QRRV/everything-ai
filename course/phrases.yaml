# Fixed phrases of the course itself: the words every lesson shows in the same place.
# The lesson template (course/sjabloon/lessjabloon.md) defines the blocks and the
# check states; this file fixes their wording in both languages, so that the app,
# the checks and every lesson say the same thing. The Dutch wording follows the
# template; the English is the matching fixed form.
# Placeholders in braces ({n}, {total}) are filled in by the app.
phrases:

# --- states of a check (template 4.1) ---------------------------------------
- id: check-empty
  group: check
  en: Nothing to check yet
  nl: Nog niets ingevuld
- id: check-code-error
  group: check
  en: Error in your code
  nl: Fout in je code
- id: check-not-yet
  group: check
  en: Not yet
  nl: Nog niet
- id: check-almost
  group: check
  en: Almost
  nl: Bijna
- id: check-correct
  group: check
  en: Correct
  nl: Goed
- id: check-too-slow
  group: check
  en: Too slow
  nl: Te traag
- id: check-broken
  group: check
  en: This check is broken. That is a mistake in the course, not in your code. Please report it.
  nl: Deze check is stuk. Dat is een fout in de course, niet in jouw code. Meld het alsjeblieft.
- id: exercise-done
  group: check
  en: This exercise is done.
  nl: Deze oefening is af.

